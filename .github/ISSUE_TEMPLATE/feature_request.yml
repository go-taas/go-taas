name: "Feature request"
description: "Suggest a capability or improvement for Go TaaS"
title: "[Feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Describe the problem you are trying to solve, not only the
        solution. Search existing issues and discussions first so design ideas can build on one
        another.

  - type: checkboxes
    id: searched-existing-issues
    attributes:
      label: Pre-submission check
      description: Confirm that you looked for an existing request before opening this one.
      options:
        - label: I searched the existing issues and discussions and did not find this request.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-paragraph description of the proposed capability.
      placeholder: "What should the platform do that it does not do today?"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation and use case
      description: Which problem does this solve, who is affected, and what workaround exists today?
      placeholder: "As an administrator / agent developer / operator, I need ... because ..."
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: Describe the behaviour you expect once the request is implemented.
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which part of the platform would this change?
      options:
        - Console
        - API
        - CLI
        - Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment environment
      description: Where do you run (or intend to run) Go TaaS?
      options:
        - Kubernetes
        - Offline / air-gapped
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Go TaaS version or commit
      description: The version or commit you are running, or "not deployed yet" for a design proposal.
      placeholder: "v1.120.0 or main @ <commit>"

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or related projects you considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Mockups, links to related issues or discussions, or acceptance criteria.
