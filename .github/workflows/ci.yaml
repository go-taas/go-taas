# Continuous Integration: runs on every pull request. Gates merges on
# commit message lint, proto lint, Go lint, unit tests and a plain
# build.
#
# The commitlint gate keeps every commit in a pull request within the
# Conventional Commits format that semantic-release parses on the
# default branch, so a merged PR always produces a well-defined
# version bump.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the range of commits introduced by the pull
          # request must be compared against the base branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate conventional commits
        env:
          # Base branch of the pull request (e.g. main).
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Validate every commit between the base branch and HEAD.
          # Merge commits are skipped automatically by commitlint's
          # built-in ignore rules.
          git fetch origin "${BASE_REF}"
          exec npx --yes commitlint@19 \
            --from "origin/${BASE_REF}" --to HEAD --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Proto lint
        run: buf lint

      - name: Verify generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- proto/ docs/api/; then
            echo "::error::Generated code is stale. Run 'make pbgen' and commit the result."
            git diff --stat -- proto/ docs/api/
            exit 1
          fi

      - name: Go lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make ut

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all binaries
        run: |
          set -euo pipefail
          go build -trimpath -o apps/taas-server/taas-server ./apps/taas-server
          go build -trimpath -o apps/controller/controller ./apps/controller

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            apps/taas-server/taas-server
            apps/controller/controller
          if-no-files-found: error
          retention-days: 7
