apiVersion: v2
name: go-taas
description: |
  Go TaaS control plane: the taas-server (gRPC + REST gateway + embedded
  console) and the controller that reconciles inference workloads into
  Kubernetes. Every third-party dependency (PostgreSQL, Redis, RabbitMQ,
  Keycloak) is configured through this chart's values: the chart either
  provisions a single-replica instance in-cluster or connects to an
  operator-managed one.
type: application
version: 0.1.0
# appVersion tracks the released platform version; the image tag defaults to
# v<appVersion>.
appVersion: "1.84.0"
kubeVersion: ">=1.25.0-0"
home: https://go-taas.com
icon: https://go-taas.com/assets/avatar-512.png
sources:
  - https://github.com/go-taas/go-taas
keywords:
  - llm
  - inference
  - gateway
  - taas
  - ai-platform
maintainers:
  - name: The go-taas Authors
    url: https://go-taas.com
annotations:
  category: AI/MachineLearning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Website
      url: https://go-taas.com
    - name: Documentation
      url: https://go-taas.com/docs.html
    - name: Source
      url: https://github.com/go-taas/go-taas
    - name: Support
      url: https://github.com/go-taas/go-taas/discussions
