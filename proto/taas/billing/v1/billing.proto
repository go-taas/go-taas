syntax = "proto3";

package taas.billing.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/billing/v1;billingv1";

// BillingService maintains the price matrix, performs funds holds and
// settlements, and produces bills.
service BillingService {
  // SetPrice creates or updates a price entry of the model x accelerator
  // matrix.
  // Admin-surface API: served under /api/v1/admin.
  rpc SetPrice(SetPriceRequest) returns (SetPriceResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/billing/prices"
      body: "*"
    };
  }

  // ListPrices returns the price matrix.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListPrices(ListPricesRequest) returns (ListPricesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/prices"};
  }

  // GetBalance returns the prepaid balance or postpaid quota of an
  // organization.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/balance"};
  }

  // ListBills returns generated bills.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListBills(ListBillsRequest) returns (ListBillsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/bills"};
  }

  // ListCharges returns charge records (the billing evidence view),
  // filtered by API key, model and time range.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListCharges(ListChargesRequest) returns (ListChargesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/charges"};
  }

  // CreateAccount creates the organization's single billing account
  // (prepaid or postpaid), optionally crediting an opening balance.
  // Admin-surface API: served under /api/v1/admin.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/accounts"
      body: "*"
    };
  }

  // ListAccounts returns the billing accounts of the caller's
  // organization (zero or one today).
  // Admin-surface API: served under /api/v1/admin.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/accounts"};
  }

  // GetAccount returns one billing account with computed remaining
  // funds and quota usage.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/accounts/{account_id}"};
  }

  // UpdateAccount replaces the mode, monthly quota and overdraw policy
  // of one account.
  // Admin-surface API: served under /api/v1/admin.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/billing/accounts/{account_id}"
      body: "*"
    };
  }

  // Recharge credits a prepaid balance (idempotent on the
  // idempotency key).
  // Admin-surface API: served under /api/v1/admin.
  rpc Recharge(RechargeRequest) returns (RechargeResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/accounts/{account_id}/recharge"
      body: "*"
    };
  }

  // Refund returns credit from a prepaid balance (admin-initiated).
  // Admin-surface API: served under /api/v1/admin.
  rpc Refund(RefundRequest) returns (RefundResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/accounts/{account_id}/refund"
      body: "*"
    };
  }

  // ListTransactions returns the account ledger filtered by account,
  // type and time range, paginated newest-first.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/transactions"};
  }

  // CheckFunds is the internal gateway gating check: may the
  // organization's requests proceed (AD4). No HTTP binding.
  rpc CheckFunds(CheckFundsRequest) returns (CheckFundsResponse);
}

message SetPriceRequest {
  string model_id = 1;
  string accelerator_type = 2;
  // input_price_per_million is the price of one million input tokens, in
  // the platform's billing currency unit.
  double input_price_per_million = 3;
  double output_price_per_million = 4;
  string currency = 5;
  // cached_price_per_million is the price of one million cache-hit
  // tokens (default 0).
  double cached_price_per_million = 6;
  // effective_from is the version's start of validity, unix seconds;
  // 0 means now.
  int64 effective_from = 7;
  // tiers is the optional ordered volume-tier list; empty means flat.
  repeated PriceTier tiers = 8;
}

message SetPriceResponse {
  taas.common.v1.Response response = 1;
  // price_id identifies the stored version (idempotent on the cell
  // version key).
  string price_id = 2;
}

message ListPricesRequest {
  taas.common.v1.PageRequest page = 1;
  string model_id = 2;
  // accelerator_type filters the matrix to one card type.
  string accelerator_type = 3;
  // include_history returns every version instead of the current view.
  bool include_history = 4;
}

message ListPricesResponse {
  taas.common.v1.Response response = 1;
  repeated PriceEntry prices = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message PriceEntry {
  string model_id = 1;
  string accelerator_type = 2;
  double input_price_per_million = 3;
  double output_price_per_million = 4;
  string currency = 5;
  int64 updated_at = 6;
  // price_id identifies the stored version.
  string price_id = 7;
  // cached_price_per_million is the cache-hit token rate.
  double cached_price_per_million = 8;
  // effective_from is the version's start of validity, unix seconds.
  int64 effective_from = 9;
  // tiers is the ordered volume-tier list; empty means flat.
  repeated PriceTier tiers = 10;
}

// PriceTier is one volume tier: rates apply once the organization's
// month-to-date cumulative token volume for (model, card) exceeds the
// previous tiers' bounds. The last tier has up_to_tokens = 0
// (unbounded).
message PriceTier {
  // up_to_tokens is the exclusive upper bound of the tier, in
  // cumulative monthly tokens; 0 on the last tier means unbounded.
  int64 up_to_tokens = 1;
  double input_price_per_million = 2;
  double output_price_per_million = 3;
}

message GetBalanceRequest {
  string organization_id = 1;
}

message GetBalanceResponse {
  taas.common.v1.Response response = 1;
  // mode is "prepaid" (balance) or "postpaid" (quota).
  string mode = 2;
  // balance is deprecated: balance_cents / 100 for one release.
  double balance = 3;
  string currency = 4;
  // balance_cents is the prepaid funds in minor units.
  int64 balance_cents = 5;
  // monthly_quota_cents is the postpaid cap; 0 = unlimited.
  int64 monthly_quota_cents = 6;
  // used_this_cycle_cents is the postpaid usage within the cycle.
  int64 used_this_cycle_cents = 7;
}

message ListBillsRequest {
  taas.common.v1.PageRequest page = 1;
  string organization_id = 2;
  int64 since = 3;
  int64 until = 4;
}

message ListBillsResponse {
  taas.common.v1.Response response = 1;
  repeated BillSummary bills = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message BillSummary {
  string bill_id = 1;
  string organization_id = 2;
  double amount = 3;
  string currency = 4;
  int64 period_start = 5;
  int64 period_end = 6;
  // charge_count is the number of charge records in the month.
  int64 charge_count = 7;
  // unpriced_count is the number of unpriced charge records (amount 0).
  int64 unpriced_count = 8;
}

message ListChargesRequest {
  taas.common.v1.PageRequest page = 1;
  string organization_id = 2;
  int64 since = 3;
  int64 until = 4;
  // api_key_id filters the list to one API key.
  string api_key_id = 5;
  // model_id filters the list to one model.
  string model_id = 6;
}

message ListChargesResponse {
  taas.common.v1.Response response = 1;
  repeated ChargeRecordSummary charges = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// ChargeRecordSummary is one (api_key, model, card, hour) charge group.
message ChargeRecordSummary {
  string charge_id = 1;
  string organization_id = 2;
  string api_key_id = 3;
  string model_id = 4;
  string accelerator_type = 5;
  int64 period_start = 6;
  int64 period_end = 7;
  int64 prompt_tokens = 8;
  int64 completion_tokens = 9;
  int64 cached_tokens = 10;
  int64 reasoning_tokens = 11;
  int64 request_count = 12;
  double amount = 13;
  string currency = 14;
  // price_id names the applied price version; empty when unpriced.
  string price_id = 15;
  // tier_index is the applied tier; -1 means flat rate.
  int32 tier_index = 16;
  // priced reports whether a price applied (false means amount 0).
  bool priced = 17;
  int64 charged_at = 18;
}

message CreateAccountRequest {
  // mode is "prepaid" or "postpaid".
  string mode = 1;
  // monthly_quota_cents is the postpaid monthly cap; 0 = unlimited.
  int64 monthly_quota_cents = 2;
  // overdraw_policy is "block" or "warn" (postpaid enforcement).
  string overdraw_policy = 3;
  // initial_balance_cents is the optional opening balance credited as
  // a recharge transaction (prepaid only).
  int64 initial_balance_cents = 4;
}

message CreateAccountResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
}

message ListAccountsRequest {
  taas.common.v1.PageRequest page = 1;
}

message ListAccountsResponse {
  taas.common.v1.Response response = 1;
  repeated Account accounts = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
}

message UpdateAccountRequest {
  string account_id = 1;
  // mode is "prepaid" or "postpaid".
  string mode = 2;
  // monthly_quota_cents is the postpaid monthly cap; 0 = unlimited.
  int64 monthly_quota_cents = 3;
  // overdraw_policy is "block" or "warn".
  string overdraw_policy = 4;
}

message UpdateAccountResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
}

message RechargeRequest {
  string account_id = 1;
  // amount_cents is the credit amount, positive.
  int64 amount_cents = 2;
  // idempotency_key deduplicates retries; required, <= 128 chars.
  string idempotency_key = 3;
  // note is a free-text reference stored on the transaction.
  string note = 4;
}

message RechargeResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
  Transaction transaction = 3;
}

message RefundRequest {
  string account_id = 1;
  // amount_cents is the refund amount, positive.
  int64 amount_cents = 2;
  // idempotency_key deduplicates retries; required, <= 128 chars.
  string idempotency_key = 3;
  // note is a free-text reference stored on the transaction.
  string note = 4;
}

message RefundResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
  Transaction transaction = 3;
}

message ListTransactionsRequest {
  taas.common.v1.PageRequest page = 1;
  // account_id filters the ledger to one account.
  string account_id = 2;
  // type filters by transaction type: recharge / deduction / refund.
  string type = 3;
  int64 since = 4;
  int64 until = 5;
}

message ListTransactionsResponse {
  taas.common.v1.Response response = 1;
  repeated Transaction transactions = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// Account is the per-organization billing account (AD1).
message Account {
  string account_id = 1;
  string organization_id = 2;
  // mode is "prepaid" or "postpaid".
  string mode = 3;
  // balance_cents is the prepaid funds in minor units.
  int64 balance_cents = 4;
  // monthly_quota_cents is the postpaid cap; 0 = unlimited.
  int64 monthly_quota_cents = 5;
  // used_this_cycle_cents is the postpaid usage within the cycle.
  int64 used_this_cycle_cents = 6;
  // cycle_started_at is the UTC month start the cycle covers, unix
  // seconds.
  int64 cycle_started_at = 7;
  // overdraw_policy is "block" or "warn".
  string overdraw_policy = 8;
  string currency = 9;
  // remaining_cents: prepaid = balance; postpaid = quota - used (0
  // when unlimited).
  int64 remaining_cents = 10;
  // quota_usage_percent is the postpaid usage ratio; 0 when unlimited.
  int32 quota_usage_percent = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

// Transaction is one append-only ledger row (AD7).
message Transaction {
  string transaction_id = 1;
  string account_id = 2;
  // type is "recharge", "deduction" or "refund".
  string type = 3;
  // amount_cents is positive; the direction is implied by type.
  int64 amount_cents = 4;
  // balance_after_cents is the account balance after the write.
  int64 balance_after_cents = 5;
  string idempotency_key = 6;
  // reference is the charge_id for deductions, free text otherwise.
  string reference = 7;
  int64 created_at = 8;
}

message CheckFundsRequest {
  string organization_id = 1;
}

message CheckFundsResponse {
  taas.common.v1.Response response = 1;
  // allowed reports whether requests may proceed.
  bool allowed = 2;
  // reason is "" or "insufficient_funds".
  string reason = 3;
  // mode is "prepaid" / "postpaid" / "" (no account).
  string mode = 4;
  int64 balance_cents = 5;
  int64 monthly_quota_cents = 6;
  int64 used_this_cycle_cents = 7;
}
