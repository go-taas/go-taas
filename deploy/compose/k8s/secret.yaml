# The JuiceFS connection secret the juicefs-taas-models StorageClass
# references. It lives in the yunzhi namespace (where the JuiceFS CSI
# driver is installed) and carries the filesystem name, metadata URL,
# storage backend and credentials.
#
# The values are templated from the .env file by deploy/compose/scripts/
# cluster-up.sh (which substitutes ${JUICE_FS_*} and the MinIO
# credentials), so this file is a template, not a literal manifest.
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-taas-models-secret
  namespace: yunzhi
  labels:
    app.kubernetes.io/part-of: go-taas
    go-taas.com/role: model-weights
type: Opaque
stringData:
  name: ${JUICE_FS_NAME}
  metaurl: ${JUICE_FS_META_URL}
  storage: ${JUICE_FS_STORAGE}
  bucket: ${JUICE_FS_BUCKET}
  access-key: ${JUICE_FS_ACCESS_KEY}
  secret-key: ${JUICE_FS_SECRET_KEY}
  format-options: trash-days=0