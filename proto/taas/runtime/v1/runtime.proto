syntax = "proto3";

package taas.runtime.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/runtime/v1;runtimev1";

// RuntimeService serves the platform serving scheme, the installed
// runtime component health, and the models registered with the runtime
// (feature #47). Admin-surface API: served under /api/v1/admin/runtime.
service RuntimeService {
  // GetRuntimeStatus returns the runtime overview: scheme, availability,
  // runtime name/version, cluster, last checked, reason, and components.
  rpc GetRuntimeStatus(GetRuntimeStatusRequest) returns (GetRuntimeStatusResponse) {
    option (google.api.http) = {get: "/api/v1/admin/runtime"};
  }

  // ListRuntimeComponents returns the runtime components (AIBrix control
  // plane + Envoy AI Gateway under the aibrix scheme, the Controller +
  // Kubernetes API fallback under the plain scheme).
  rpc ListRuntimeComponents(ListRuntimeComponentsRequest) returns (ListRuntimeComponentsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/runtime/components"};
  }

  // GetServingScheme returns the persisted platform serving scheme.
  rpc GetServingScheme(GetServingSchemeRequest) returns (GetServingSchemeResponse) {
    option (google.api.http) = {get: "/api/v1/admin/runtime/scheme"};
  }

  // UpdateServingScheme sets the scheme to plain or aibrix. It is audited
  // and idempotent; a non-{plain,aibrix} value returns 12902.
  rpc UpdateServingScheme(UpdateServingSchemeRequest) returns (UpdateServingSchemeResponse) {
    option (google.api.http) = {put: "/api/v1/admin/runtime/scheme" body: "*"};
  }

  // ListRuntimeModels returns the ModelClaim projection with pagination,
  // name search, and engine/status filters.
  rpc ListRuntimeModels(ListRuntimeModelsRequest) returns (ListRuntimeModelsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/runtime/models"};
  }

  // RegisterRuntimeModel registers a model with the runtime (publishes a
  // desired-state change the Controller reconciles into a ModelClaim).
  rpc RegisterRuntimeModel(RegisterRuntimeModelRequest) returns (RegisterRuntimeModelResponse) {
    option (google.api.http) = {post: "/api/v1/admin/runtime/models" body: "*"};
  }

  // DeregisterRuntimeModel removes a model registration (deletes the
  // ModelClaim). An unknown model_name returns 12903.
  rpc DeregisterRuntimeModel(DeregisterRuntimeModelRequest) returns (DeregisterRuntimeModelResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/runtime/models/{model_name}"};
  }

  // GetPlatformSettings returns the operator-editable platform settings,
  // including the inference gateway (data-plane) hostname users are told
  // to call.
  rpc GetPlatformSettings(GetPlatformSettingsRequest) returns (GetPlatformSettingsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/platform-settings"};
  }

  // UpdatePlatformSettings saves the platform settings. A hostname that is
  // not a plain DNS name (scheme, path or spaces) returns 12905.
  rpc UpdatePlatformSettings(UpdatePlatformSettingsRequest) returns (UpdatePlatformSettingsResponse) {
    option (google.api.http) = {put: "/api/v1/admin/platform-settings" body: "*"};
  }

  // GetPlatformDisplaySettings returns the installation's display
  // preferences: the time zone timestamps are rendered in, the console's
  // default language and the currency amounts are shown in. Served on both
  // surfaces because every console must render the same units.
  // Admin-surface API: served under /api/v1/admin as well.
  rpc GetPlatformDisplaySettings(GetPlatformDisplaySettingsRequest) returns (GetPlatformDisplaySettingsResponse) {
    option (google.api.http) = {
      get: "/api/v1/platform-display-settings"
      additional_bindings {
        get: "/api/v1/admin/platform-display-settings"
      }
    };
  }

  // UpdatePlatformDisplaySettings saves only the display preferences. The
  // gateway settings are a separate page and a separate call: a display
  // save must never blank a hostname it never showed the operator.
  rpc UpdatePlatformDisplaySettings(UpdatePlatformDisplaySettingsRequest) returns (UpdatePlatformDisplaySettingsResponse) {
    option (google.api.http) = {put: "/api/v1/admin/platform-display-settings" body: "*"};
  }
}

message UpdatePlatformDisplaySettingsRequest {
  // timezone is an IANA zone name; empty means the viewer's own zone.
  string timezone = 1;
  // default_language is "en" or "zh".
  string default_language = 2;
  // currency is the display currency (ISO 4217).
  string currency = 3;
}

message UpdatePlatformDisplaySettingsResponse {
  taas.common.v1.Response response = 1;
  // timezone / default_language / currency are the saved preferences,
  // normalized (an unsupported value returns 12905 rather than a silent
  // default).
  string timezone = 2;
  string default_language = 3;
  string currency = 4;
  // billing_currency is the platform's settlement currency from the server
  // configuration. The console prints amounts in the display currency, so
  // the two are shown side by side: they are meant to be the same.
  string billing_currency = 5;
}

message GetPlatformDisplaySettingsRequest {}

message GetPlatformDisplaySettingsResponse {
  taas.common.v1.Response response = 1;
  // timezone is an IANA zone name ("Asia/Shanghai"). Empty means the
  // browser's own zone.
  string timezone = 2;
  // default_language is the console language a first-time visitor gets:
  // "en" or "zh".
  string default_language = 3;
  // currency is the platform's display currency (ISO 4217, e.g. "CNY").
  string currency = 4;
  // billing_currency is the platform's settlement currency from the server
  // configuration; amounts are stored in it and printed in the display
  // currency. Both are returned so the console can warn when they differ.
  string billing_currency = 5;
}

message GetRuntimeStatusRequest {}

message GetRuntimeStatusResponse {
  taas.common.v1.Response response = 1;
  RuntimeStatus runtime = 2;
}

message RuntimeStatus {
  string scheme = 1;          // plain | aibrix
  string availability = 2;    // available | degraded | unavailable | unknown
  string runtime_name = 3;    // plain | aibrix
  string runtime_version = 4; // optional, reported by AIBrix
  string cluster_name = 5;
  int64 last_checked_at = 6;
  string reason = 7;
  repeated RuntimeComponent components = 8;
}

message ListRuntimeComponentsRequest {}

message ListRuntimeComponentsResponse {
  taas.common.v1.Response response = 1;
  repeated RuntimeComponent components = 2;
}

message RuntimeComponent {
  string component_id = 1;
  string name = 2;
  string kind = 3;       // control_plane | gateway | fallback
  string namespace = 4;
  string status = 5;     // ready | progressing | degraded | unavailable | unknown
  int64 ready_replicas = 6;
  int64 desired_replicas = 7;
  int64 last_checked_at = 8;
}

message GetServingSchemeRequest {}

message GetServingSchemeResponse {
  taas.common.v1.Response response = 1;
  ServingScheme scheme = 2;
}

message ServingScheme {
  string scheme = 1;   // plain | aibrix
  int64 updated_at = 2;
  string updated_by = 3;
}

message UpdateServingSchemeRequest {
  string scheme = 1;   // plain | aibrix
}

message UpdateServingSchemeResponse {
  taas.common.v1.Response response = 1;
  ServingScheme scheme = 2;
}

message ListRuntimeModelsRequest {
  taas.common.v1.PageRequest page = 1;
  string name = 2;     // model-name substring search
  string engine = 3;   // vllm | sglang
  string status = 4;   // ready | progressing | degraded | failed | unknown
}

message ListRuntimeModelsResponse {
  taas.common.v1.Response response = 1;
  repeated RegisteredModel models = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message RegisteredModel {
  string model_name = 1;
  string engine = 2;
  int64 replicas = 3;
  int64 ready_replicas = 4;
  int64 ready_candidates = 5;
  repeated ModelCondition conditions = 6;
  string status = 7;
  int64 created_at = 8;
  int64 age_seconds = 9;
}

message ModelCondition {
  string type = 1;
  string status = 2;
  string reason = 3;
  string message = 4;
  int64 last_transition_time = 5;
}

message RegisterRuntimeModelRequest {
  string model_name = 1;
  string engine = 2;       // vllm | sglang
  int64 replicas = 3;      // 0..32
  string artifact_url = 4;
  map<string, string> pod_selector = 5;
  map<string, string> engine_args = 6;
}

message RegisterRuntimeModelResponse {
  taas.common.v1.Response response = 1;
  RegisteredModel model = 2;
}

message DeregisterRuntimeModelRequest {
  string model_name = 1;
}

message DeregisterRuntimeModelResponse {
  taas.common.v1.Response response = 1;
}

// PlatformSettings are the operator-editable, platform-wide settings.
// They are stored in one row because they describe the installation, not
// a tenant.
message PlatformSettings {
  // inference_gateway_hostname is the data-plane (inference gateway)
  // hostname users call, for example "api.example.com". Empty means the
  // platform falls back to the configured value or to the gateway it
  // discovers in the cluster.
  string inference_gateway_hostname = 1;
  // inference_gateway_scheme is "http" or "https" (default). It is part
  // of the URL users are given, so it is stored next to the hostname.
  string inference_gateway_scheme = 2;
  // inference_gateway_internal_url is the in-cluster URL the platform
  // itself uses to reach the gateway (empty means discover it). Set it
  // when the public hostname is not resolvable from inside the cluster.
  string inference_gateway_internal_url = 3;
  // inference_base_url is the composed public base URL, for example
  // "https://api.example.com/v1". Read-only: derived from the fields
  // above, and empty when no hostname is configured.
  string inference_base_url = 4;
  // updated_by is the acting admin user's display label.
  string updated_by = 5;
  // updated_at is the last change time (unix seconds).
  int64 updated_at = 6;
  // served_hostnames are the hostnames the data-plane route actually
  // publishes right now. When they do not contain
  // inference_gateway_hostname the setting is not in effect (for example
  // the chart's route was never created), which the console surfaces.
  repeated string served_hostnames = 7;
  // timezone is the IANA zone every console renders timestamps in. Empty
  // means the browser's own zone.
  string timezone = 8;
  // default_language is the language a first-time visitor gets ("en" or
  // "zh").
  string default_language = 9;
  // currency is the ISO-4217 code every console shows amounts in.
  string currency = 10;
}

message GetPlatformSettingsRequest {}

message GetPlatformSettingsResponse {
  taas.common.v1.Response response = 1;
  PlatformSettings settings = 2;
}

message UpdatePlatformSettingsRequest {
  string inference_gateway_hostname = 1;
  string inference_gateway_scheme = 2;
  string inference_gateway_internal_url = 3;
  // timezone / default_language / currency are the display preferences.
  // An unknown zone, a language other than en/zh and an unsupported
  // currency return 12905.
  string timezone = 4;
  string default_language = 5;
  string currency = 6;
}

message UpdatePlatformSettingsResponse {
  taas.common.v1.Response response = 1;
  PlatformSettings settings = 2;
}
