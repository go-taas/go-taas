{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-taas.console.name" . }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with .Values.console.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.console.service.type }}
  ports:
    # The standalone console (nginx serving the Vite bundle).
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "go-taas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- end }}