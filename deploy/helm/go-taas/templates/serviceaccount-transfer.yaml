{{- if and .Values.transfer .Values.transfer.enabled .Values.transfer.serviceAccount.create }}
{{- $namespace := include "go-taas.transfer.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "go-taas.transfer.serviceAccountName" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: transfer
  {{- with .Values.transfer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
