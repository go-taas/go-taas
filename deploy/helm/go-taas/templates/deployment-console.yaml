{{- /* Defensive lookups: an upgrade from a values set written before the
       console block existed passes only a partial map, so every nested
       access falls back to the documented default. */ -}}
{{- $console := .Values.console | default dict }}
{{- if $console.enabled }}
{{- $svc := $console.service | default dict }}
{{- $image := $console.image | default dict }}
{{- $podSC := $console.podSecurityContext | default dict }}
{{- $sc := $console.securityContext | default dict }}
{{- $writable := $console.writableDirs | default list }}
{{- $liveness := $console.livenessProbe | default dict }}
{{- $readiness := $console.readinessProbe | default dict }}
{{- $taasServer := .Values.taasServer | default dict }}
{{- $serverSvc := $taasServer.service | default dict }}
{{- $gateway := $serverSvc.gateway | default dict }}
{{- $gatewayPort := $gateway.port | default 9091 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-taas.console.name" . }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ $console.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "go-taas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "go-taas.labels" . | nindent 8 }}
        app.kubernetes.io/component: console
        {{- with $console.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with $console.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $podSC }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $console.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: console
          image: {{ include "go-taas.image" (dict "root" . "name" "taas-console" "image" $image) }}
          imagePullPolicy: {{ $image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port | default 8080 }}
              protocol: TCP
          env:
            # The gateway the console proxies /api/ to. Defaults to the
            # server service; the nginx template substitutes it at startup.
            - name: TASS_PROXY_PASS
              value: {{ $console.proxyPass | default (printf "http://%s:%d" (include "go-taas.server.name" .) (int $gatewayPort)) | quote }}
            {{- with $console.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ $liveness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $liveness.periodSeconds | default 20 }}
            timeoutSeconds: {{ $liveness.timeoutSeconds | default 3 }}
            failureThreshold: {{ $liveness.failureThreshold | default 3 }}
          {{- end }}
          {{- if $readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ $readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $readiness.periodSeconds | default 10 }}
            timeoutSeconds: {{ $readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ $readiness.failureThreshold | default 3 }}
          {{- end }}
          {{- with $console.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sc }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $console.extraVolumeMounts $writable }}
          volumeMounts:
            {{- range $writable }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- with $console.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $console.extraVolumes $writable }}
      volumes:
        {{- range $writable }}
        - name: {{ .name }}
          emptyDir: {}
        {{- end }}
        {{- with $console.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}