{{- if .Values.gatewayPlugin.enabled }}
{{/*
The data-plane gateway plugin.

It is attached to the server-owned data-plane HTTPRoute rather than to the
AIBrix gateway, because that is the only Envoy in the chain go-taas owns: a
policy in `aibrix-system` belongs to another Helm release and would be
overwritten. Being first in the chain also means an unauthenticated request
is rejected before it reaches the second proxy or a model pod.

Auth and metering happen here (architecture Section 3.2.1, steps 01 and 04);
routing stays with AIBrix.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ include "go-taas.fullname" . }}-gateway-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.dataPlane.routeName | default "taas-data-plane" }}
  wasm:
    - name: go-taas-gateway-plugin
      rootID: go-taas-gateway-plugin
      # Fail closed by default: a plugin that cannot run must block traffic,
      # not admit it unverified.
      failOpen: {{ .Values.gatewayPlugin.failOpen | default false }}
      code:
        type: HTTP
        http:
          # Served by the server from its own image, so one release produces
          # exactly one plugin version and no registry credentials are needed.
          url: {{ include "go-taas.gatewayPluginArtifactURL" . | quote }}
          {{- with .Values.gatewayPlugin.pluginSha256 }}
          sha256: {{ . | quote }}
          {{- end }}
      config:
        cluster: {{ include "go-taas.gatewayPluginCluster" . | quote }}
        host: {{ .Values.gatewayPlugin.internalHostname | default "taas-internal.invalid" | quote }}
        verify_path: /internal/gateway/verify
        usage_path: /internal/gateway/usage
        token: {{ include "go-taas.gatewayPluginToken" . | quote }}
        cache_ttl_ms: {{ include "go-taas.gatewayPluginMillis" (dict "value" (.Values.gatewayPlugin.cacheTTL | default "30s") "fallback" 30000) | int64 }}
        verify_timeout_ms: {{ include "go-taas.gatewayPluginMillis" (dict "value" (.Values.gatewayPlugin.verifyTimeout | default "500ms") "fallback" 500) | int64 }}
        max_body_bytes: {{ .Values.gatewayPlugin.maxBodyBytes | default 1048576 | int64 }}
        protected_prefixes:
          {{- range (.Values.gatewayPlugin.protectedPrefixes | default (list "/v1/")) }}
          - {{ . | quote }}
          {{- end }}
---
{{/*
The internal route the plugin dispatches to.

Envoy needs a configured cluster for a Wasm HTTP call, and clusters are one
per HTTPRoute rule, so reaching the server's internal API requires a route.
This one is attached to the TLS listener only and carries a hostname that is
deliberately not in DNS and not in any certificate, so it cannot be reached
from the internet — only from the proxy, which addresses it by cluster name.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "go-taas.fullname" . }}-internal-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-api
spec:
  hostnames:
    - {{ .Values.gatewayPlugin.internalHostname | default "taas-internal.invalid" | quote }}
  parentRefs:
    {{- $dp := .Values.dataPlane | default dict }}
    {{- $parent := $dp.parentRef | default dict }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $parent.name | default "envoy-gateway" }}
      namespace: {{ $parent.namespace | default "yunzhi" }}
      sectionName: {{ $parent.sectionName | default "https" }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /internal/gateway
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "go-taas.fullname" . }}-server
          port: {{ .Values.taasServer.service.monitor.port | default 9092 }}
          weight: 1
{{- end }}
