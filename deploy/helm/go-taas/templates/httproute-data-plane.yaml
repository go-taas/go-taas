{{- if and .Values.dataPlane.enabled .Values.dataPlane.hostname }}
{{- $dp := .Values.dataPlane }}
{{- /*
A `--reuse-values` upgrade reuses the previous release's values, so a
sub-value added to values.yaml afterwards is absent rather than defaulted.
`required` turns that into a message naming the missing key instead of an
API-server validation error about nulls.
*/}}
{{- $parent := $dp.parentRef | default dict }}
{{- $backend := $dp.backend | default dict }}
{{- $parentName := required "dataPlane.parentRef.name is required (the Gateway that terminates TLS)" $parent.name }}
{{- $parentNamespace := required "dataPlane.parentRef.namespace is required" $parent.namespace }}
{{- $backendName := required "dataPlane.backend.name is required (the inference gateway Service)" $backend.name }}
{{- $backendNamespace := required "dataPlane.backend.namespace is required" $backend.namespace }}
{{- $backendPort := required "dataPlane.backend.port is required" $backend.port }}
{{- $timeout := $dp.requestTimeout | default "600s" }}
{{- /*
The data plane is the inference gateway, not this server: the control plane
handles management calls and the data plane handles inference. This route
publishes the gateway under the hostname tenants call, so inference never
passes through the control-plane process.

The backend lives in the gateway's namespace, so the route needs a
ReferenceGrant there permitting HTTPRoutes from this namespace to use its
Services.
*/}}
{{- if ne $backendNamespace .Release.Namespace }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "go-taas.fullname" . }}-data-plane
  namespace: {{ $backendNamespace }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Release.Namespace }}
  to:
    - group: ""
      kind: Service
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "go-taas.fullname" . }}-data-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
spec:
  hostnames:
    - {{ $dp.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $parentName }}
      namespace: {{ $parentNamespace }}
      {{- with $parent.sectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- if $dp.enablePlainHTTP }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $parentName }}
      namespace: {{ $parentNamespace }}
      sectionName: http
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $backendName }}
          namespace: {{ $backendNamespace }}
          port: {{ $backendPort }}
          weight: 1
      timeouts:
        request: {{ $timeout }}
{{- end }}
