syntax = "proto3";

package taas.metering.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/metering/v1;meteringv1";

// MeteringService consumes token-usage events from the data-plane gateway,
// produces tamper-evident metering vouchers and forwards settlement
// events to the billing pipeline.
service MeteringService {
  // IngestMeteringEvent records one token-usage event. It is called by
  // the gateway's Wasm plugin through the message queue (or directly in
  // tests); it has no HTTP binding (cluster-internal surface).
  rpc IngestMeteringEvent(IngestMeteringEventRequest) returns (IngestMeteringEventResponse);

  // ListVouchers returns metering vouchers for auditing, filtered by
  // API key, model and time range.
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc ListVouchers(ListVouchersRequest) returns (ListVouchersResponse) {
    option (google.api.http) = {
      get: "/api/v1/metering/vouchers"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        get: "/api/v1/admin/metering/vouchers"
      }
    };
  }

  // GetVoucher returns one metering voucher for audit drill-down.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetVoucher(GetVoucherRequest) returns (GetVoucherResponse) {
    option (google.api.http) = {get: "/api/v1/admin/metering/vouchers/{voucher_id}"};
  }

  // GetUsageSummary returns per-key (default) or per-model usage
  // aggregates for the organization and time range, split into settled
  // and pending hours.
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse) {
    option (google.api.http) = {
      get: "/api/v1/metering/usage-summary"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        get: "/api/v1/admin/metering/usage-summary"
      }
    };
  }

  // ListUsageRecords returns settled usage records (the billing
  // evidence view), filtered by API key and time range.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListUsageRecords(ListUsageRecordsRequest) returns (ListUsageRecordsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/metering/usage-records"};
  }

  // GetUsageDashboard returns summary cards and daily time buckets
  // grouped by a dimension, joining metering usage with billing charge
  // records for a unified usage x cost view (feature #9).
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc GetUsageDashboard(GetUsageDashboardRequest) returns (GetUsageDashboardResponse) {
    option (google.api.http) = {
      get: "/api/v1/metering/usage-dashboard"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        get: "/api/v1/admin/metering/usage-dashboard"
      }
    };
  }

  // ListRequestLogs returns per-request metadata logs, filterable by
  // api key, model, status and time range (feature #12).
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc ListRequestLogs(ListRequestLogsRequest) returns (ListRequestLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/metering/request-logs"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        get: "/api/v1/admin/metering/request-logs"
      }
    };
  }

  // GetRequestLog returns one request log for drill-down (feature #12).
  // Admin-surface API: served under /api/v1/admin.
  rpc GetRequestLog(GetRequestLogRequest) returns (GetRequestLogResponse) {
    option (google.api.http) = {get: "/api/v1/admin/metering/request-logs/{request_log_id}"};
  }

  // GetUsageKeysOverview returns per-key analytics: summary cards, a
  // top-keys ranking, a per-key table, and a per-key trend. The admin
  // binding is the fleet-wide view (cross-org by default, optional org
  // filter); the user binding is tenant-scoped to the caller's org.
  rpc GetUsageKeysOverview(GetUsageKeysOverviewRequest) returns (GetUsageKeysOverviewResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/usage/keys"
      additional_bindings: {get: "/api/v1/usage/keys"}
    };
  }

  // GetUsageKeys returns single-key analytics: summary cards and a
  // per-key trend. The admin binding covers any key; the user binding is
  // tenant-scoped.
  rpc GetUsageKeys(GetUsageKeysRequest) returns (GetUsageKeysResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/usage/keys/{api_key_id}"
      additional_bindings: {get: "/api/v1/usage/keys/{api_key_id}"}
    };
  }

  // GetErrorAnalysisOverview returns error analysis: summary cards, a
  // top-causes ranking, and an error-rate trend. The admin binding is
  // the fleet-wide view (cross-org by default, optional org filter); the
  // user binding is tenant-scoped to the caller's org.
  rpc GetErrorAnalysisOverview(GetErrorAnalysisOverviewRequest) returns (GetErrorAnalysisOverviewResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/errors"
      additional_bindings: {get: "/api/v1/errors"}
    };
  }

  // GetErrorAnalysis returns single-error-code analysis: summary cards
  // and an error-rate trend. The admin binding covers any error; the
  // user binding is tenant-scoped.
  rpc GetErrorAnalysis(GetErrorAnalysisRequest) returns (GetErrorAnalysisResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/errors/{error_code}"
      additional_bindings: {get: "/api/v1/errors/{error_code}"}
    };
  }
}

message IngestMeteringEventRequest {
  // request_id uniquely identifies the inference request.
  string request_id = 1;
  string organization_id = 2;
  string api_key_id = 3;
  string model_id = 4;
  // token_usage carries the per-part token counts.
  TokenUsage usage = 5;
  int64 completed_at = 6;
  // service_id optionally names the inference service that served the
  // request.
  string service_id = 7;
  // accelerator_type optionally names the card type that served the
  // request; billing resolves it on its own usage lines (feature #5).
  string accelerator_type = 8;
  // latency_ms is the request latency in milliseconds (feature #12).
  int64 latency_ms = 9;
  // status is success / error / streaming (feature #12).
  RequestLogStatus status = 10;
  // error is the failure reason; empty on success (feature #12).
  string error = 11;
  // ttft_ms is the time-to-first-token (prefill phase) in milliseconds
  // (feature #27, AD3).
  int64 ttft_ms = 12;
  // generation_ms is the generation (decode phase) in milliseconds
  // (feature #27, AD3).
  int64 generation_ms = 13;
}

message TokenUsage {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 cached_tokens = 3;
  int64 reasoning_tokens = 4;
}

message IngestMeteringEventResponse {
  taas.common.v1.Response response = 1;
  string voucher_id = 2;
}

message ListVouchersRequest {
  taas.common.v1.PageRequest page = 1;
  string organization_id = 2;
  int64 since = 3;
  int64 until = 4;
  // api_key_id filters the list to one API key.
  string api_key_id = 5;
  // model_id filters the list to one model.
  string model_id = 6;
  // owner_user_id filters the vouchers to one API key owner.
  string owner_user_id = 7;
  // project_id filters the vouchers to one project.
  string project_id = 8;
}

message ListVouchersResponse {
  taas.common.v1.Response response = 1;
  repeated VoucherSummary vouchers = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message VoucherSummary {
  string voucher_id = 1;
  string request_id = 2;
  string organization_id = 3;
  string model_id = 4;
  TokenUsage usage = 5;
  int64 completed_at = 6;
  // api_key_id is the API Key that made the request.
  string api_key_id = 7;
  // service_id names the inference service when known.
  string service_id = 8;
  // settled reports whether the settlement runner has linked this
  // voucher to a usage record.
  bool settled = 9;
  // estimated_cost_cents is the per-request estimated cost in minor
  // units, computed on read against the effective-dated price at
  // completed_at (feature #9). 0 when unpriced.
  int64 estimated_cost_cents = 10;
  // priced reports whether a price entry applied to this request.
  bool priced = 11;
  // owner_user_id is the key owner the request was attributed to;
  // empty for an organization-shared key.
  string owner_user_id = 12;
  // project_id is the key's project at request time; empty when
  // unassigned.
  string project_id = 13;
}

message GetVoucherRequest {
  string voucher_id = 1;
}

message GetVoucherResponse {
  taas.common.v1.Response response = 1;
  VoucherSummary voucher = 2;
}

message GetUsageSummaryRequest {
  // organization_id is derived from the X-Organization-Id header by the
  // gateway; the field exists for gRPC-direct callers.
  string organization_id = 1;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 24h. A range > 92 days is rejected.
  int64 since = 2;
  int64 until = 3;
  // group_by selects the aggregation key: "api_key" (default),
  // "model", "user" or "project".
  string group_by = 4;
}

message UsageSummaryRow {
  // group_key is the api_key_id or model_id the row aggregates over.
  string group_key = 1;
  int64 prompt_tokens = 2;
  int64 completion_tokens = 3;
  int64 cached_tokens = 4;
  int64 reasoning_tokens = 5;
  int64 request_count = 6;
  // settled_hours/pending_hours count the distinct hour buckets that
  // are fully settled vs still pending for this group.
  int64 settled_hours = 7;
  int64 pending_hours = 8;
}

message GetUsageSummaryResponse {
  taas.common.v1.Response response = 1;
  repeated UsageSummaryRow rows = 2;
}

message ListUsageRecordsRequest {
  taas.common.v1.PageRequest page = 1;
  string organization_id = 2;
  int64 since = 3;
  int64 until = 4;
  // api_key_id filters the records to one API key.
  string api_key_id = 5;
  // owner_user_id filters the records to one API key owner.
  string owner_user_id = 6;
  // project_id filters the records to one project.
  string project_id = 7;
}

message UsageRecordSummary {
  string usage_record_id = 1;
  string organization_id = 2;
  string api_key_id = 3;
  int64 period_start = 4;
  int64 period_end = 5;
  int64 prompt_tokens = 6;
  int64 completion_tokens = 7;
  int64 cached_tokens = 8;
  int64 reasoning_tokens = 9;
  int64 request_count = 10;
  int64 settled_at = 11;
  // owner_user_id is the key owner the usage was attributed to.
  string owner_user_id = 12;
  // project_id is the key's project at settlement time.
  string project_id = 13;
}

message ListUsageRecordsResponse {
  taas.common.v1.Response response = 1;
  repeated UsageRecordSummary records = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// DashboardGroupBy selects the aggregation dimension of the usage
// dashboard.
enum DashboardGroupBy {
  DASHBOARD_GROUP_BY_UNSPECIFIED = 0;
  // DASHBOARD_GROUP_BY_API_KEY groups by api_key_id (default).
  DASHBOARD_GROUP_BY_API_KEY = 1;
  // DASHBOARD_GROUP_BY_MODEL groups by model_id.
  DASHBOARD_GROUP_BY_MODEL = 2;
  // DASHBOARD_GROUP_BY_ACCELERATOR_TYPE groups by accelerator_type.
  DASHBOARD_GROUP_BY_ACCELERATOR_TYPE = 3;
}

message GetUsageDashboardRequest {
  // organization_id is derived from the X-Organization-Id header by the
  // gateway; the field exists for gRPC-direct callers.
  string organization_id = 1;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 24h. A range > 92 days is rejected (10404).
  int64 since = 2;
  int64 until = 3;
  // group_by selects the aggregation dimension: "api_key" (default),
  // "model" or "accelerator_type".
  string group_by = 4;
}

// DashboardCard is the headline summary of the dashboard range.
message DashboardCard {
  // total_cost_cents is the summed charge amount in minor units.
  int64 total_cost_cents = 1;
  // total_cost_micros is the same amount at 1e-6 currency precision, so
  // a sub-cent charge is not rounded away. Clients that can show it
  // should prefer it over total_cost_cents.
  int64 total_cost_micros = 10;
  string currency = 2;
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  int64 cached_tokens = 5;
  int64 reasoning_tokens = 6;
  int64 request_count = 7;
  // unpriced_request_count counts requests with no applied price.
  int64 unpriced_request_count = 8;
  // data_through is the last complete hour covered by charging (the
  // charge watermark); hours past it are pending.
  int64 data_through = 9;
}

// DashboardGroup is one group's aggregate within a daily bucket.
message DashboardGroup {
  // group_key is the api_key_id / model_id / accelerator_type.
  string group_key = 1;
  int64 cost_cents = 2;
  // cost_micros is the same amount at 1e-6 currency precision.
  int64 cost_micros = 9;
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  int64 cached_tokens = 5;
  int64 reasoning_tokens = 6;
  int64 request_count = 7;
  // priced is false when any contributing charge record is unpriced.
  bool priced = 8;
}

// DailyBucket is one UTC day's groups.
message DailyBucket {
  // date is the UTC day start, unix seconds.
  int64 date = 1;
  repeated DashboardGroup groups = 2;
}

message GetUsageDashboardResponse {
  taas.common.v1.Response response = 1;
  DashboardCard cards = 2;
  repeated DailyBucket daily_buckets = 3;
}

// RequestLogStatus is the outcome of an inference request (feature #12).
enum RequestLogStatus {
  REQUEST_LOG_STATUS_UNSPECIFIED = 0;
  REQUEST_LOG_STATUS_SUCCESS = 1;
  REQUEST_LOG_STATUS_ERROR = 2;
  REQUEST_LOG_STATUS_STREAMING = 3;
}

// RequestLog is one per-request metadata log (feature #12).
message RequestLog {
  string request_log_id = 1;
  string request_id = 2;
  string organization_id = 3;
  string api_key_id = 4;
  string model_id = 5;
  // service_id is empty when unknown.
  string service_id = 6;
  int64 prompt_tokens = 7;
  int64 completion_tokens = 8;
  int64 cached_tokens = 9;
  int64 reasoning_tokens = 10;
  int64 latency_ms = 11;
  RequestLogStatus status = 12;
  // error is the failure reason; empty on success.
  string error = 13;
  int64 created_at = 14;
}

// ---- API key usage analytics (feature #28) ----

message GetUsageKeysOverviewRequest {
  // organization_id is an optional fleet filter. On the admin surface
  // it is read from X-Organization-Id (or the session active org);
  // absent means fleet-wide (AD9).
  string organization_id = 1;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 24h. A range > 92 days is rejected (10404).
  int64 since = 2;
  int64 until = 3;
  // model_id optionally filters the cards, keys, and series to one model.
  string model_id = 4;
  // owner_user_id optionally filters to one API key owner.
  string owner_user_id = 5;
  // project_id optionally filters to one project.
  string project_id = 6;
}

message GetUsageKeysOverviewResponse {
  taas.common.v1.Response response = 1;
  UsageKeysCard cards = 2;
  repeated UsageKeyRow keys = 3;
  repeated UsageKeyTopRow top_keys = 4;
  repeated UsageKeysSeriesPoint series = 5;
}

message GetUsageKeysRequest {
  // organization_id is derived from the session active org (user
  // binding) or X-Organization-Id (admin binding); the field exists for
  // gRPC-direct callers.
  string organization_id = 1;
  // api_key_id is the path parameter.
  string api_key_id = 2;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 24h. A range > 92 days is rejected (10404).
  int64 since = 3;
  int64 until = 4;
}

message GetUsageKeysResponse {
  taas.common.v1.Response response = 1;
  UsageKeysCard cards = 2;
  repeated UsageKeysSeriesPoint series = 3;
}

// UsageKeysCard is the headline summary of the range. error_rate and
// share_pct are derived client-side; the wire carries integer counts,
// integer milliseconds, and integer cents only.
message UsageKeysCard {
  int64 request_count = 1;
  int64 error_count = 2;
  int64 total_tokens = 3;
  int64 total_cost_cents = 4;
  // total_cost_micros is the same amount at 1e-6 currency precision.
  int64 total_cost_micros = 8;
  int64 avg_latency_ms = 5;
  int64 p95_latency_ms = 6;
  // data_through is the start of the last complete bucket covered by
  // request logs (AD7); buckets past it are pending.
  int64 data_through = 7;
}

// UsageKeyRow is one API key's aggregate in the per-key table.
message UsageKeyRow {
  string api_key_id = 1;
  string api_key_name = 2;
  string organization_id = 3;
  int64 request_count = 4;
  int64 error_count = 5;
  int64 total_tokens = 6;
  int64 total_cost_cents = 7;
  // total_cost_micros is the same amount at 1e-6 currency precision.
  int64 total_cost_micros = 15;
  int64 avg_latency_ms = 8;
  int64 p95_latency_ms = 9;
  // data_through is the key's last complete bucket (AD7).
  int64 data_through = 10;
  // owner_user_id is the key's personal owner; empty when shared.
  string owner_user_id = 11;
  // owner_display_name is the owner's display name (else username).
  string owner_display_name = 12;
  // project_id is the key's project; empty when unassigned.
  string project_id = 13;
  // project_display_name is the project's display name.
  string project_display_name = 14;
}

// UsageKeyTopRow is one key in the top-keys ranking (default 5 by cost).
message UsageKeyTopRow {
  string api_key_id = 1;
  string api_key_name = 2;
  int64 total_cost_cents = 3;
  // total_cost_micros is the same amount at 1e-6 currency precision.
  int64 total_cost_micros = 7;
  int64 request_count = 4;
  int64 total_tokens = 5;
  // share_pct is derived client-side as key cost / total cost.
  int64 share_pct = 6;
}

// UsageKeysSeriesPoint is one time bucket of the series.
message UsageKeysSeriesPoint {
  // bucket is the bucket start, unix seconds (hourly for ranges <= 7
  // days, daily otherwise, AD5).
  int64 bucket = 1;
  int64 request_count = 2;
  int64 error_count = 3;
  int64 total_tokens = 4;
  int64 total_cost_cents = 5;
  // total_cost_micros is the same amount at 1e-6 currency precision.
  int64 total_cost_micros = 8;
  int64 avg_latency_ms = 6;
  int64 p95_latency_ms = 7;
}

// ---- Error analysis (feature #31) ----

message GetErrorAnalysisOverviewRequest {
  // organization_id is an optional fleet filter. On the admin surface
  // it is read from X-Organization-Id (or the session active org);
  // absent means fleet-wide (AD9).
  string organization_id = 1;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 24h. A range > 92 days is rejected (10404).
  int64 since = 2;
  int64 until = 3;
  // model_id optionally filters the cards, causes, and series to one
  // model.
  string model_id = 4;
}

message GetErrorAnalysisOverviewResponse {
  taas.common.v1.Response response = 1;
  ErrorAnalysisCard cards = 2;
  repeated ErrorCauseRow causes = 3;
  repeated ErrorSeriesPoint series = 4;
}

message GetErrorAnalysisRequest {
  // organization_id is derived from the session active org (user
  // binding) or X-Organization-Id (admin binding); the field exists for
  // gRPC-direct callers.
  string organization_id = 1;
  // error_code is the path parameter.
  string error_code = 2;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 24h. A range > 92 days is rejected (10404).
  int64 since = 3;
  int64 until = 4;
}

message GetErrorAnalysisResponse {
  taas.common.v1.Response response = 1;
  ErrorAnalysisCard cards = 2;
  repeated ErrorSeriesPoint series = 3;
}

// ErrorAnalysisCard is the headline summary of the range. error_rate and
// top_cause_share_pct are derived client-side; the wire carries integer
// counts only.
message ErrorAnalysisCard {
  int64 error_count = 1;
  int64 request_count = 2;
  // top_cause is the top error code by count.
  string top_cause = 3;
  // top_cause_share_pct is derived client-side as top cause count /
  // total error count.
  int64 top_cause_share_pct = 4;
  // data_through is the start of the last complete bucket covered by
  // request logs (AD7); buckets past it are pending.
  int64 data_through = 5;
}

// ErrorCauseRow is one error code's aggregate in the top-causes table.
message ErrorCauseRow {
  string error_code = 1;
  string error_message = 2;
  int64 error_count = 3;
  // error_rate and share_pct are derived client-side.
  int64 error_rate = 4;
  int64 share_pct = 5;
}

// ErrorSeriesPoint is one time bucket of the series.
message ErrorSeriesPoint {
  // bucket is the bucket start, unix seconds (hourly for ranges <= 7
  // days, daily otherwise, AD5).
  int64 bucket = 1;
  int64 error_count = 2;
  int64 request_count = 3;
}

message ListRequestLogsRequest {
  taas.common.v1.PageRequest page = 1;
  int64 since = 2;
  int64 until = 3;
  // api_key_id filters by the calling API key.
  string api_key_id = 4;
  // model_id filters by the served model.
  string model_id = 5;
  // status filters by outcome; unspecified = all.
  RequestLogStatus status = 6;
}

message ListRequestLogsResponse {
  taas.common.v1.Response response = 1;
  repeated RequestLog request_logs = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message GetRequestLogRequest {
  string request_log_id = 1;
}

message GetRequestLogResponse {
  taas.common.v1.Response response = 1;
  RequestLog request_log = 2;
}
