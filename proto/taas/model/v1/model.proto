syntax = "proto3";

package taas.model.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/model/v1;modelv1";

// ModelService manages model assets: metadata registration, versioning,
// weight paths in object storage and tenant-level authorization.
service ModelService {
  // RegisterModel registers a new model with its first version.
  // Admin-surface API: served under /api/v1/admin.
  rpc RegisterModel(RegisterModelRequest) returns (RegisterModelResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/models"
      body: "*"
    };
  }

  // ListModels returns the models visible to the caller.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/models"};
  }

  // GetModel returns one model with its versions.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetModel(GetModelRequest) returns (GetModelResponse) {
    option (google.api.http) = {get: "/api/v1/admin/models/{model_id}"};
  }

  // DeleteModel removes a model registration.
  // Admin-surface API: served under /api/v1/admin.
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/models/{model_id}"};
  }

  // GrantModelAccess adds an organization to a model's grant list
  // (feature-13). Idempotent: granting an already-granted org is a
  // no-op success. Platform-global (no X-Organization-Id).
  // Admin-surface API: served under /api/v1/admin.
  rpc GrantModelAccess(GrantModelAccessRequest) returns (GrantModelAccessResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/models/{model_id}:grant"
      body: "*"
    };
  }

  // RevokeModelAccess removes an organization from a model's grant list
  // (feature-13). Idempotent: revoking a non-granted org is a no-op
  // success. Platform-global (no X-Organization-Id).
  // Admin-surface API: served under /api/v1/admin.
  rpc RevokeModelAccess(RevokeModelAccessRequest) returns (RevokeModelAccessResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/models/{model_id}:revoke"
      body: "*"
    };
  }

  // ListModelAuthorizations returns a model's grant rows, newest first,
  // paginated (feature-13). Platform-global (no X-Organization-Id).
  // Admin-surface API: served under /api/v1/admin.
  rpc ListModelAuthorizations(ListModelAuthorizationsRequest) returns (ListModelAuthorizationsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/models/{model_id}/authorizations"};
  }

  // ListAvailableModels returns the masked user-realm catalog: the
  // models the caller's organization may use, under feature-13's
  // default-allow rule (feature-17 AD8/AD11). The projection carries no
  // weight_path, version list or grant rows.
  // User-surface API: served under /api/v1.
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse) {
    option (google.api.http) = {get: "/api/v1/models"};
  }

  // GetAvailableModel returns one available model's masked projection
  // plus its read-only autoscaling summary (feature #16, AD13). The
  // projection carries no operator fields (no cooldown, no target
  // concurrency, no service identifiers).
  // User-surface API: served under /api/v1.
  rpc GetAvailableModel(GetAvailableModelRequest) returns (GetAvailableModelResponse) {
    option (google.api.http) = {get: "/api/v1/models/{model_id}"};
  }

  // StartModelDownload queues a background download of a model from a
  // public model hub (ModelScope / HuggingFace) and registers it in the
  // catalog when the weights land. The job is asynchronous: the console
  // polls ListModelDownloads for the state and the downloaded size.
  // Admin-surface API: served under /api/v1/admin.
  rpc StartModelDownload(StartModelDownloadRequest) returns (StartModelDownloadResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/model-downloads"
      body: "*"
    };
  }

  // ListModelDownloads returns the download jobs, newest first, so the
  // console can show progress and the outcome.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListModelDownloads(ListModelDownloadsRequest) returns (ListModelDownloadsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/model-downloads"};
  }

  // ListModelVersions returns the full version history of a model,
  // newest first, with per-version metadata and deployment counts
  // (feature #32, AD4).
  // Admin-surface API: served under /api/v1/admin.
  rpc ListModelVersions(ListModelVersionsRequest) returns (ListModelVersionsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/models/{model_id}/versions"};
  }

  // ActivateModelVersion sets a version active and clears the previous
  // active version. Idempotent: activating the already-active version is
  // a no-op success (feature #32, AD5).
  // Admin-surface API: served under /api/v1/admin.
  rpc ActivateModelVersion(ActivateModelVersionRequest) returns (ActivateModelVersionResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/models/{model_id}/versions/{version}:activate"
      body: "*"
    };
  }

  // ListStorageBackends lists the configured model-weights storage
  // backends and their delivery capabilities (platform admin only).
  rpc ListStorageBackends(ListStorageBackendsRequest) returns (ListStorageBackendsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/storage-backends"};
  }

  // StartModelTransfer queues an asynchronous copy, download or delete of
  // a model version between storage backends (platform admin only).
  rpc StartModelTransfer(StartModelTransferRequest) returns (StartModelTransferResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/model-transfers"
      body: "*"
    };
  }

  // ListModelTransfers returns transfer jobs, newest first (platform
  // admin only).
  rpc ListModelTransfers(ListModelTransfersRequest) returns (ListModelTransfersResponse) {
    option (google.api.http) = {get: "/api/v1/admin/model-transfers"};
  }

  // GetModelTransfer returns one transfer job (platform admin only).
  rpc GetModelTransfer(GetModelTransferRequest) returns (GetModelTransferResponse) {
    option (google.api.http) = {get: "/api/v1/admin/model-transfers/{transfer_id}"};
  }

  // CancelModelTransfer cancels a queued or running transfer (platform
  // admin only).
  rpc CancelModelTransfer(CancelModelTransferRequest) returns (CancelModelTransferResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/model-transfers/{transfer_id}:cancel"
      body: "*"
    };
  }

  // WarmModel asks the controller to warm a model on the selected node
  // groups (platform admin only). An empty node_groups list uses every
  // configured warmup node group.
  rpc WarmModel(WarmModelRequest) returns (WarmModelResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/model-warmups"
      body: "*"
    };
  }

  // ListModelWarmups returns the model warmup rows, newest first (platform
  // admin only). The older path is kept as an alias for compatibility.
  rpc ListModelWarmups(ListModelWarmupsRequest) returns (ListModelWarmupsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/model-warmups"};
  }

  // ListModelCacheEntries is the legacy name of ListModelWarmups.
  rpc ListModelCacheEntries(ListModelCacheEntriesRequest) returns (ListModelCacheEntriesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/model-cache-entries"};
  }

  // CancelModelWarmup removes a model from the node caches (platform admin
  // only).
  rpc CancelModelWarmup(CancelModelWarmupRequest) returns (CancelModelWarmupResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/model-warmups/{cache_id}:cancel"
      body: "*"
    };
  }

  // ListWarmupNodeGroups returns the platform-managed warmup node groups.
  // These are not Helm values: a platform administrator creates and edits
  // them in the Operations console.
  rpc ListWarmupNodeGroups(ListWarmupNodeGroupsRequest) returns (ListWarmupNodeGroupsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/model-warmup-node-groups"};
  }

  // CreateWarmupNodeGroup creates a node group and asks the controller to
  // create the matching KServe LocalModelNodeGroup.
  rpc CreateWarmupNodeGroup(CreateWarmupNodeGroupRequest) returns (CreateWarmupNodeGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/model-warmup-node-groups"
      body: "*"
    };
  }

  // UpdateWarmupNodeGroup edits a node group's selector and storage
  // settings. The name is immutable.
  rpc UpdateWarmupNodeGroup(UpdateWarmupNodeGroupRequest) returns (UpdateWarmupNodeGroupResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/model-warmup-node-groups/{name}"
      body: "*"
    };
  }

  // DeleteWarmupNodeGroup removes a node group once no live warmup uses it.
  rpc DeleteWarmupNodeGroup(DeleteWarmupNodeGroupRequest) returns (DeleteWarmupNodeGroupResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/model-warmup-node-groups/{name}"};
  }

  // ListWarmupNodes returns the last observation of every KServe
  // LocalModelNode: the node's groups and the model copies it holds.
  rpc ListWarmupNodes(ListWarmupNodesRequest) returns (ListWarmupNodesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/model-warmup-nodes"};
  }
}

message RegisterModelRequest {
  string name = 1;
  // version is legacy: the console manages one catalog item per model,
  // so the server stores an internal version and this field is no longer
  // required. Distinct model versions are distinct catalog items.
  string version = 2;
  // weight_path is the object-storage path of the model weights, mounted
  // by inference pods through the shared filesystem. When source is set,
  // the weights are downloaded from the hub and weight_path is derived
  // from the download.
  string weight_path = 3;
  string description = 4;
  // source names the model hub the weights are downloaded from
  // ("modelscope" or "huggingface"). Empty means no download: the caller
  // supplies weight_path directly.
  string source = 5;
  // source_model_id is the model id on the hub (e.g.
  // "Qwen/Qwen2.5-0.5B-Instruct"). Required when source is set.
  string source_model_id = 6;
  // hub_model_id is the model's id on the public model hub, in the
  // "<vendor>/<model>" form the hubs use (e.g.
  // "MiniMax/MiniMax-M3.1-Flash"). Required and globally unique across
  // the catalog: a hub id already bound to another model is rejected.
  // It defaults to source_model_id when source is set.
  string hub_model_id = 7;
  // storage_backend names the configured backend that holds the weights.
  // Empty uses the platform default backend.
  string storage_backend = 8;
}

message RegisterModelResponse {
  taas.common.v1.Response response = 1;
  string model_id = 2;
}

message ListModelsRequest {
  taas.common.v1.PageRequest page = 1;
  // organization_id optionally filters the catalog by the default-allow
  // rule (feature-13): when present, zero-grant models are always
  // returned and restricted models only if the org is granted.
  string organization_id = 2;
}

message ListModelsResponse {
  taas.common.v1.Response response = 1;
  repeated ModelSummary models = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message ModelSummary {
  string model_id = 1;
  string name = 2;
  string latest_version = 3;
  string weight_path = 4;
  int64 created_at = 5;
  // restricted is true iff the model has at least one grant row
  // (feature-13). Always populated so the catalog can render the badge.
  bool restricted = 6;
  // external is true for a published external model (feature #48). An
  // external model has no version row (latest_version is empty).
  bool external = 7;
  // provider_name is the owning external provider's name; empty unless
  // external.
  string provider_name = 8;
  // provider_id and upstream_model_id are admin-only (feature #48); the
  // masked user projection never carries them.
  string provider_id = 9;
  string upstream_model_id = 10;
  // published is false for an unpublished external model (admin sees
  // unpublished external models with an "Unpublished" marker).
  bool published = 11;
  // hub_model_id is the model's globally unique id on the public model
  // hub (feature: model download), e.g. "MiniMax/MiniMax-M3.1-Flash".
  // Empty when the model is not bound to a hub id.
  string hub_model_id = 12;
  // storage_backend is the backend the latest version's weights live in.
  // Empty means the platform default backend.
  string storage_backend = 13;
}

message GetModelRequest {
  string model_id = 1;
}

message GetModelResponse {
  taas.common.v1.Response response = 1;
  ModelSummary model = 2;
  repeated string versions = 3;
}

message DeleteModelRequest {
  string model_id = 1;
}

message DeleteModelResponse {
  taas.common.v1.Response response = 1;
}

message GrantModelAccessRequest {
  string model_id = 1; // path
  string organization_id = 2;
}

message GrantModelAccessResponse {
  taas.common.v1.Response response = 1;
}

message RevokeModelAccessRequest {
  string model_id = 1; // path
  string organization_id = 2;
}

message RevokeModelAccessResponse {
  taas.common.v1.Response response = 1;
}

message ModelAuthorization {
  string organization_id = 1;
  string granted_by = 2;
  int64 created_at = 3;
  // granted_by_display_name is the granting user's display name (else the
  // username), resolved for display.
  string granted_by_display_name = 4;
}

message ListModelAuthorizationsRequest {
  string model_id = 1; // path
  taas.common.v1.PageRequest page = 2;
}

message ListModelAuthorizationsResponse {
  taas.common.v1.Response response = 1;
  repeated ModelAuthorization authorizations = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// Masked user-realm catalog (feature-17 AD8): the tenant sees only the
// fields needed to pick a model.
message ListAvailableModelsRequest {
  taas.common.v1.PageRequest page = 1;
}
message AvailableModel {
  string model_id = 1;
  string name = 2;
  string latest_version = 3;
  // autoscaling is the read-only autoscaling projection (feature #16,
  // AD13). Nil when the model is not autoscaled.
  ModelAutoscaling autoscaling = 4;
  // compatibility is the masked compatibility summary (feature #19,
  // AD12): a compact string of the model's supported/experimental
  // engine/card-type combos (e.g. "vLLM · A800, H800"). Empty when the
  // model has no supported/experimental combos.
  string compatibility = 5;
  // external is true for a published external model (feature #48); the
  // masked user projection carries only external and provider_name — it
  // never carries provider_id, upstream_model_id, base_url or the key.
  bool external = 6;
  string provider_name = 7;
  // virtual is true for a granted routing group's masked entry (feature
  // #49, AD12): model_id carries the group id, name the virtual name,
  // latest_version is empty, and no other projection field is set.
  bool virtual = 8;
  // hub_model_id is the model's hub id ("<vendor>/<model>"), empty when
  // the model is not bound to a hub.
  string hub_model_id = 9;
  // pricing is the model's current rate card, so the console can show what
  // a token costs without a second round trip. Nil when no price is set.
  AvailableModelPricing pricing = 10;
}

// AvailableModelPricing is the masked user-realm rate card of one model:
// the rates a caller is charged per one million tokens. It carries no
// price id, version or operator field.
message AvailableModelPricing {
  double input_price_per_million = 1;
  double output_price_per_million = 2;
  // cached_price_per_million is the cache-hit rate (0 = not discounted).
  double cached_price_per_million = 3;
  // currency is the price's ISO-4217 code.
  string currency = 4;
  // accelerator_type is the card type the rate applies to; "default" means
  // the model-wide fallback.
  string accelerator_type = 5;
}
message ListAvailableModelsResponse {
  taas.common.v1.Response response = 1;
  repeated AvailableModel models = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// ModelAutoscaling is the masked user-realm autoscaling projection
// (feature #16, AD13): it carries no operator fields (no cooldown, no
// target concurrency, no service identifiers).
message ModelAutoscaling {
  bool autoscaled = 1;
  int32 current_replicas = 2;
  int32 min_replicas = 3;
  int32 max_replicas = 4;
  bool scale_to_zero = 5;
  // state is steady | scaling | scaled-to-zero | warming-up | fixed.
  string state = 6;
}

message GetAvailableModelRequest {
  string model_id = 1; // path
}

message GetAvailableModelResponse {
  taas.common.v1.Response response = 1;
  AvailableModel model = 2;
  ModelAutoscaling autoscaling = 3;
}

// ListModelVersions returns the full version history of a model, newest
// first, with per-version metadata and deployment counts (feature #32,
// AD4).
message ListModelVersionsRequest {
  string model_id = 1; // path
  taas.common.v1.PageRequest page = 2;
}

// ModelVersion is one version row of a model's history (feature #32).
message ModelVersion {
  string version = 1;
  string weight_path = 2;
  int64 created_at = 3;
  bool is_active = 4;
  // deployment_count is the number of non-terminated inference services
  // pinned to this version.
  int64 deployment_count = 5;
}

message ListModelVersionsResponse {
  taas.common.v1.Response response = 1;
  string model_id = 2;
  string name = 3;
  // active_version is the currently active version string, empty when
  // none is set.
  string active_version = 4;
  repeated ModelVersion versions = 5;
  taas.common.v1.PageMeta page_meta = 6;
}

// ActivateModelVersion sets a version active and clears the previous
// active version (feature #32, AD5).
message ActivateModelVersionRequest {
  string model_id = 1; // path
  string version = 2; // path
}

message ActivateModelVersionResponse {
  taas.common.v1.Response response = 1;
  string active_version = 2;
}

// StartModelDownloadRequest queues a hub download. The downloaded weights
// land in "<weightsDir>/<hub model id>" and the model is registered with
// the requested name and version when the download succeeds.
message StartModelDownloadRequest {
  // source is the model hub: "modelscope" or "huggingface".
  string source = 1;
  // hub_model_id is the model's id on the hub in the
  // "<vendor>/<model>" form, e.g. "MiniMax/MiniMax-M3.1-Flash".
  string hub_model_id = 2;
  // name is the catalog model name; it defaults to the hub model name.
  string name = 3;
  // version is the catalog version; it defaults to the hub model id's
  // last segment.
  string version = 4;
  // description is the free-text model description.
  string description = 5;
  // storage_backend names the backend the weights are downloaded into.
  // Empty uses the platform default backend.
  string storage_backend = 6;
}

message StartModelDownloadResponse {
  taas.common.v1.Response response = 1;
  ModelDownload download = 2;
}

// ModelDownload is one hub download job.
message ModelDownload {
  string download_id = 1;
  // source is the model hub ("modelscope" or "huggingface").
  string source = 2;
  // hub_model_id is the model id on the hub.
  string hub_model_id = 3;
  // name and version are the catalog identity the job registers.
  string name = 4;
  string version = 5;
  // state is queued, downloading, succeeded, failed or cancelled.
  string state = 6;
  // message carries the failure reason (empty on success).
  string message = 7;
  // bytes is the number of weight bytes already on disk.
  int64 bytes = 8;
  // weight_path is the derived weight path once the download succeeded.
  string weight_path = 9;
  // model_id is the catalog model id created by the job.
  string model_id = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  // total_bytes is the size of the model on the hub, so the console can
  // show a real percentage instead of an indeterminate bar. Zero when the
  // hub did not report sizes.
  int64 total_bytes = 13;
  // storage_backend is the backend the job writes the weights to.
  string storage_backend = 14;
}

message ListModelDownloadsRequest {
  taas.common.v1.PageRequest page = 1;
}

message ListModelDownloadsResponse {
  taas.common.v1.Response response = 1;
  repeated ModelDownload downloads = 2;
  taas.common.v1.PageMeta page_meta = 3;
}


// StorageBackend is one configured model-weights backend.
message StorageBackend {
  string name = 1;
  // type is filesystem or objectstore.
  string type = 2;
  // default_delivery is mount, download or cache.
  string default_delivery = 3;
  // allowed_deliveries lists the delivery modes the backend permits.
  repeated string allowed_deliveries = 4;
  // is_default marks the platform default backend.
  bool is_default = 5;
  // mount_path is where a filesystem is mounted in pods.
  string mount_path = 6;
  // provider, endpoint and bucket describe an object store.
  string provider = 7;
  string endpoint = 8;
  string bucket = 9;
  // warmup_enabled reports whether node-local caching can serve it.
  bool warmup_enabled = 10;
}

message ListStorageBackendsRequest {}

message ListStorageBackendsResponse {
  taas.common.v1.Response response = 1;
  repeated StorageBackend backends = 2;
  // default_backend names the platform default backend.
  string default_backend = 3;
}

// StartModelTransferRequest queues a model-weights transfer.
message StartModelTransferRequest {
  string model_id = 1;
  // version defaults to the active version, then the latest.
  string version = 2;
  // operation is move, copy or delete; copy is the default. The console
  // uses move: copy the version to target_backend, then delete the source.
  // Hub downloads are started through the model downloads API.
  string operation = 3;
  // source_backend is ignored for a move: the source is always the
  // version's recorded backend. For copy it defaults to that backend, then
  // the platform default.
  string source_backend = 4;
  // target_backend is the destination for a move or copy. A move requires
  // it and it must name a different backend.
  string target_backend = 5;
}

message StartModelTransferResponse {
  taas.common.v1.Response response = 1;
  ModelTransfer transfer = 2;
}

message ListModelTransfersRequest {
  taas.common.v1.PageRequest page = 1;
  // state filters by queued, running, succeeded, failed or cancelled.
  string state = 2;
  string model_id = 3;
}

message ListModelTransfersResponse {
  taas.common.v1.Response response = 1;
  repeated ModelTransfer transfers = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message GetModelTransferRequest {
  string transfer_id = 1;
}

message GetModelTransferResponse {
  taas.common.v1.Response response = 1;
  ModelTransfer transfer = 2;
}

message CancelModelTransferRequest {
  string transfer_id = 1;
}

message CancelModelTransferResponse {
  taas.common.v1.Response response = 1;
  ModelTransfer transfer = 2;
}

// ModelTransfer is one asynchronous storage operation.
message ModelTransfer {
  string transfer_id = 1;
  string operation = 2;
  string model_id = 3;
  string model_name = 4;
  string version = 5;
  string source_backend = 6;
  string target_backend = 7;
  string source_uri = 8;
  string target_uri = 9;
  string weight_path = 10;
  string state = 11;
  string message = 12;
  int64 bytes = 13;
  int64 total_bytes = 14;
  string job_name = 15;
  int64 created_at = 16;
  int64 updated_at = 17;
}

// WarmModelRequest asks the controller to populate the node-local caches.
message WarmModelRequest {
  string model_id = 1;
  string version = 2;
  // node_groups selects the platform-managed warmup node groups. Empty
  // uses every configured group.
  repeated string node_groups = 3;
}

message WarmModelResponse {
  taas.common.v1.Response response = 1;
  ModelCacheEntry cache = 2;
}

message ListModelWarmupsRequest {
  taas.common.v1.PageRequest page = 1;
  string model_id = 2;
  string state = 3;
}

message ListModelWarmupsResponse {
  taas.common.v1.Response response = 1;
  repeated ModelCacheEntry warmups = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message ListModelCacheEntriesRequest {
  taas.common.v1.PageRequest page = 1;
  string model_id = 2;
  string state = 3;
}

message ListModelCacheEntriesResponse {
  taas.common.v1.Response response = 1;
  repeated ModelCacheEntry caches = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message CancelModelWarmupRequest {
  string cache_id = 1;
}

message CancelModelWarmupResponse {
  taas.common.v1.Response response = 1;
  ModelCacheEntry cache = 2;
}

// WarmupNodeGroup is one platform-managed pool of nodes whose local disk
// caches model weights. It materializes as a KServe LocalModelNodeGroup.
message WarmupNodeGroup {
  string name = 1;
  map<string, string> node_selector = 2;
  string storage_limit = 3;
  string host_path = 4;
  string storage_class = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  // ready_nodes and total_nodes are the last observed LocalModelNode count.
  int32 ready_nodes = 8;
  int32 total_nodes = 9;
}

message ListWarmupNodeGroupsRequest {}

message ListWarmupNodeGroupsResponse {
  taas.common.v1.Response response = 1;
  repeated WarmupNodeGroup node_groups = 2;
}

message CreateWarmupNodeGroupRequest {
  string name = 1;
  map<string, string> node_selector = 2;
  string storage_limit = 3;
  string host_path = 4;
  string storage_class = 5;
}

message CreateWarmupNodeGroupResponse {
  taas.common.v1.Response response = 1;
  WarmupNodeGroup node_group = 2;
}

message UpdateWarmupNodeGroupRequest {
  string name = 1;
  map<string, string> node_selector = 2;
  string storage_limit = 3;
  string host_path = 4;
  string storage_class = 5;
}

message UpdateWarmupNodeGroupResponse {
  taas.common.v1.Response response = 1;
  WarmupNodeGroup node_group = 2;
}

message DeleteWarmupNodeGroupRequest {
  string name = 1;
}

message DeleteWarmupNodeGroupResponse {
  taas.common.v1.Response response = 1;
}

// WarmupNodeModel is one model copy observed on a LocalModelNode.
message WarmupNodeModel {
  string cache_name = 1;
  string model_name = 2;
  string node_group = 3;
  string state = 4;
}

// WarmupNode is the last observation of one KServe LocalModelNode.
message WarmupNode {
  string name = 1;
  repeated string node_groups = 2;
  repeated WarmupNodeModel models = 3;
  int32 model_count = 4;
  int32 downloaded_count = 5;
  int64 updated_at = 6;
}

message ListWarmupNodesRequest {}

message ListWarmupNodesResponse {
  taas.common.v1.Response response = 1;
  repeated WarmupNode nodes = 2;
}

// ModelCacheEntry is the desired and observed state of one warmed model.
message ModelCacheEntry {
  string cache_id = 1;
  string model_id = 2;
  string model_name = 3;
  string version = 4;
  string backend = 5;
  string source_uri = 6;
  string weight_path = 7;
  string cache_name = 8;
  repeated string node_groups = 9;
  string state = 10;
  string message = 11;
  repeated string warmed_nodes = 12;
  int32 total_nodes = 13;
  int64 size_bytes = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
}
