{{- if .Values.controller.enabled }}
{{- $secretName := include "go-taas.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-taas.controller.name" . }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "go-taas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "go-taas.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config-overrides: {{ include "go-taas.configOverrides.checksum" . }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "go-taas.controller.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds }}
      containers:
        - name: controller
          image: {{ include "go-taas.image" (dict "root" . "name" (default "taas-controller" .Values.controller.image.name) "image" .Values.controller.image) }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy | default .Values.image.pullPolicy }}
          # The controller speaks no HTTP and its image carries no shell, so it
          # has no probes: it consumes the queue and the Kubernetes API, and a
          # broken replica is visible in its readiness of the reconciled
          # resources instead.
          args:
            - --config-path=/etc/taas/configs/*.yaml
            {{- range .Values.controller.args }}
            - {{ . }}
            {{- end }}
          env:
            {{- include "go-taas.postgresql.env" . | nindent 12 }}
            {{- include "go-taas.mq.env" . | nindent 12 }}
            {{- with .Values.controller.config }}
            {{- include "go-taas.configEnv" (dict "prefix" "CONFIG" "values" . "indent" 12) }}
            {{- end }}
            {{- with .Values.controller.secretConfig }}
            {{- include "go-taas.secretConfigEnv" (dict "prefix" "CONFIG" "values" . "secretName" $secretName "indent" 12) }}
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
          {{- if or (include "go-taas.hasConfigOverrides" .) .Values.controller.extraVolumeMounts }}
          volumeMounts:
            {{- if include "go-taas.hasConfigOverrides" . }}
            - name: config-overrides
              mountPath: /etc/taas/configs/zz-go-taas-overrides.yaml
              subPath: zz-go-taas-overrides.yaml
              readOnly: true
            {{- end }}
            {{- with .Values.controller.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (include "go-taas.hasConfigOverrides" .) .Values.controller.extraVolumes }}
      volumes:
        {{- if include "go-taas.hasConfigOverrides" . }}
        - name: config-overrides
          configMap:
            name: {{ include "go-taas.configOverrides.name" . }}
        {{- end }}
        {{- with .Values.controller.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
