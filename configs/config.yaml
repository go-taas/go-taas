# Shared configuration loaded by every binary. Values here can be
# overridden by environment variables prefixed with CONFIG_, e.g.
# CONFIG_DB_MASTER_HOST=postgres.

log:
  level: info
  encoding: console

db:
  master:
    host: 127.0.0.1
    port: 5432
    dbName: taas
    user: taas
    password: taas
    sslMode: disable
    maxOpenConns: 32
    maxIdleConns: 8
    connMaxLifetime: 30m
    debug: false

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  maxIdle: 8
  maxActive: 64
  idleTimeout: 5m

mq:
  # Driver selects the broker: "nats" or "fake" (in-memory, for local
  # development without a broker).
  driver: nats
  url: nats://127.0.0.1:4222
  namespace: taas-dev

auth:
  sessionTTL: 24h
  apiKeyCacheTTL: 30s
  apiKeyHash:
    algorithm: argon2id
    time: 1
    memoryMiB: 64
    parallelism: 1
  localPasswordLogin: true
  autoRegister: true

metering:
  # bufferSize/flushInterval are reserved for the future Redis metering
  # buffer (deferred; the MQ + DB path is used at v1).
  bufferSize: 1024
  flushInterval: 5s
  # settlement aggregates complete past hours into usage_records and
  # publishes settlement events to billing.settlements.
  settlement:
    enabled: true
    interval: 60s
    gracePeriod: 5m
    workers: 2
  # retention deletes settled vouchers older than voucherTTL, in
  # batches; usage records are never deleted.
  retention:
    enabled: true
    voucherTTL: 2160h
    batchSize: 1000
    interval: 1h
  # eventConsumer consumes metering.events from the data-plane
  # gateway and writes vouchers.
  eventConsumer:
    enabled: true
    workers: 2

billing:
  # currency is the single platform billing currency (D4); price
  # entries, charge records and bills carry it.
  currency: "USD"
  # eventConsumer consumes metering.events and writes billing usage
  # lines (feature #5).
  eventConsumer:
    enabled: true
    workers: 2
  # settlementsConsumer consumes billing.settlements and charges each
  # settled key-hour.
  settlementsConsumer:
    enabled: true
    workers: 2
  # reconciliation is the charging safety net: it prices uncharged
  # hours even when settlement events are lost.
  reconciliation:
    enabled: true
    interval: 60s
    gracePeriod: 5m
    workers: 2

infer:
  # endpointBaseURL composes the endpoint URL reported for running
  # services. Empty means the controller falls back to the in-cluster
  # Service DNS name.
  endpointBaseURL: ""
  statusConsumer:
    enabled: true
    workers: 2

tenancy:
  # The organization seeded on first boot (when the organizations table
  # is empty at startup, insert-only, never re-seeded).
  defaultOrgId: "org-default"
  defaultOrgDisplayName: "Default Organization"

image:
  # registry is the first-boot seed of the images table (feature #3:
  # the table is the source of truth; this seed is read only when the
  # table is empty at startup, insert-only, preserving imageId values).
  registry:
    - imageId: "img-vllm-nvidia-v063"
      name: "ghcr.io/go-taas/vllm"
      tag: "v0.6.3"
      accelerator: "nvidia"
      engine: "vllm"
    - imageId: "img-vllm-iluvatar-v063"
      name: "ghcr.io/go-taas/vllm-iluvatar"
      tag: "v0.6.3"
      accelerator: "iluvatar"
      engine: "vllm"
    - imageId: "img-sglang-metax-v014"
      name: "ghcr.io/go-taas/sglang"
      tag: "v0.1.4"
      accelerator: "metax"
      engine: "sglang"
  # warmupStatusConsumer applies controller-reported warmup task
  # outcomes to the warmup_tasks table.
  warmupStatusConsumer:
    enabled: true
    workers: 2

controller:
  workers: 4
  maxRetries: 5
