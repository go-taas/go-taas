{{- if eq .Values.dependencies.postgresql.mode "internal" }}
{{- $dep := .Values.dependencies.postgresql }}
{{- $name := include "go-taas.postgresql.name" . }}
{{- $labels := printf "%s\n%s" (include "go-taas.labels" .) "app.kubernetes.io/component: postgresql" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "go-taas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  # A single instance owns its data directory: never run two pods against the
  # same PersistentVolumeClaim.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "go-taas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      {{- with $dep.internal.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" $dep.internal.image.repository $dep.internal.image.tag }}
          imagePullPolicy: {{ $dep.internal.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ $dep.internal.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ $dep.internal.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-taas.secretName" . }}
                  key: postgresql-password
            # Keep the cluster inside a subdirectory so a volume root that
            # carries foreign files (e.g. lost+found) still initializes.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ $dep.internal.auth.username }}
                - -d
                - {{ $dep.internal.auth.database }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ $dep.internal.auth.username }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $dep.internal.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if $dep.internal.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $dep.internal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $dep.internal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $dep.internal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $dep.internal.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- $labels | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $dep.internal.persistence.storageClass }}
  storageClassName: {{ $dep.internal.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $dep.internal.persistence.size }}
{{- end }}
{{- end }}
