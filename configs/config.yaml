# Shared configuration loaded by every binary. Values here can be
# overridden by environment variables prefixed with CONFIG_, e.g.
# CONFIG_DB_MASTER_HOST=postgres.

log:
  level: info
  encoding: console

db:
  master:
    host: 127.0.0.1
    port: 5432
    dbName: taas
    user: taas
    password: taas
    sslMode: disable
    maxOpenConns: 32
    maxIdleConns: 8
    connMaxLifetime: 30m
    debug: false

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  maxIdle: 8
  maxActive: 64
  idleTimeout: 5m

mq:
  # Driver selects the broker: "nats" or "fake" (in-memory, for local
  # development without a broker).
  driver: nats
  url: nats://127.0.0.1:4222
  namespace: taas-dev

auth:
  sessionTTL: 24h
  apiKeyCacheTTL: 30s
  apiKeyHash:
    algorithm: argon2id
    time: 1
    memoryMiB: 64
    parallelism: 1
  localPasswordLogin: true
  autoRegister: true

metering:
  bufferSize: 1024
  flushInterval: 5s

billing:
  settlementInterval: 1h

infer:
  # endpointBaseURL composes the endpoint URL reported for running
  # services. Empty means the controller falls back to the in-cluster
  # Service DNS name.
  endpointBaseURL: ""
  statusConsumer:
    enabled: true
    workers: 2

image:
  # registry is the static image catalog (feature #2 scope: config
  # driven; a real registry integration arrives with feature #3).
  registry:
    - imageId: "img-vllm-nvidia-v063"
      name: "ghcr.io/go-taas/vllm"
      tag: "v0.6.3"
      accelerator: "nvidia"
      engine: "vllm"
    - imageId: "img-vllm-iluvatar-v063"
      name: "ghcr.io/go-taas/vllm-iluvatar"
      tag: "v0.6.3"
      accelerator: "iluvatar"
      engine: "vllm"
    - imageId: "img-sglang-metax-v014"
      name: "ghcr.io/go-taas/sglang"
      tag: "v0.1.4"
      accelerator: "metax"
      engine: "sglang"

controller:
  workers: 4
  maxRetries: 5
