{{- /* Defensive lookups: a values set written before the console block
       existed passes only a partial map. */ -}}
{{- $console := .Values.console | default dict }}
{{- if $console.enabled }}
{{- $svc := $console.service | default dict }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-taas.console.name" . }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type | default "ClusterIP" }}
  ports:
    # The standalone console (nginx serving the Vite bundle).
    - name: http
      port: {{ $svc.port | default 8080 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "go-taas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- end }}
