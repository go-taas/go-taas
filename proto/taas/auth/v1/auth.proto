syntax = "proto3";

package taas.auth.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/auth/v1;authv1";

// AuthService manages accounts, organizations, projects and API keys, and
// verifies API keys for the data-plane gateway.
service AuthService {
  // CreateUser registers a local account.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/users"
      body: "*"
    };
  }

  // Login authenticates a local account and issues a session token.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  // ListAPIKeys returns the API keys of the caller's organization.
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/api-keys"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        get: "/api/v1/admin/auth/api-keys"
      }
    };
  }

  // CreateAPIKey issues a new API key. The plaintext key is returned
  // exactly once; only its salted hash is stored.
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/api-keys"
      body: "*"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        post: "/api/v1/admin/auth/api-keys"
        body: "*"
      }
    };
  }

  // RevokeAPIKey revokes an API key. Revocation takes effect after the
  // gateway-side cache TTL expires.
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/api-keys/{key_id}:revoke"
      body: "*"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        post: "/api/v1/admin/auth/api-keys/{key_id}:revoke"
        body: "*"
      }
    };
  }

  // UpdateAPIKey edits a key's name, expiry and rate limits
  // post-creation. It never returns the plaintext and never changes the
  // secret (feature #11, AD4).
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc UpdateAPIKey(UpdateAPIKeyRequest) returns (UpdateAPIKeyResponse) {
    option (google.api.http) = {
      put: "/api/v1/auth/api-keys/{key_id}"
      body: "*"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        put: "/api/v1/admin/auth/api-keys/{key_id}"
        body: "*"
      }
    };
  }

  // VerifyAPIKey checks an API key on behalf of the data-plane gateway.
  // It is called per request by the gateway's Wasm plugin and is backed
  // by a Redis positive cache.
  rpc VerifyAPIKey(VerifyAPIKeyRequest) returns (VerifyAPIKeyResponse);

  // ---- SSO federation (feature #7) ----

  // CreateSSOProvider creates an SSO identity provider (admin surface).
  rpc CreateSSOProvider(CreateSSOProviderRequest) returns (CreateSSOProviderResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/sso/providers"
      body: "*"
    };
  }

  // ListSSOProviders returns the SSO provider directory (admin surface).
  rpc ListSSOProviders(ListSSOProvidersRequest) returns (ListSSOProvidersResponse) {
    option (google.api.http) = {get: "/api/v1/admin/auth/sso/providers"};
  }

  // GetSSOProvider returns one SSO provider (admin surface).
  rpc GetSSOProvider(GetSSOProviderRequest) returns (GetSSOProviderResponse) {
    option (google.api.http) = {get: "/api/v1/admin/auth/sso/providers/{provider_id}"};
  }

  // UpdateSSOProvider edits a provider's mutable fields (admin surface).
  rpc UpdateSSOProvider(UpdateSSOProviderRequest) returns (UpdateSSOProviderResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/auth/sso/providers/{provider_id}"
      body: "*"
    };
  }

  // EnableSSOProvider activates a provider (admin surface).
  rpc EnableSSOProvider(EnableSSOProviderRequest) returns (EnableSSOProviderResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/sso/providers/{provider_id}:enable"
      body: "*"
    };
  }

  // DisableSSOProvider pauses a provider (admin surface).
  rpc DisableSSOProvider(DisableSSOProviderRequest) returns (DisableSSOProviderResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/sso/providers/{provider_id}:disable"
      body: "*"
    };
  }

  // DeleteSSOProvider removes a provider with no identity bindings
  // (admin surface).
  rpc DeleteSSOProvider(DeleteSSOProviderRequest) returns (DeleteSSOProviderResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/auth/sso/providers/{provider_id}"};
  }

  // SSOAuthorize initiates an SSO login for a provider (user surface).
  rpc SSOAuthorize(SSOAuthorizeRequest) returns (SSOAuthorizeResponse) {
    option (google.api.http) = {get: "/api/v1/auth/sso/{provider_id}/authorize"};
  }

  // SSOCallback completes an SSO login (user surface). Mints a
  // user-realm session (feature-17 AD2).
  rpc SSOCallback(SSOCallbackRequest) returns (SSOCallbackResponse) {
    option (google.api.http) = {get: "/api/v1/auth/sso/{provider_id}/callback"};
  }

  // AdminSSOAuthorize initiates an SSO login for a provider on the
  // admin surface (feature-17).
  rpc AdminSSOAuthorize(SSOAuthorizeRequest) returns (SSOAuthorizeResponse) {
    option (google.api.http) = {get: "/api/v1/admin/auth/sso/{provider_id}/authorize"};
  }

  // AdminSSOCallback completes an SSO login on the admin surface
  // (feature-17). Mints an admin-realm session (AD2).
  rpc AdminSSOCallback(SSOCallbackRequest) returns (SSOCallbackResponse) {
    option (google.api.http) = {get: "/api/v1/admin/auth/sso/{provider_id}/callback"};
  }

  // ListPublicSSOProviders returns the enabled providers projected to
  // the anonymous login surface (feature-17 AD11). No session required.
  rpc ListPublicSSOProviders(ListPublicSSOProvidersRequest) returns (ListPublicSSOProvidersResponse) {
    option (google.api.http) = {get: "/api/v1/auth/sso/providers"};
  }

  // GetSession returns the current session of the realm the request
  // arrived on (user realm on this binding, admin realm on the
  // additional binding, enforced by the gateway realm guard).
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/session"
      additional_bindings: {get: "/api/v1/admin/auth/session"}
    };
  }

  // UpdateSessionOrg switches the session's active org.
  rpc UpdateSessionOrg(UpdateSessionOrgRequest) returns (UpdateSessionOrgResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/session/org"
      body: "*"
      additional_bindings: {
        post: "/api/v1/admin/auth/session/org"
        body: "*"
      }
    };
  }

  // Logout revokes the current session.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
      additional_bindings: {
        post: "/api/v1/admin/auth/logout"
        body: "*"
      }
    };
  }

  // CreateIdentityBinding pre-assigns an identity binding (admin surface).
  rpc CreateIdentityBinding(CreateIdentityBindingRequest) returns (CreateIdentityBindingResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/auth/identity-bindings"
      body: "*"
    };
  }

  // ListIdentityBindings returns the identity binding directory (admin surface).
  rpc ListIdentityBindings(ListIdentityBindingsRequest) returns (ListIdentityBindingsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/auth/identity-bindings"};
  }

  // DeleteIdentityBinding severs an identity binding (admin surface).
  rpc DeleteIdentityBinding(DeleteIdentityBindingRequest) returns (DeleteIdentityBindingResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/auth/identity-bindings/{binding_id}"};
  }
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string organization = 4;
}

message CreateUserResponse {
  taas.common.v1.Response response = 1;
  string user_id = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  taas.common.v1.Response response = 1;
  string session_token = 2;
  int64 expires_at = 3;
}

message ListAPIKeysRequest {
  taas.common.v1.PageRequest page = 1;
  // active_only filters out revoked and expired keys server-side. The
  // filter must be server-side: client-side filtering over server-side
  // pagination is incorrect (a page may contain no active keys).
  bool active_only = 2;
}

message ListAPIKeysResponse {
  taas.common.v1.Response response = 1;
  repeated APIKeySummary keys = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message APIKeySummary {
  string key_id = 1;
  string name = 2;
  string prefix = 3;
  int64 created_at = 4;
  int64 expires_at = 5;
  bool revoked = 6;
  // revoked_at is the first revocation time (unix seconds); 0 = never
  // revoked. Preserved by idempotent re-revoke for audit display.
  int64 revoked_at = 7;
  // rate_limit_rpm is the max requests per minute; 0 = unlimited
  // (feature #11, AD1).
  int64 rate_limit_rpm = 8;
  // rate_limit_tpm is the max tokens per minute; 0 = unlimited.
  int64 rate_limit_tpm = 9;
}

message CreateAPIKeyRequest {
  string name = 1;
  int64 expires_at = 2;
  // rate_limit_rpm is the max requests per minute; 0 = unlimited.
  int64 rate_limit_rpm = 3;
  // rate_limit_tpm is the max tokens per minute; 0 = unlimited.
  int64 rate_limit_tpm = 4;
}

message UpdateAPIKeyRequest {
  string key_id = 1;
  string name = 2;
  // expires_at is unix seconds; 0 = clear (never expires).
  int64 expires_at = 3;
  // rate_limit_rpm is the max requests per minute; 0 = unlimited.
  int64 rate_limit_rpm = 4;
  // rate_limit_tpm is the max tokens per minute; 0 = unlimited.
  int64 rate_limit_tpm = 5;
}

message UpdateAPIKeyResponse {
  taas.common.v1.Response response = 1;
  // key never carries the plaintext.
  APIKeySummary key = 2;
}

message CreateAPIKeyResponse {
  taas.common.v1.Response response = 1;
  // api_key carries the plaintext key. It is shown exactly once at
  // creation time and never stored or returned again.
  string api_key = 2;
  string key_id = 3;
}

message RevokeAPIKeyRequest {
  string key_id = 1;
}

message RevokeAPIKeyResponse {
  taas.common.v1.Response response = 1;
}

message VerifyAPIKeyRequest {
  // key_digest is the lowercase hex SHA-256 of the plaintext API key
  // (64 characters), not the key itself: the gateway never forwards
  // plaintext keys.
  string key_digest = 1;
  string model = 2;
  string source_ip = 3;
}

message VerifyAPIKeyResponse {
  taas.common.v1.Response response = 1;
  string organization_id = 2;
  string key_id = 3;
  string role = 4;
  // rate_limit_rpm is the max requests per minute; 0 = unlimited
  // (feature #11, AD1). The gateway enforces it locally.
  int64 rate_limit_rpm = 5;
  // rate_limit_tpm is the max tokens per minute; 0 = unlimited.
  int64 rate_limit_tpm = 6;
}

// ---- SSO federation (feature #7) ----

// SSOProvider is an SSO identity provider configuration row.
message SSOProvider {
  string provider_id = 1;
  string type = 2; // oidc | saml | ldap
  string display_name = 3;
  // Protocol params (type-specific; secrets masked on read).
  string issuer = 4;
  string client_id = 5;
  string client_secret = 6; // write-only; masked on read
  string redirect_uri = 7;
  string scopes = 8;
  string metadata_url = 9;
  string entity_id = 10;
  string acs_url = 11;
  string host = 12;
  int32 port = 13;
  string bind_dn = 14; // write-only; masked on read
  string base_dn = 15;
  string user_filter = 16;
  bool enabled = 17;
  string default_org = 18;
  bool allow_auto_provision = 19;
  string attribute_mapping = 20; // JSON string
  int64 created_at = 21;
  int64 updated_at = 22;
}

message CreateSSOProviderRequest {
  SSOProvider provider = 1;
}
message CreateSSOProviderResponse {
  taas.common.v1.Response response = 1;
  SSOProvider provider = 2;
}
message ListSSOProvidersRequest {
  taas.common.v1.PageRequest page = 1;
  string type = 2;
  bool enabled = 3;
}
message ListSSOProvidersResponse {
  taas.common.v1.Response response = 1;
  repeated SSOProvider providers = 2;
  taas.common.v1.PageMeta page_meta = 3;
}
message GetSSOProviderRequest {
  string provider_id = 1;
}
message GetSSOProviderResponse {
  taas.common.v1.Response response = 1;
  SSOProvider provider = 2;
}
message UpdateSSOProviderRequest {
  string provider_id = 1;
  SSOProvider provider = 2;
}
message UpdateSSOProviderResponse {
  taas.common.v1.Response response = 1;
  SSOProvider provider = 2;
}
message EnableSSOProviderRequest {
  string provider_id = 1;
}
message EnableSSOProviderResponse {
  taas.common.v1.Response response = 1;
  SSOProvider provider = 2;
}
message DisableSSOProviderRequest {
  string provider_id = 1;
}
message DisableSSOProviderResponse {
  taas.common.v1.Response response = 1;
  SSOProvider provider = 2;
}
message DeleteSSOProviderRequest {
  string provider_id = 1;
}
message DeleteSSOProviderResponse {
  taas.common.v1.Response response = 1;
}

// SSO login flow (user surface).
message SSOAuthorizeRequest {
  string provider_id = 1;
}
message SSOAuthorizeResponse {
  taas.common.v1.Response response = 1;
  string redirect_url = 2;
  string bind_form = 3;
}
message SSOCallbackRequest {
  string provider_id = 1;
  string code = 2;
  string state = 3;
  string username = 4;
  string password = 5;
}
message SSOCallbackResponse {
  taas.common.v1.Response response = 1;
  string session_token = 2;
  string access_token = 3;
  int64 expires_at = 4;
}

// Session (user surface).
message GetSessionRequest {}
message GetSessionResponse {
  taas.common.v1.Response response = 1;
  string user_id = 2;
  string username = 3;
  repeated string roles = 4;
  repeated string accessible_orgs = 5;
  string active_org = 6;
  int64 expires_at = 7;
  // realm is the session's realm (user or admin), minted from the login
  // binding (feature-17 AD2).
  string realm = 8;
}
message UpdateSessionOrgRequest {
  string organization_id = 1;
}
message UpdateSessionOrgResponse {
  taas.common.v1.Response response = 1;
  string active_org = 2;
}
message LogoutRequest {}
message LogoutResponse {
  taas.common.v1.Response response = 1;
}

// Public SSO provider projection (feature-17 AD11): the anonymous login
// surface sees only the fields needed to render a sign-in button.
message ListPublicSSOProvidersRequest {
  taas.common.v1.PageRequest page = 1;
}
message PublicSSOProvider {
  string provider_id = 1;
  string type = 2; // oidc | saml | ldap
  string display_name = 3;
}
message ListPublicSSOProvidersResponse {
  taas.common.v1.Response response = 1;
  repeated PublicSSOProvider providers = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// Identity bindings (admin surface).
message IdentityBinding {
  string binding_id = 1;
  string provider_id = 2;
  string external_subject = 3;
  string user_id = 4;
  int64 created_at = 5;
}
message CreateIdentityBindingRequest {
  string provider_id = 1;
  string external_subject = 2;
  string user_id = 3;
}
message CreateIdentityBindingResponse {
  taas.common.v1.Response response = 1;
  IdentityBinding binding = 2;
}
message ListIdentityBindingsRequest {
  taas.common.v1.PageRequest page = 1;
  string provider_id = 2;
  string user_id = 3;
}
message ListIdentityBindingsResponse {
  taas.common.v1.Response response = 1;
  repeated IdentityBinding bindings = 2;
  taas.common.v1.PageMeta page_meta = 3;
}
message DeleteIdentityBindingRequest {
  string binding_id = 1;
}
message DeleteIdentityBindingResponse {
  taas.common.v1.Response response = 1;
}
