# Configuration for the controller binary. It only needs the message
# queue and log settings; database and redis sections are ignored.

log:
  level: info
  encoding: console

mq:
  driver: nats
  url: nats://127.0.0.1:4222
  namespace: taas-dev

infer:
  # endpointBaseURL composes the endpoint URL reported for running
  # services. Empty means the controller falls back to the in-cluster
  # Service DNS name.
  endpointBaseURL: ""
  # autoscaling (feature #16): the controller reports autoscaling status
  # at most once per statusReportInterval per service.
  autoscaling:
    statusReportInterval: 5s

controller:
  workers: 4
  maxRetries: 5
  # namespace is the Kubernetes namespace the controller manages
  # inference resources in. Empty defaults to "taas-infer". In the
  # compose stack this is set to the cluster's go-taas namespace
  # (CONFIG_CONTROLLER_NAMESPACE).
  namespace: ""
  # kubeconfig is an explicit kubeconfig path the controller uses to reach
  # the Kubernetes cluster. Empty means the in-cluster config is used,
  # falling back to ~/.kube/config for local development. In the compose
  # stack this is set to the mounted host kubeconfig (CONFIG_CONTROLLER_KUBECONFIG).
  kubeconfig: ""
  # weights configures the shared model-weights filesystem the controller
  # mounts into inference pods. It is backed by a JuiceFS-backed
  # StorageClass so every inference pod reads the same model weights the
  # control plane downloads.
  weights:
    # storageClass is the JuiceFS-backed StorageClass used to provision
    # the weights PVC. Empty falls back to the cluster default.
    storageClass: ""
    # pvcName is the name of the PersistentVolumeClaim that backs the
    # shared model-weights filesystem. Defaults to "model-weights".
    pvcName: "model-weights"
    # mountPath is the path the weights volume is mounted at inside
    # inference pods. Defaults to "/data/weights".
    mountPath: "/data/weights"
  # resourceMetrics (feature #37): the per-service CPU/memory/GPU
  # sampling loop reads from the Kubernetes metrics-server and the
  # accelerator signals on sampleInterval (30s default, AD2).
  resourceMetrics:
    sampleInterval: 30s
  # finetuning (feature #39): the fine-tuning job executor polls the
  # Kubernetes Job status on pollInterval (5s default, AD6).
  finetuning:
    pollInterval: 5s
  # cluster (feature #40): the per-cluster health collection loop polls
  # each registered cluster's nodes on collectInterval (30s default,
  # AD4).
  cluster:
    collectInterval: 30s
