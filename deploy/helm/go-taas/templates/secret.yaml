{{- if not .Values.secrets.existingSecret }}
{{/*
Credential material owned by the chart: the dependency passwords and the
at-rest encryption keys. Installed credentials are looked up before a new one
is generated, so upgrades and rollbacks keep the values the running services
already use. Set `secrets.existingSecret` to manage this Secret yourself.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-taas.secretName" . }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
  annotations:
    # Credentials survive `helm uninstall` so a re-install can reconnect to
    # data that outlived the release.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgresql-password: {{ include "go-taas.postgresql.password" . | quote }}
  redis-password: {{ include "go-taas.redis.password" . | quote }}
  {{- if eq .Values.dependencies.keycloak.mode "internal" }}
  keycloak-admin-password: {{ include "go-taas.keycloak.adminPassword" . | quote }}
  {{- end }}
  webhook-secret-encryption-key: {{ include "go-taas.webhookEncryptionKey" . | quote }}
  provider-secret-encryption-key: {{ include "go-taas.providerEncryptionKey" . | quote }}
  {{- with .Values.taasServer.secretConfig }}
  {{- include "go-taas.secretConfigData" (dict "prefix" "CONFIG" "values" . "indent" 2) }}
  {{- end }}
  {{- with .Values.controller.secretConfig }}
  {{- include "go-taas.secretConfigData" (dict "prefix" "CONFIG" "values" . "indent" 2) }}
  {{- end }}
{{- end }}
