syntax = "proto3";

package taas.image.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/image/v1;imagev1";

// ImageService manages inference engine container images: registration,
// the hardware/engine compatibility matrix and node-level warmup tasks.
service ImageService {
  // RegisterImage registers an inference engine image.
  // Admin-surface API: served under /api/v1/admin.
  rpc RegisterImage(RegisterImageRequest) returns (RegisterImageResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/images"
      body: "*"
    };
  }

  // ListImages returns registered images, optionally filtered by the
  // compatibility matrix.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/images"};
  }

  // GetImage returns one image with the non-terminated inference
  // services referencing it.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetImage(GetImageRequest) returns (GetImageResponse) {
    option (google.api.http) = {get: "/api/v1/admin/images/{image_id}"};
  }

  // UpdateImage edits the image description. Identity and compatibility
  // fields are immutable (register a new image to change them).
  // Admin-surface API: served under /api/v1/admin.
  rpc UpdateImage(UpdateImageRequest) returns (UpdateImageResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/images/{image_id}"
      body: "*"
    };
  }

  // DeleteImage removes a catalog entry, guarded while non-terminated
  // inference services reference the image.
  // Admin-surface API: served under /api/v1/admin.
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/images/{image_id}"};
  }

  // TriggerWarmup enqueues a warmup task so the controller pre-pulls the
  // image on compute nodes.
  // Admin-surface API: served under /api/v1/admin.
  rpc TriggerWarmup(TriggerWarmupRequest) returns (TriggerWarmupResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/images/{image_id}:warmup"
      body: "*"
    };
  }

  // ListWarmupTasks returns the warmup task history of one image,
  // newest first.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListWarmupTasks(ListWarmupTasksRequest) returns (ListWarmupTasksResponse) {
    option (google.api.http) = {get: "/api/v1/admin/images/{image_id}/warmup-tasks"};
  }

  // GetWarmupTask returns one warmup task with per-node results. The
  // flat path works because task ids are globally unique.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetWarmupTask(GetWarmupTaskRequest) returns (GetWarmupTaskResponse) {
    option (google.api.http) = {get: "/api/v1/admin/warmup-tasks/{task_id}"};
  }

  // ListCompatibilityMatrix returns matrix cells with model/engine/card/
  // status filters, model-name search, and pagination.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListCompatibilityMatrix(ListCompatibilityMatrixRequest) returns (ListCompatibilityMatrixResponse) {
    option (google.api.http) = {get: "/api/v1/admin/compatibility"};
  }

  // ListCompatibilityDimensions returns the three axis lists (models,
  // engines, card types + vendors) and the per-status counts.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListCompatibilityDimensions(ListCompatibilityDimensionsRequest) returns (ListCompatibilityDimensionsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/compatibility/dimensions"};
  }

  // GetCompatibilityCell returns one cell; a missing cell returns 10209.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetCompatibilityCell(GetCompatibilityCellRequest) returns (GetCompatibilityCellResponse) {
    option (google.api.http) = {get: "/api/v1/admin/compatibility/{model_id}/{engine}/{card_type}"};
  }

  // SetCompatibilityStatus sets a cell's status and optional note.
  // Admin-surface API: served under /api/v1/admin.
  rpc SetCompatibilityStatus(SetCompatibilityStatusRequest) returns (SetCompatibilityStatusResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/compatibility/{model_id}/{engine}/{card_type}"
      body: "*"
    };
  }

  // BulkSetCompatibilityStatus sets the same status and note for a list
  // of cells atomically (all-or-nothing).
  // Admin-surface API: served under /api/v1/admin.
  rpc BulkSetCompatibilityStatus(BulkSetCompatibilityStatusRequest) returns (BulkSetCompatibilityStatusResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/compatibility:bulk"
      body: "*"
    };
  }

  // GetModelCompatibility returns the masked user-realm projection: the
  // model's supported/experimental engines and card types. Unsupported
  // combos are hidden. User-surface API: served under /api/v1.
  rpc GetModelCompatibility(GetModelCompatibilityRequest) returns (GetModelCompatibilityResponse) {
    option (google.api.http) = {get: "/api/v1/models/{model_id}/compatibility"};
  }
}

message RegisterImageRequest {
  string name = 1;
  string tag = 2;
  string digest = 3;
  // accelerator names the hardware platform the image runs on.
  string accelerator = 4;
  // engine names the inference engine (vllm, sglang, ...).
  string engine = 5;
  // description is free-text build notes (<= 1024 chars).
  string description = 6;
}

message RegisterImageResponse {
  taas.common.v1.Response response = 1;
  string image_id = 2;
}

message ListImagesRequest {
  taas.common.v1.PageRequest page = 1;
  string accelerator = 2;
  string engine = 3;
}

message ListImagesResponse {
  taas.common.v1.Response response = 1;
  repeated ImageSummary images = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message ImageSummary {
  string image_id = 1;
  string name = 2;
  string tag = 3;
  string digest = 4;
  string accelerator = 5;
  string engine = 6;
  int64 created_at = 7;
  // description is free-text build notes.
  string description = 8;
  // in_use_count is the number of non-terminated inference services
  // referencing the image.
  int64 in_use_count = 9;
  // last_warmup_state is the state of the newest warmup task (empty
  // when the image was never warmed up).
  string last_warmup_state = 10;
  // last_warmup_at is the update time of the newest warmup task
  // (unix seconds, 0 when never warmed up).
  int64 last_warmup_at = 11;
}

message GetImageRequest {
  string image_id = 1;
}

message InUseService {
  string service_id = 1;
  string name = 2;
  string state = 3;
}

message GetImageResponse {
  taas.common.v1.Response response = 1;
  ImageSummary image = 2;
  repeated InUseService in_use_services = 3;
}

message UpdateImageRequest {
  string image_id = 1;
  // description is the only editable field; identity and compatibility
  // fields are immutable by contract.
  string description = 2;
}

message UpdateImageResponse {
  taas.common.v1.Response response = 1;
}

message DeleteImageRequest {
  string image_id = 1;
}

message DeleteImageResponse {
  taas.common.v1.Response response = 1;
}

message TriggerWarmupRequest {
  string image_id = 1;
  // node_selector restricts the warmup to nodes matching the labels.
  map<string, string> node_selector = 2;
}

message TriggerWarmupResponse {
  taas.common.v1.Response response = 1;
  string task_id = 2;
}

message ListWarmupTasksRequest {
  string image_id = 1;
  taas.common.v1.PageRequest page = 2;
}

message NodeResult {
  string node = 1;
  string state = 2;
  string message = 3;
}

message WarmupTaskSummary {
  string task_id = 1;
  string image_id = 2;
  string state = 3;
  repeated NodeResult node_results = 4;
  string failure_reason = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message ListWarmupTasksResponse {
  taas.common.v1.Response response = 1;
  repeated WarmupTaskSummary tasks = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message GetWarmupTaskRequest {
  string task_id = 1;
}

message GetWarmupTaskResponse {
  taas.common.v1.Response response = 1;
  WarmupTaskSummary task = 2;
}

// ---- Compatibility matrix (feature #19) ----

message CompatibilityCell {
  string model_id = 1;
  string model_name = 2;
  string engine = 3;
  string card_type = 4;
  string card_vendor = 5;
  string status = 6; // supported | experimental | unsupported
  string note = 7;
  bool not_in_fleet = 8;
  int64 updated_at = 9;
}

message ListCompatibilityMatrixRequest {
  taas.common.v1.PageRequest page = 1;
  string model_id = 2;
  string engine = 3;
  string card_type = 4;
  string status = 5;
  string search = 6; // model-name substring
}
message ListCompatibilityMatrixResponse {
  taas.common.v1.Response response = 1;
  repeated CompatibilityCell cells = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message CompatibilityDimensionModel {
  string model_id = 1;
  string model_name = 2;
}
message CompatibilityDimensionEngine {
  string engine = 1;
  string accelerator = 2;
}
message CompatibilityDimensionCardType {
  string card_type = 1;
  string vendor = 2;
  bool in_fleet = 3;
}
message CompatibilityStatusCounts {
  int64 supported = 1;
  int64 experimental = 2;
  int64 unsupported = 3;
  int64 not_in_fleet = 4;
}
message ListCompatibilityDimensionsRequest {}
message ListCompatibilityDimensionsResponse {
  taas.common.v1.Response response = 1;
  repeated CompatibilityDimensionModel models = 2;
  repeated CompatibilityDimensionEngine engines = 3;
  repeated CompatibilityDimensionCardType card_types = 4;
  CompatibilityStatusCounts status_counts = 5;
}

message GetCompatibilityCellRequest {
  string model_id = 1; // path
  string engine = 2; // path
  string card_type = 3; // path
}
message GetCompatibilityCellResponse {
  taas.common.v1.Response response = 1;
  CompatibilityCell cell = 2;
}

message SetCompatibilityStatusRequest {
  string model_id = 1; // path
  string engine = 2; // path
  string card_type = 3; // path
  string status = 4;
  string note = 5; // <= 512 chars
}
message SetCompatibilityStatusResponse {
  taas.common.v1.Response response = 1;
  CompatibilityCell cell = 2;
}

message CompatibilityCellRef {
  string model_id = 1;
  string engine = 2;
  string card_type = 3;
}
message BulkSetCompatibilityStatusRequest {
  repeated CompatibilityCellRef cells = 1;
  string status = 2;
  string note = 3; // <= 512 chars
}
message BulkSetCompatibilityStatusResponse {
  taas.common.v1.Response response = 1;
  int64 updated = 2;
}

message GetModelCompatibilityRequest {
  string model_id = 1; // path
}
message ModelCompatibilityEntry {
  string engine = 1;
  string card_type = 2;
  string card_vendor = 3;
  string status = 4; // supported | experimental (masked)
}
message GetModelCompatibilityResponse {
  taas.common.v1.Response response = 1;
  repeated ModelCompatibilityEntry entries = 2;
  int64 supported_count = 3;
  int64 experimental_count = 4;
}
