syntax = "proto3";

package taas.common.v1;

option go_package = "github.com/go-taas/go-taas/proto/taas/common/v1;commonv1";

// Response is the unified response envelope carried by every API:
// { code, message, data }. code == 0 means success; non-zero values are
// the stable business error codes defined by the platform.
message Response {
  int32 code = 1;
  string message = 2;
}

// PageRequest describes pagination for list endpoints.
message PageRequest {
  int64 offset = 1;
  int32 limit = 2;
}

// PageMeta echoes back the pagination of a list response.
message PageMeta {
  int64 total = 1;
  int64 offset = 2;
  int32 limit = 3;
}
