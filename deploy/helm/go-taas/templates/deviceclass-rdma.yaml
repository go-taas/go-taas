{{/*
The DeviceClass inference pods allocate RDMA devices from.

DRA replaces the extended-resource model for network devices: a DeviceClass
names the devices a fleet offers, a ResourceClaimTemplate describes a request,
and the scheduler hands each pod its own devices. The controller writes the
per-service claim template (the device count is a service property); this
object is cluster infrastructure, so it lives here and not in the controller.

The selector is CEL over the devices the installed driver publishes. The
default accepts every device the DRA network driver (dra.net) reports as
RDMA-capable, and — when `rdma.requireLinkUp` is set — only links the node
reports as up, so a pod is never given a down port.

Every value is read defensively: `helm upgrade --reuse-values` keeps the
previous release's values instead of merging the new chart defaults, so a
release upgraded from an older chart arrives here without an `rdma` block and
must still render the documented default rather than fail the upgrade.
*/}}
{{- $rdma := .Values.rdma | default dict }}
{{- $disabled := and (hasKey $rdma "enabled") (not $rdma.enabled) }}
{{- if not $disabled }}
{{- $class := $rdma.deviceClass | default "taas-rdma" }}
{{- $driver := $rdma.driver | default "dra.net" }}
{{- $requireUp := true }}
{{- if hasKey $rdma "requireLinkUp" }}
{{- $requireUp = $rdma.requireLinkUp }}
{{- end }}
{{- $selector := $rdma.selector | default "" }}
{{- $labels := $rdma.labels | default dict }}
{{- $expression := $selector }}
{{- if not $expression }}
{{- if $requireUp }}
{{- $expression = printf "device.driver == %q && device.attributes[%q].rdma == true && device.attributes[%q].state == %q" $driver "dra.net" "dra.net" "up" }}
{{- else }}
{{- $expression = printf "device.driver == %q && device.attributes[%q].rdma == true" $driver "dra.net" }}
{{- end }}
{{- end }}
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: {{ $class }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference-rdma
    {{- with $labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selectors:
    - cel:
        expression: {{ $expression | quote }}
{{- end }}
