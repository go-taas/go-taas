syntax = "proto3";

package taas.tenancy.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/tenancy/v1;tenancyv1";

// TenancyService manages the platform's organizations and projects.
// It is platform-global: no X-Organization-Id header is required or
// consumed. Admin-surface API: served under /api/v1/admin.
service TenancyService {
  // CreateOrganization creates a tenant with a caller-supplied id.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/organizations"
      body: "*"
    };
  }

  // ListOrganizations returns the organization directory, newest first,
  // with per-organization resource counts.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/organizations"};
  }

  // GetOrganization returns one organization.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/organizations/{organization_id}"};
  }

  // UpdateOrganization edits the display name and description. The id
  // and state are immutable.
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/tenancy/organizations/{organization_id}"
      body: "*"
    };
  }

  // DisableOrganization moves an active organization to disabled. It is
  // idempotent. A disabled organization cannot accrue new API keys or
  // inference services, but all history stays readable.
  rpc DisableOrganization(DisableOrganizationRequest) returns (DisableOrganizationResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/organizations/{organization_id}:disable"
      body: "*"
    };
  }

  // EnableOrganization moves a disabled organization back to active. It
  // is idempotent.
  rpc EnableOrganization(EnableOrganizationRequest) returns (EnableOrganizationResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/organizations/{organization_id}:enable"
      body: "*"
    };
  }

  // DeleteOrganization permanently removes an organization together with
  // everything it owns. Without force it refuses an organization that
  // still has API keys or inference services; with force those resources
  // (and the rest of the organization's data) are removed too. The
  // dedicated platform organization is never deletable (10042).
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/tenancy/organizations/{organization_id}"
    };
  }

  // CreateProject creates a project under an organization. The
  // organization must exist and be active.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/projects"
      body: "*"
    };
  }

  // ListProjects returns the project directory, newest first, with
  // organization and state filters.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/projects"};
  }

  // GetProject returns one project.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/projects/{project_id}"};
  }

  // UpdateProject edits the display name and description. The id, the
  // owning organization, and the state are immutable.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/tenancy/projects/{project_id}"
      body: "*"
    };
  }

  // DisableProject moves an active project to disabled. It is
  // idempotent.
  rpc DisableProject(DisableProjectRequest) returns (DisableProjectResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/projects/{project_id}:disable"
      body: "*"
    };
  }

  // EnableProject moves a disabled project back to active. It is
  // blocked while the owning organization is disabled.
  rpc EnableProject(EnableProjectRequest) returns (EnableProjectResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/projects/{project_id}:enable"
      body: "*"
    };
  }

  // DeleteProject removes a project and the rows that hang off it: its
  // roster, its member quotas and its pending join requests. The project's
  // inference services and API keys are platform-owned and are not
  // touched, so an organization that still uses the project keeps it; the
  // organization console deletes an unused project.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/tenancy/projects/{project_id}"};
  }

  // ListOrgMembers returns the organization's roster with roles.
  // Requires admin/owner in the org context (feature #10).
  rpc ListOrgMembers(ListOrgMembersRequest) returns (ListOrgMembersResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/organizations/{organization_id}/members"};
  }

  // ListOrgMemberCandidates returns the accounts that may still join the
  // organization: active users who belong to no organization. The console
  // offers them as a pick-list instead of asking for a user id.
  rpc ListOrgMemberCandidates(ListOrgMemberCandidatesRequest) returns (ListOrgMemberCandidatesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/organizations/{organization_id}/member-candidates"};
  }

  // AddOrgMember adds a member with a role. Requires admin/owner.
  rpc AddOrgMember(AddOrgMemberRequest) returns (AddOrgMemberResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/organizations/{organization_id}/members"
      body: "*"
    };
  }

  // SetOrgMemberRole changes a member's role. Requires admin/owner.
  rpc SetOrgMemberRole(SetOrgMemberRoleRequest) returns (SetOrgMemberRoleResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/tenancy/organizations/{organization_id}/members/{user_id}"
      body: "*"
    };
  }

  // RemoveOrgMember removes a member. Requires admin/owner; the owner
  // is protected.
  rpc RemoveOrgMember(RemoveOrgMemberRequest) returns (RemoveOrgMemberResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/tenancy/organizations/{organization_id}/members/{user_id}"};
  }

  // ListProjectMembers returns the project's roster. Requires admin/owner
  // in the owning organization.
  rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/projects/{project_id}/members"};
  }

  // ListProjectMemberCandidates returns the members of the project's
  // organization who may still join the project: active users who belong
  // to no project.
  rpc ListProjectMemberCandidates(ListProjectMemberCandidatesRequest) returns (ListProjectMemberCandidatesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/projects/{project_id}/member-candidates"};
  }

  // AddProjectMember adds a member with a role. Requires admin/owner in
  // the owning organization.
  rpc AddProjectMember(AddProjectMemberRequest) returns (AddProjectMemberResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/projects/{project_id}/members"
      body: "*"
    };
  }

  // SetProjectMemberRole changes a project member's role. Requires
  // admin/owner in the owning organization.
  rpc SetProjectMemberRole(SetProjectMemberRoleRequest) returns (SetProjectMemberRoleResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/tenancy/projects/{project_id}/members/{user_id}"
      body: "*"
    };
  }

  // RemoveProjectMember removes a project member. Requires admin/owner
  // in the owning organization.
  rpc RemoveProjectMember(RemoveProjectMemberRequest) returns (RemoveProjectMemberResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/tenancy/projects/{project_id}/members/{user_id}"};
  }

  // CreateInvitation invites a person by email with a role. Requires
  // admin/owner; returns the raw token once.
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/organizations/{organization_id}/invitations"
      body: "*"
    };
  }

  // ListInvitations returns the org's invitation pipeline. Requires
  // admin/owner.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/organizations/{organization_id}/invitations"};
  }

  // RevokeInvitation cancels a pending invitation. Requires admin/owner.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/invitations/{invitation_id}:revoke"
      body: "*"
    };
  }

  // ResendInvitation issues a new token and refreshes expiry. Requires
  // admin/owner; returns the new token once.
  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/invitations/{invitation_id}:resend"
      body: "*"
    };
  }

  // AcceptInvitation joins the org for the authenticated caller.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/invitations/{token}:accept"
      body: "*"
    };
  }

  // RejectInvitation declines the org for the authenticated caller.
  rpc RejectInvitation(RejectInvitationRequest) returns (RejectInvitationResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/invitations/{token}:reject"
      body: "*"
    };
  }

  // ---- service quotas (feature #51) ----

  // ListOrganizationQuotas returns every organization's quota row with
  // best-effort live usage, pagination, a name search and a limit-state
  // filter (admin surface, requireAdminRole).
  rpc ListOrganizationQuotas(ListOrganizationQuotasRequest) returns (ListOrganizationQuotasResponse) {
    option (google.api.http) = {get: "/api/v1/admin/quotas"};
  }

  // GetOrganizationQuota returns one organization's quota, live usage
  // and the last 20 change-history entries (admin surface). An unknown
  // organization returns 13306.
  rpc GetOrganizationQuota(GetOrganizationQuotaRequest) returns (GetOrganizationQuotaResponse) {
    option (google.api.http) = {get: "/api/v1/admin/quotas/{organization_id}"};
  }

  // UpdateOrganizationQuota sets any subset of the four dimensions
  // (proto3 optional tracks presence; an explicit 0 means unlimited).
  // Out-of-range values return 13305 with the dimension named. Audited
  // as quota.updated; tightening below current usage is allowed and
  // non-destructive.
  rpc UpdateOrganizationQuota(UpdateOrganizationQuotaRequest) returns (UpdateOrganizationQuotaResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/quotas/{organization_id}"
      body: "*"
    };
  }

  // GetMyQuota returns the caller's own organization quota with live
  // usage (user surface; the org is resolved from the session, never
  // from a client-supplied id).
  rpc GetMyQuota(GetMyQuotaRequest) returns (GetMyQuotaResponse) {
    option (google.api.http) = {get: "/api/v1/quotas"};
  }

  // GetMyOrganizations returns the caller's own organizations and roles
  // (user surface; the caller is resolved from the session).
  rpc GetMyOrganizations(GetMyOrganizationsRequest) returns (GetMyOrganizationsResponse) {
    option (google.api.http) = {get: "/api/v1/tenancy/my-organizations"};
  }

  // GetMyProjects returns the caller's own projects and roles (user
  // surface; the caller is resolved from the session).
  rpc GetMyProjects(GetMyProjectsRequest) returns (GetMyProjectsResponse) {
    option (google.api.http) = {get: "/api/v1/tenancy/my-projects"};
  }

  // GetMyAdminScopes returns the admin scopes the caller may enter:
  // platform, one or more organizations, and one or more projects
  // (user surface; the caller is resolved from the session). The console
  // uses it to offer the platform / organization / project choice.
  rpc GetMyAdminScopes(GetMyAdminScopesRequest) returns (GetMyAdminScopesResponse) {
    option (google.api.http) = {
      get: "/api/v1/tenancy/my-admin-scopes"
      additional_bindings { get: "/api/v1/admin/tenancy/my-admin-scopes" }
    };
  }

  // ListJoinableOrganizations returns the active organizations the caller
  // may apply to join (user surface). Empty when the caller already
  // belongs to an organization, so one-org membership is offered as a
  // pick-list rather than free text.
  rpc ListJoinableOrganizations(ListJoinableOrganizationsRequest) returns (ListJoinableOrganizationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/tenancy/joinable-organizations"
      additional_bindings { get: "/api/v1/admin/tenancy/joinable-organizations" }
    };
  }

  // ListJoinableProjects returns the active projects of the caller's
  // organization they may apply to join (user surface). Empty when the
  // caller already belongs to a project.
  rpc ListJoinableProjects(ListJoinableProjectsRequest) returns (ListJoinableProjectsResponse) {
    option (google.api.http) = {
      get: "/api/v1/tenancy/joinable-projects"
      additional_bindings { get: "/api/v1/admin/tenancy/joinable-projects" }
    };
  }

  // CreateJoinRequest submits a request to join an organization or a
  // project (user surface).
  rpc CreateJoinRequest(CreateJoinRequestRequest) returns (CreateJoinRequestResponse) {
    option (google.api.http) = {
      post: "/api/v1/tenancy/join-requests"
      body: "*"
    };
  }

  // ListMyJoinRequests returns the caller's own join requests.
  rpc ListMyJoinRequests(ListMyJoinRequestsRequest) returns (ListMyJoinRequestsResponse) {
    option (google.api.http) = {get: "/api/v1/tenancy/join-requests"};
  }

  // ListJoinRequests returns join requests for the admin's org/project
  // (admin surface).
  rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/join-requests"};
  }

  // ApproveJoinRequest approves a join request and adds the member
  // (admin surface). Requires admin/owner of the target.
  rpc ApproveJoinRequest(ApproveJoinRequestRequest) returns (ApproveJoinRequestResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/join-requests/{request_id}:approve"
    };
  }

  // RejectJoinRequest rejects a join request (admin surface).
  rpc RejectJoinRequest(RejectJoinRequestRequest) returns (RejectJoinRequestResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenancy/join-requests/{request_id}:reject"
    };
  }

  // GetProjectQuota returns a project's quotas (admin surface).
  rpc GetProjectQuota(GetProjectQuotaRequest) returns (GetProjectQuotaResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/projects/{project_id}/quota"};
  }

  // UpdateProjectQuota updates a project's quotas (admin surface).
  rpc UpdateProjectQuota(UpdateProjectQuotaRequest) returns (UpdateProjectQuotaResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/tenancy/projects/{project_id}/quota"
      body: "*"
    };
  }

  // ListProjectMemberQuotas returns every member of a project with the
  // quota assigned to that member. It is the project administrator's
  // console: quotas are per person, not for the project as a whole.
  rpc ListProjectMemberQuotas(ListProjectMemberQuotasRequest) returns (ListProjectMemberQuotasResponse) {
    option (google.api.http) = {get: "/api/v1/admin/tenancy/projects/{project_id}/member-quotas"};
  }

  // UpdateProjectMemberQuota sets one member's quota in a project. A nil
  // field is left unchanged; 0 means unlimited.
  rpc UpdateProjectMemberQuota(UpdateProjectMemberQuotaRequest) returns (UpdateProjectMemberQuotaResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/tenancy/projects/{project_id}/member-quotas/{user_id}"
      body: "*"
    };
  }
}

message CreateOrganizationRequest {
  // organization_id is optional. Empty asks the server to generate a
  // UUID; a caller-supplied id is still accepted for scripts. The
  // console never asks a person to type one.
  string organization_id = 1;
  string display_name = 2;
  string description = 3;
}

message CreateOrganizationResponse {
  taas.common.v1.Response response = 1;
  OrganizationSummary organization = 2;
}

message ListOrganizationsRequest {
  taas.common.v1.PageRequest page = 1;
  // state filters by lifecycle state: "active" or "disabled". An
  // unknown value is rejected with 10019.
  string state = 2;
}

message ListOrganizationsResponse {
  taas.common.v1.Response response = 1;
  repeated OrganizationSummary organizations = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message DeleteOrganizationRequest {
  string organization_id = 1;
  // force removes the organization's API keys, inference services and
  // the rest of its data instead of refusing while they exist.
  bool force = 2;
}

message DeleteOrganizationResponse {
  taas.common.v1.Response response = 1;
}

message GetOrganizationRequest {
  string organization_id = 1;
}

message GetOrganizationResponse {
  taas.common.v1.Response response = 1;
  OrganizationSummary organization = 2;
}

message UpdateOrganizationRequest {
  string organization_id = 1;
  string display_name = 2;
  // description replaces the stored description; an empty value clears
  // it. The console's edit dialog always sends both fields.
  string description = 3;
}

message UpdateOrganizationResponse {
  taas.common.v1.Response response = 1;
  OrganizationSummary organization = 2;
}

message DisableOrganizationRequest {
  string organization_id = 1;
}

message DisableOrganizationResponse {
  taas.common.v1.Response response = 1;
  OrganizationSummary organization = 2;
}

message EnableOrganizationRequest {
  string organization_id = 1;
}

message EnableOrganizationResponse {
  taas.common.v1.Response response = 1;
  OrganizationSummary organization = 2;
}

message CreateProjectRequest {
  // project_id is optional. Empty asks the server to generate a UUID; a
  // caller-supplied id is still accepted for scripts.
  string project_id = 1;
  string organization_id = 2;
  string display_name = 3;
  string description = 4;
}

message CreateProjectResponse {
  taas.common.v1.Response response = 1;
  ProjectSummary project = 2;
}

message ListProjectsRequest {
  taas.common.v1.PageRequest page = 1;
  // organization_id filters by owning organization.
  string organization_id = 2;
  // state filters by lifecycle state: "active" or "disabled". An
  // unknown value is rejected with 10019.
  string state = 3;
}

message ListProjectsResponse {
  taas.common.v1.Response response = 1;
  repeated ProjectSummary projects = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  taas.common.v1.Response response = 1;
  ProjectSummary project = 2;
}

message UpdateProjectRequest {
  string project_id = 1;
  string display_name = 2;
  // description replaces the stored description; an empty value clears
  // it.
  string description = 3;
}

message UpdateProjectResponse {
  taas.common.v1.Response response = 1;
  ProjectSummary project = 2;
}

message DisableProjectRequest {
  string project_id = 1;
}

message DisableProjectResponse {
  taas.common.v1.Response response = 1;
  ProjectSummary project = 2;
}

message EnableProjectRequest {
  string project_id = 1;
}

message EnableProjectResponse {
  taas.common.v1.Response response = 1;
  ProjectSummary project = 2;
}

// OrganizationSummary describes one organization row of the directory.
// All int64 fields serialize as JSON strings.
message OrganizationSummary {
  string organization_id = 1;
  string display_name = 2;
  string description = 3;
  // state is "active" or "disabled".
  string state = 4;
  // The resource counts a platform administrator reads from the directory:
  // how many projects and people the organization carries. API keys and
  // inference services are platform-owned assets, so they are not part of
  // the organization row.
  reserved 5, 6;
  reserved "api_key_count", "inference_service_count";
  int64 project_count = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  // member_count is the number of accounts on the organization roster.
  int64 member_count = 10;
}

// ProjectSummary describes one project row of the directory. All int64
// fields serialize as JSON strings.
message ProjectSummary {
  string project_id = 1;
  string organization_id = 2;
  string display_name = 3;
  string description = 4;
  // state is "active" or "disabled".
  string state = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

// OrgMember describes one member of an organization's roster.
message OrgMember {
  string user_id = 1;
  string display_name = 2;
  // role is owner / admin / member / viewer.
  string role = 3;
  int64 joined_at = 4;
}

message ListOrgMembersRequest {
  string organization_id = 1;
  taas.common.v1.PageRequest page = 2;
}

message ListOrgMembersResponse {
  taas.common.v1.Response response = 1;
  repeated OrgMember members = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// MemberCandidate is an account that may still be added to a roster.
message MemberCandidate {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
}

message ListOrgMemberCandidatesRequest {
  string organization_id = 1;
}

message ListOrgMemberCandidatesResponse {
  taas.common.v1.Response response = 1;
  repeated MemberCandidate candidates = 2;
}

message ListProjectMemberCandidatesRequest {
  string project_id = 1;
}

message ListProjectMemberCandidatesResponse {
  taas.common.v1.Response response = 1;
  repeated MemberCandidate candidates = 2;
}

message AddOrgMemberRequest {
  string organization_id = 1;
  string user_id = 2;
  // role is admin / member / viewer (owner cannot be assigned here).
  string role = 3;
}

message AddOrgMemberResponse {
  taas.common.v1.Response response = 1;
  OrgMember member = 2;
}

message SetOrgMemberRoleRequest {
  string organization_id = 1;
  string user_id = 2;
  string role = 3;
}

message SetOrgMemberRoleResponse {
  taas.common.v1.Response response = 1;
  OrgMember member = 2;
}

message RemoveOrgMemberRequest {
  string organization_id = 1;
  string user_id = 2;
}

message RemoveOrgMemberResponse {
  taas.common.v1.Response response = 1;
}

// ProjectMember describes one member of a project's roster.
message ProjectMember {
  string user_id = 1;
  string display_name = 2;
  // role is admin / member / viewer.
  string role = 3;
  int64 joined_at = 4;
}

message ListProjectMembersRequest {
  string project_id = 1;
  taas.common.v1.PageRequest page = 2;
}

message ListProjectMembersResponse {
  taas.common.v1.Response response = 1;
  repeated ProjectMember members = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message AddProjectMemberRequest {
  string project_id = 1;
  string user_id = 2;
  // role is admin / member / viewer.
  string role = 3;
}

message AddProjectMemberResponse {
  taas.common.v1.Response response = 1;
  ProjectMember member = 2;
}

message SetProjectMemberRoleRequest {
  string project_id = 1;
  string user_id = 2;
  string role = 3;
}

message SetProjectMemberRoleResponse {
  taas.common.v1.Response response = 1;
  ProjectMember member = 2;
}

message RemoveProjectMemberRequest {
  string project_id = 1;
  string user_id = 2;
}

message RemoveProjectMemberResponse {
  taas.common.v1.Response response = 1;
}

// Invitation describes one invitation row of the org's pipeline.
message Invitation {
  string invitation_id = 1;
  string email = 2;
  string role = 3;
  // status is pending / accepted / rejected / revoked / expired.
  string status = 4;
  int64 expires_at = 5;
  string created_by = 6;
  int64 created_at = 7;
}

message CreateInvitationRequest {
  string organization_id = 1;
  string email = 2;
  string role = 3;
  // expires_in seconds; 0 = default 7 days.
  int64 expires_in = 4;
}

message CreateInvitationResponse {
  taas.common.v1.Response response = 1;
  Invitation invitation = 2;
  // token is returned once at creation (never stored).
  string token = 3;
}

message ListInvitationsRequest {
  string organization_id = 1;
  // status filters by invitation status; empty = all.
  string status = 2;
  taas.common.v1.PageRequest page = 3;
}

message ListInvitationsResponse {
  taas.common.v1.Response response = 1;
  repeated Invitation invitations = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message RevokeInvitationRequest {
  string invitation_id = 1;
}

message RevokeInvitationResponse {
  taas.common.v1.Response response = 1;
  Invitation invitation = 2;
}

message ResendInvitationRequest {
  string invitation_id = 1;
}

message ResendInvitationResponse {
  taas.common.v1.Response response = 1;
  Invitation invitation = 2;
  // token is the new raw token, returned once.
  string token = 3;
}

message AcceptInvitationRequest {
  string token = 1;
}

message AcceptInvitationResponse {
  taas.common.v1.Response response = 1;
  // organization_id is the org the caller joined.
  string organization_id = 2;
  string role = 3;
}

message RejectInvitationRequest {
  string token = 1;
}

message RejectInvitationResponse {
  taas.common.v1.Response response = 1;
}

// OrganizationQuota is the FR1.1 projection. All max_* fields are
// int64 with 0 = unlimited.
message OrganizationQuota {
  string organization_id = 1;
  string organization_name = 2;
  int64 max_concurrent_requests = 3;
  int64 max_inference_services = 4;
  int64 max_batch_jobs_per_day = 5;
  int64 max_output_tokens_per_request = 6;
  int64 updated_at = 7; // unix seconds, 0 = never updated
  string updated_by = 8; // "" = never updated
  // updated_by_display_name is the editor's display name (else username),
  // resolved for display; empty when unknown.
  string updated_by_display_name = 9;
}

// QuotaUsage is the best-effort live-usage snapshot (FR1.2/FR4.1).
message QuotaUsage {
  int64 concurrent_requests = 1; // gateway in-flight snapshot (AD14)
  int64 inference_services = 2; // non-terminated service count
  int64 batch_jobs_today = 3; // COUNT since local midnight (AD15)
}

// QuotaChangeEntry is one flattened dimension change (AD16).
message QuotaChangeEntry {
  int64 changed_at = 1; // unix seconds
  string operator = 2; // acting user id
  string dimension = 3; // max_concurrent_requests | max_inference_services | max_batch_jobs_per_day | max_output_tokens_per_request
  int64 old_value = 4;
  int64 new_value = 5;
}

// OrganizationQuotaRow is one list row: the quota plus its usage.
message OrganizationQuotaRow {
  OrganizationQuota quota = 1;
  QuotaUsage usage = 2;
}

message ListOrganizationQuotasRequest {
  taas.common.v1.PageRequest page = 1;
  string name = 2; // display-name/id substring search, case-insensitive
  string limit_state = 3; // all (default) | limited | unlimited
}

message ListOrganizationQuotasResponse {
  taas.common.v1.Response response = 1;
  repeated OrganizationQuotaRow quotas = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message GetOrganizationQuotaRequest {
  string organization_id = 1;
}

message GetOrganizationQuotaResponse {
  taas.common.v1.Response response = 1;
  OrganizationQuota quota = 2;
  QuotaUsage usage = 3;
  repeated QuotaChangeEntry changes = 4; // newest first, last 20
}

message UpdateOrganizationQuotaRequest {
  string organization_id = 1;
  // optional tracks presence: absent = unchanged, explicit 0 = unlimited.
  optional int64 max_concurrent_requests = 2;
  optional int64 max_inference_services = 3;
  optional int64 max_batch_jobs_per_day = 4;
  optional int64 max_output_tokens_per_request = 5;
}

message UpdateOrganizationQuotaResponse {
  taas.common.v1.Response response = 1;
  OrganizationQuota quota = 2;
  QuotaUsage usage = 3;
}

message GetMyQuotaRequest {}

message GetMyQuotaResponse {
  taas.common.v1.Response response = 1;
  OrganizationQuota quota = 2;
  QuotaUsage usage = 3;
  // request_increase_email is the configured operator mailbox for the
  // Request-increase mailto (AD18); empty hides the button.
  string request_increase_email = 4;
}

// MyOrganization describes one of the caller's organizations and role.
message MyOrganization {
  string organization_id = 1;
  string display_name = 2;
  // role is owner / admin / member / viewer.
  string role = 3;
}

message GetMyOrganizationsRequest {}

message GetMyOrganizationsResponse {
  taas.common.v1.Response response = 1;
  repeated MyOrganization organizations = 2;
}

// MyProject describes one of the caller's projects and role.
message MyProject {
  string project_id = 1;
  string organization_id = 2;
  string display_name = 3;
  // role is admin / member / viewer.
  string role = 4;
  // organization_display_name is the owning organization's display name, so
  // the end-user project list reads like the admin directory instead of
  // showing a bare id.
  string organization_display_name = 5;
}

message GetMyProjectsRequest {}

message GetMyProjectsResponse {
  taas.common.v1.Response response = 1;
  repeated MyProject projects = 2;
}

// ---- Admin scopes (platform / organization / project console choice) ----

// AdminScope is one management scope the caller may enter.
message AdminScope {
  // scope_type is platform / organization / project.
  string scope_type = 1;
  // organization_id is set for organization and project scopes.
  string organization_id = 2;
  // project_id is set for project scopes only.
  string project_id = 3;
  // display_name is the organization or project display name.
  string display_name = 4;
  // role is the caller's role in the scope.
  string role = 5;
}

message GetMyAdminScopesRequest {}

message GetMyAdminScopesResponse {
  taas.common.v1.Response response = 1;
  repeated AdminScope scopes = 2;
}

// ---- Joinable targets (self-service membership pick-lists) ----

message JoinableOrganization {
  string organization_id = 1;
  string display_name = 2;
}

message ListJoinableOrganizationsRequest {}

message ListJoinableOrganizationsResponse {
  taas.common.v1.Response response = 1;
  repeated JoinableOrganization organizations = 2;
}

message JoinableProject {
  string project_id = 1;
  string organization_id = 2;
  string display_name = 3;
}

message ListJoinableProjectsRequest {
  // organization_id optionally narrows the list; empty resolves the
  // caller's own organization from the session.
  string organization_id = 1;
}

message ListJoinableProjectsResponse {
  taas.common.v1.Response response = 1;
  repeated JoinableProject projects = 2;
}

// ---- Join requests (self-service membership) ----

message JoinRequest {
  string request_id = 1;
  string user_id = 2;
  string username = 3;
  string target_type = 4; // organization | project
  string target_id = 5;
  string status = 6; // pending | approved | rejected
  string message = 7;
  string decided_by = 8;
  int64 decided_at = 9;
  int64 created_at = 10;
  // display_name is the requesting user's display name, falling back to
  // the username when no display name is set.
  string display_name = 11;
}

message CreateJoinRequestRequest {
  string target_type = 1; // organization | project
  string target_id = 2;
  string message = 3;
}

message CreateJoinRequestResponse {
  taas.common.v1.Response response = 1;
  JoinRequest request = 2;
}

message ListMyJoinRequestsRequest {}

message ListMyJoinRequestsResponse {
  taas.common.v1.Response response = 1;
  repeated JoinRequest requests = 2;
}

message ListJoinRequestsRequest {
  string target_type = 1;
  string target_id = 2;
  string status = 3;
}

message ListJoinRequestsResponse {
  taas.common.v1.Response response = 1;
  repeated JoinRequest requests = 2;
}

message ApproveJoinRequestRequest {
  string request_id = 1;
}

message ApproveJoinRequestResponse {
  taas.common.v1.Response response = 1;
  JoinRequest request = 2;
}

message RejectJoinRequestRequest {
  string request_id = 1;
}

message RejectJoinRequestResponse {
  taas.common.v1.Response response = 1;
  JoinRequest request = 2;
}

// ---- Project quotas ----

message ProjectQuota {
  string project_id = 1;
  string organization_id = 2;
  string project_name = 3;
  int64 max_concurrent_requests = 4;
  int64 max_inference_services = 5;
  int64 max_batch_jobs_per_day = 6;
  int64 max_output_tokens_per_request = 7;
  int64 updated_at = 8;
  string updated_by = 9;
  // updated_by_display_name is the editor's display name (else username).
  string updated_by_display_name = 10;
}

message GetProjectQuotaRequest {
  string project_id = 1;
}

message GetProjectQuotaResponse {
  taas.common.v1.Response response = 1;
  ProjectQuota quota = 2;
}

message UpdateProjectQuotaRequest {
  string project_id = 1;
  optional int64 max_concurrent_requests = 2;
  optional int64 max_inference_services = 3;
  optional int64 max_batch_jobs_per_day = 4;
  optional int64 max_output_tokens_per_request = 5;
}

message UpdateProjectQuotaResponse {
  taas.common.v1.Response response = 1;
  ProjectQuota quota = 2;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {
  taas.common.v1.Response response = 1;
}

// ---- Per-member project quotas ----

// ProjectMemberQuota is one project member with the quota that member
// holds inside the project. A 0 limit is unlimited.
message ProjectMemberQuota {
  string project_id = 1;
  string organization_id = 2;
  string user_id = 3;
  // display_name is the member's display name (else username).
  string display_name = 4;
  string role = 5;
  int64 max_concurrent_requests = 6;
  int64 max_inference_services = 7;
  int64 max_batch_jobs_per_day = 8;
  int64 max_output_tokens_per_request = 9;
  int64 updated_at = 10;
  string updated_by = 11;
  string updated_by_display_name = 12;
}

message ListProjectMemberQuotasRequest {
  string project_id = 1;
}

message ListProjectMemberQuotasResponse {
  taas.common.v1.Response response = 1;
  repeated ProjectMemberQuota quotas = 2;
}

message UpdateProjectMemberQuotaRequest {
  string project_id = 1;
  string user_id = 2;
  optional int64 max_concurrent_requests = 3;
  optional int64 max_inference_services = 4;
  optional int64 max_batch_jobs_per_day = 5;
  optional int64 max_output_tokens_per_request = 6;
}

message UpdateProjectMemberQuotaResponse {
  taas.common.v1.Response response = 1;
  ProjectMemberQuota quota = 2;
}
