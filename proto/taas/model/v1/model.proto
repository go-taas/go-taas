syntax = "proto3";

package taas.model.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/model/v1;modelv1";

// ModelService manages model assets: metadata registration, versioning,
// weight paths in object storage and tenant-level authorization.
service ModelService {
  // RegisterModel registers a new model with its first version.
  // Admin-surface API: served under /api/v1/admin.
  rpc RegisterModel(RegisterModelRequest) returns (RegisterModelResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/models"
      body: "*"
    };
  }

  // ListModels returns the models visible to the caller.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/models"};
  }

  // GetModel returns one model with its versions.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetModel(GetModelRequest) returns (GetModelResponse) {
    option (google.api.http) = {get: "/api/v1/admin/models/{model_id}"};
  }

  // DeleteModel removes a model registration.
  // Admin-surface API: served under /api/v1/admin.
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/models/{model_id}"};
  }

  // GrantModelAccess adds an organization to a model's grant list
  // (feature-13). Idempotent: granting an already-granted org is a
  // no-op success. Platform-global (no X-Organization-Id).
  // Admin-surface API: served under /api/v1/admin.
  rpc GrantModelAccess(GrantModelAccessRequest) returns (GrantModelAccessResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/models/{model_id}:grant"
      body: "*"
    };
  }

  // RevokeModelAccess removes an organization from a model's grant list
  // (feature-13). Idempotent: revoking a non-granted org is a no-op
  // success. Platform-global (no X-Organization-Id).
  // Admin-surface API: served under /api/v1/admin.
  rpc RevokeModelAccess(RevokeModelAccessRequest) returns (RevokeModelAccessResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/models/{model_id}:revoke"
      body: "*"
    };
  }

  // ListModelAuthorizations returns a model's grant rows, newest first,
  // paginated (feature-13). Platform-global (no X-Organization-Id).
  // Admin-surface API: served under /api/v1/admin.
  rpc ListModelAuthorizations(ListModelAuthorizationsRequest) returns (ListModelAuthorizationsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/models/{model_id}/authorizations"};
  }

  // ListAvailableModels returns the masked user-realm catalog: the
  // models the caller's organization may use, under feature-13's
  // default-allow rule (feature-17 AD8/AD11). The projection carries no
  // weight_path, version list or grant rows.
  // User-surface API: served under /api/v1.
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse) {
    option (google.api.http) = {get: "/api/v1/models"};
  }

  // GetAvailableModel returns one available model's masked projection
  // plus its read-only autoscaling summary (feature #16, AD13). The
  // projection carries no operator fields (no cooldown, no target
  // concurrency, no service identifiers).
  // User-surface API: served under /api/v1.
  rpc GetAvailableModel(GetAvailableModelRequest) returns (GetAvailableModelResponse) {
    option (google.api.http) = {get: "/api/v1/models/{model_id}"};
  }
}

message RegisterModelRequest {
  string name = 1;
  string version = 2;
  // weight_path is the object-storage path of the model weights, mounted
  // by inference pods through the shared filesystem.
  string weight_path = 3;
  string description = 4;
}

message RegisterModelResponse {
  taas.common.v1.Response response = 1;
  string model_id = 2;
}

message ListModelsRequest {
  taas.common.v1.PageRequest page = 1;
  // organization_id optionally filters the catalog by the default-allow
  // rule (feature-13): when present, zero-grant models are always
  // returned and restricted models only if the org is granted.
  string organization_id = 2;
}

message ListModelsResponse {
  taas.common.v1.Response response = 1;
  repeated ModelSummary models = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message ModelSummary {
  string model_id = 1;
  string name = 2;
  string latest_version = 3;
  string weight_path = 4;
  int64 created_at = 5;
  // restricted is true iff the model has at least one grant row
  // (feature-13). Always populated so the catalog can render the badge.
  bool restricted = 6;
}

message GetModelRequest {
  string model_id = 1;
}

message GetModelResponse {
  taas.common.v1.Response response = 1;
  ModelSummary model = 2;
  repeated string versions = 3;
}

message DeleteModelRequest {
  string model_id = 1;
}

message DeleteModelResponse {
  taas.common.v1.Response response = 1;
}

message GrantModelAccessRequest {
  string model_id = 1; // path
  string organization_id = 2;
}

message GrantModelAccessResponse {
  taas.common.v1.Response response = 1;
}

message RevokeModelAccessRequest {
  string model_id = 1; // path
  string organization_id = 2;
}

message RevokeModelAccessResponse {
  taas.common.v1.Response response = 1;
}

message ModelAuthorization {
  string organization_id = 1;
  string granted_by = 2;
  int64 created_at = 3;
}

message ListModelAuthorizationsRequest {
  string model_id = 1; // path
  taas.common.v1.PageRequest page = 2;
}

message ListModelAuthorizationsResponse {
  taas.common.v1.Response response = 1;
  repeated ModelAuthorization authorizations = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// Masked user-realm catalog (feature-17 AD8): the tenant sees only the
// fields needed to pick a model.
message ListAvailableModelsRequest {
  taas.common.v1.PageRequest page = 1;
}
message AvailableModel {
  string model_id = 1;
  string name = 2;
  string latest_version = 3;
  // autoscaling is the read-only autoscaling projection (feature #16,
  // AD13). Nil when the model is not autoscaled.
  ModelAutoscaling autoscaling = 4;
}
message ListAvailableModelsResponse {
  taas.common.v1.Response response = 1;
  repeated AvailableModel models = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// ModelAutoscaling is the masked user-realm autoscaling projection
// (feature #16, AD13): it carries no operator fields (no cooldown, no
// target concurrency, no service identifiers).
message ModelAutoscaling {
  bool autoscaled = 1;
  int32 current_replicas = 2;
  int32 min_replicas = 3;
  int32 max_replicas = 4;
  bool scale_to_zero = 5;
  // state is steady | scaling | scaled-to-zero | warming-up | fixed.
  string state = 6;
}

message GetAvailableModelRequest {
  string model_id = 1; // path
}

message GetAvailableModelResponse {
  taas.common.v1.Response response = 1;
  AvailableModel model = 2;
  ModelAutoscaling autoscaling = 3;
}
