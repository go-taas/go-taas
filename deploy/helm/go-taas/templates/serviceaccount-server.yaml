{{- if and .Values.taasServer.enabled .Values.taasServer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "go-taas.server.serviceAccountName" . }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.taasServer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
