{{- if and .Values.controller.enabled .Values.controller.rbac.create }}
{{- $name := default (include "go-taas.controller.name" .) .Values.controller.rbac.name }}
{{/*
The controller drives Kubernetes directly: it writes the LLMInferenceService,
PodGroups, the shared model-weights PVC, runs one-shot image-warmup pods, and
reads pod logs, pods and metrics of the workloads the serving stack writes in
the inference namespace, hence the cluster-wide read permissions.
*/}}
{{- if not .Values.controller.rbac.existingClusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  # Node inventory and accelerator capacity, plus the inference namespace lookup.
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Inference pods, their logs, the per-service Services and the model-weights PVC.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Workloads and their autoscalers. Deployments are also listed cluster-wide
  # to find the workload a model is reported ready on, wherever the serving
  # stack put it (usually the inference namespace). StatefulSets are swept to
  # not leave a stale set behind after the service is gone.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-pod CPU/memory samples from the metrics-server (resource metrics feature).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # KServe serving scheme. An LLMInferenceService is the serving object; its
  # InferencePool, PodGroup and workload objects are created by the KServe
  # controller, which already owns those permissions.
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices/status", "llminferenceservices/finalizers"]
    verbs: ["get", "update", "patch"]
  # Volcano gang groups: one PodGroup per inference service, so the pods of a
  # replica are placed together and a higher priority may preempt a lower one.
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The controller publishes the data-plane HTTPRoute that fronts the model
  # router. It is the only route the platform writes: a model's own workload is
  # reached through the Service the serving stack creates for it.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RDMA device allocation (DRA). The DeviceClass is chart infrastructure and
  # is only read here; the per-service ResourceClaimTemplate is workload
  # output, so the controller creates and deletes it with the service. Claims
  # DRA generates from the template are read and swept during teardown.
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaimtemplates", "resourceclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ default $name .Values.controller.rbac.existingClusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "go-taas.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
