syntax = "proto3";

package taas.billing.v1;

import "google/api/annotations.proto";
import "taas/common/v1/common.proto";

option go_package = "github.com/go-taas/go-taas/proto/taas/billing/v1;billingv1";

// BillingService maintains the price matrix, performs funds holds and
// settlements, and produces bills.
service BillingService {
  // SetPrice creates or updates a price entry of the model x accelerator
  // matrix.
  // Admin-surface API: served under /api/v1/admin.
  rpc SetPrice(SetPriceRequest) returns (SetPriceResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/billing/prices"
      body: "*"
    };
  }

  // ListPrices returns the price matrix.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListPrices(ListPricesRequest) returns (ListPricesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/prices"};
  }

  // DeletePrice removes one price version. Charges already committed keep
  // their stored amount and price_id; only future settlement stops using
  // the version. An unknown id returns 10509.
  // Admin-surface API: served under /api/v1/admin.
  rpc DeletePrice(DeletePriceRequest) returns (DeletePriceResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/billing/prices/{price_id}"};
  }

  // GetBalance returns the prepaid balance or postpaid quota of an
  // organization.
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/balance"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        get: "/api/v1/admin/billing/balance"
      }
    };
  }

  // ListBills returns generated bills.
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc ListBills(ListBillsRequest) returns (ListBillsResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/bills"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        get: "/api/v1/admin/billing/bills"
      }
    };
  }

  // ListCharges returns charge records (the billing evidence view),
  // filtered by API key, model and time range.
  // User-surface API: served under /api/v1; the session's active org
  // wins and X-Organization-Id is ignored (feature-17 AD6).
  rpc ListCharges(ListChargesRequest) returns (ListChargesResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/charges"
      additional_bindings: {
        // Deprecated (console-surface-separation): kept functional for
        // the transitional migration window.
        get: "/api/v1/admin/billing/charges"
      }
    };
  }

  // CreateAccount creates the organization's single billing account
  // (prepaid or postpaid), optionally crediting an opening balance.
  // Admin-surface API: served under /api/v1/admin.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/accounts"
      body: "*"
    };
  }

  // ListAccounts returns the billing accounts of the caller's
  // organization (zero or one today).
  // Admin-surface API: served under /api/v1/admin.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/accounts"};
  }

  // GetAccount returns one billing account with computed remaining
  // funds and quota usage.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/accounts/{account_id}"};
  }

  // UpdateAccount replaces the mode, monthly quota and overdraw policy
  // of one account.
  // Admin-surface API: served under /api/v1/admin.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/billing/accounts/{account_id}"
      body: "*"
    };
  }

  // Recharge credits a prepaid balance (idempotent on the
  // idempotency key).
  // Admin-surface API: served under /api/v1/admin.
  rpc Recharge(RechargeRequest) returns (RechargeResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/accounts/{account_id}/recharge"
      body: "*"
    };
  }

  // Refund returns credit from a prepaid balance (admin-initiated).
  // Admin-surface API: served under /api/v1/admin.
  rpc Refund(RefundRequest) returns (RefundResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/accounts/{account_id}/refund"
      body: "*"
    };
  }

  // ListTransactions returns the account ledger filtered by account,
  // type and time range, paginated newest-first.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/transactions"};
  }

  // CheckFunds is the internal gateway gating check: may the
  // organization's requests proceed (AD4). No HTTP binding.
  rpc CheckFunds(CheckFundsRequest) returns (CheckFundsResponse);

  // ---- Payments, invoices & auto-recharge (feature-14) ----

  // CreatePaymentChannel registers a payment channel.
  // Admin-surface API: served under /api/v1/admin.
  rpc CreatePaymentChannel(CreatePaymentChannelRequest) returns (CreatePaymentChannelResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/payment-channels"
      body: "*"
    };
  }

  // ListPaymentChannels returns the payment channel registry.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListPaymentChannels(ListPaymentChannelsRequest) returns (ListPaymentChannelsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/payment-channels"};
  }

  // EnablePaymentChannel activates a channel.
  // Admin-surface API: served under /api/v1/admin.
  rpc EnablePaymentChannel(EnablePaymentChannelRequest) returns (EnablePaymentChannelResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/payment-channels/{channel_id}:enable"
      body: "*"
    };
  }

  // DisablePaymentChannel pauses a channel.
  // Admin-surface API: served under /api/v1/admin.
  rpc DisablePaymentChannel(DisablePaymentChannelRequest) returns (DisablePaymentChannelResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/payment-channels/{channel_id}:disable"
      body: "*"
    };
  }

  // CreatePaymentIntent creates a payment intent for a prepaid account.
  // Admin-surface API: served under /api/v1/admin.
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (CreatePaymentIntentResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/payment-intents"
      body: "*"
    };
  }

  // PayPaymentIntent completes a payment intent via the mock channel.
  // Admin-surface API: served under /api/v1/admin.
  rpc PayPaymentIntent(PayPaymentIntentRequest) returns (PayPaymentIntentResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/payment-intents/{intent_id}:pay"
      body: "*"
    };
  }

  // ListPaymentIntents returns payment intents, newest first.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListPaymentIntents(ListPaymentIntentsRequest) returns (ListPaymentIntentsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/payment-intents"};
  }

  // GenerateInvoice creates an invoice from a settled bill (idempotent).
  // Admin-surface API: served under /api/v1/admin.
  rpc GenerateInvoice(GenerateInvoiceRequest) returns (GenerateInvoiceResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/invoices"
      body: "*"
    };
  }

  // ListInvoices returns invoices, newest first.
  // Admin-surface API: served under /api/v1/admin.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/invoices"};
  }

  // GetInvoice returns one invoice.
  // Admin-surface API: served under /api/v1/admin.
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/invoices/{invoice_id}"};
  }

  // DownloadInvoice returns a presentable rendering of an invoice.
  // Admin-surface API: served under /api/v1/admin.
  rpc DownloadInvoice(DownloadInvoiceRequest) returns (DownloadInvoiceResponse) {
    option (google.api.http) = {get: "/api/v1/admin/billing/invoices/{invoice_id}:download"};
  }

  // ---- Billing reports & CSV export (feature-25) ----
  //
  // The billing-report RPCs are dual-bound: the user binding is
  // tenant-scoped under /api/v1/billing/reports/*, the admin binding is
  // fleet-wide under /api/v1/admin/billing/reports/*.

  // CreateReport creates an on-demand report job (status = pending).
  // User-surface API: tenant-scoped under /api/v1/billing/reports.
  // Admin-surface API: fleet-wide under /api/v1/admin/billing/reports.
  rpc CreateReport(CreateReportRequest) returns (CreateReportResponse) {
    option (google.api.http) = {
      post: "/api/v1/billing/reports"
      body: "*"
      additional_bindings: {
        post: "/api/v1/admin/billing/reports"
        body: "*"
      }
    };
  }

  // GetReport returns a report's status, definition, row count and
  // data_through.
  // User-surface API: served under /api/v1/billing/reports.
  // Admin-surface API: served under /api/v1/admin/billing/reports.
  rpc GetReport(GetReportRequest) returns (GetReportResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/reports/{report_id}"
      additional_bindings: {get: "/api/v1/admin/billing/reports/{report_id}"}
    };
  }

  // ListReports returns the report history, newest first.
  // User-surface API: served under /api/v1/billing/reports.
  // Admin-surface API: served under /api/v1/admin/billing/reports.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/reports"
      additional_bindings: {get: "/api/v1/admin/billing/reports"}
    };
  }

  // DownloadReport returns the CSV when status = ready.
  // User-surface API: served under /api/v1/billing/reports.
  // Admin-surface API: served under /api/v1/admin/billing/reports.
  rpc DownloadReport(DownloadReportRequest) returns (DownloadReportResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/reports/{report_id}/download"
      additional_bindings: {get: "/api/v1/admin/billing/reports/{report_id}/download"}
    };
  }

  // CreateSchedule creates a scheduled report (status = active).
  // User-surface API: served under /api/v1/billing/reports.
  // Admin-surface API: served under /api/v1/admin/billing/reports.
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse) {
    option (google.api.http) = {
      post: "/api/v1/billing/reports/schedules"
      body: "*"
      additional_bindings: {
        post: "/api/v1/admin/billing/reports/schedules"
        body: "*"
      }
    };
  }

  // ListSchedules returns the caller's schedules.
  // User-surface API: served under /api/v1/billing/reports.
  // Admin-surface API: served under /api/v1/admin/billing/reports.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/reports/schedules"
      additional_bindings: {get: "/api/v1/admin/billing/reports/schedules"}
    };
  }

  // UpdateSchedule updates a schedule's name, frequency or relative
  // range.
  // User-surface API: served under /api/v1/billing/reports.
  // Admin-surface API: served under /api/v1/admin/billing/reports.
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse) {
    option (google.api.http) = {
      patch: "/api/v1/billing/reports/schedules/{schedule_id}"
      body: "*"
      additional_bindings: {
        patch: "/api/v1/admin/billing/reports/schedules/{schedule_id}"
        body: "*"
      }
    };
  }

  // DeleteSchedule deletes a schedule.
  // User-surface API: served under /api/v1/billing/reports.
  // Admin-surface API: served under /api/v1/admin/billing/reports.
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse) {
    option (google.api.http) = {
      delete: "/api/v1/billing/reports/schedules/{schedule_id}"
      additional_bindings: {delete: "/api/v1/admin/billing/reports/schedules/{schedule_id}"}
    };
  }

  // ListScheduleRuns returns the runs a schedule has produced.
  // User-surface API: served under /api/v1/billing/reports.
  // Admin-surface API: served under /api/v1/admin/billing/reports.
  rpc ListScheduleRuns(ListScheduleRunsRequest) returns (ListScheduleRunsResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/reports/schedules/{schedule_id}/runs"
      additional_bindings: {get: "/api/v1/admin/billing/reports/schedules/{schedule_id}/runs"}
    };
  }

  // GetCostAnalyticsOverview returns cost analytics: summary cards, a
  // dimension breakdown, a cost trend, and cost-per-token. The admin
  // binding is the fleet-wide view (cross-org by default, optional org
  // filter); the user binding is tenant-scoped to the caller's org.
  rpc GetCostAnalyticsOverview(GetCostAnalyticsOverviewRequest) returns (GetCostAnalyticsOverviewResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/cost"
      additional_bindings: {get: "/api/v1/cost"}
    };
  }

  // GetCostAnalytics returns single-dimension-value cost analytics:
  // summary cards and a cost trend. The admin binding covers any
  // dimension value; the user binding is tenant-scoped.
  rpc GetCostAnalytics(GetCostAnalyticsRequest) returns (GetCostAnalyticsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/cost/{dimension}/{value}"
      additional_bindings: {get: "/api/v1/cost/{dimension}/{value}"}
    };
  }

  // GetForecast returns the forecast for a time range and optional
  // dimension filter: the historical series, the forecast series, and
  // the confidence band (feature #36, AD2). The admin binding is
  // fleet-wide; the user binding is tenant-scoped.
  // Admin-surface API: served under /api/v1/admin.
  // User-surface API: served under /api/v1.
  rpc GetForecast(GetForecastRequest) returns (GetForecastResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/forecast"
      additional_bindings: {get: "/api/v1/forecast"}
    };
  }
}

message SetPriceRequest {
  string model_id = 1;
  string accelerator_type = 2;
  // input_price_per_million is the price of one million input tokens, in
  // the platform's billing currency unit.
  double input_price_per_million = 3;
  double output_price_per_million = 4;
  string currency = 5;
  // cached_price_per_million is the price of one million cache-hit
  // tokens (default 0).
  double cached_price_per_million = 6;
  // effective_from is the version's start of validity, unix seconds;
  // 0 means now.
  int64 effective_from = 7;
  // tiers is the optional ordered volume-tier list; empty means flat.
  repeated PriceTier tiers = 8;
}

message DeletePriceRequest {
  string price_id = 1;
}

message DeletePriceResponse {
  taas.common.v1.Response response = 1;
}

message SetPriceResponse {
  taas.common.v1.Response response = 1;
  // price_id identifies the stored version (idempotent on the cell
  // version key).
  string price_id = 2;
}

message ListPricesRequest {
  taas.common.v1.PageRequest page = 1;
  string model_id = 2;
  // accelerator_type filters the matrix to one card type.
  string accelerator_type = 3;
  // include_history returns every version instead of the current view.
  bool include_history = 4;
}

message ListPricesResponse {
  taas.common.v1.Response response = 1;
  repeated PriceEntry prices = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message PriceEntry {
  string model_id = 1;
  string accelerator_type = 2;
  double input_price_per_million = 3;
  double output_price_per_million = 4;
  string currency = 5;
  int64 updated_at = 6;
  // price_id identifies the stored version.
  string price_id = 7;
  // cached_price_per_million is the cache-hit token rate.
  double cached_price_per_million = 8;
  // effective_from is the version's start of validity, unix seconds.
  int64 effective_from = 9;
  // tiers is the ordered volume-tier list; empty means flat.
  repeated PriceTier tiers = 10;
}

// PriceTier is one volume tier: rates apply once the organization's
// month-to-date cumulative token volume for (model, card) exceeds the
// previous tiers' bounds. The last tier has up_to_tokens = 0
// (unbounded).
message PriceTier {
  // up_to_tokens is the exclusive upper bound of the tier, in
  // cumulative monthly tokens; 0 on the last tier means unbounded.
  int64 up_to_tokens = 1;
  double input_price_per_million = 2;
  double output_price_per_million = 3;
}

message GetBalanceRequest {
  string organization_id = 1;
}

message GetBalanceResponse {
  taas.common.v1.Response response = 1;
  // mode is "prepaid" (balance) or "postpaid" (quota).
  string mode = 2;
  // balance is deprecated: balance_cents / 100 for one release.
  double balance = 3;
  string currency = 4;
  // balance_cents is the prepaid funds in minor units.
  int64 balance_cents = 5;
  // monthly_quota_cents is the postpaid cap; 0 = unlimited.
  int64 monthly_quota_cents = 6;
  // used_this_cycle_cents is the postpaid usage within the cycle.
  int64 used_this_cycle_cents = 7;
}

message ListBillsRequest {
  taas.common.v1.PageRequest page = 1;
  string organization_id = 2;
  int64 since = 3;
  int64 until = 4;
}

message ListBillsResponse {
  taas.common.v1.Response response = 1;
  repeated BillSummary bills = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message BillSummary {
  string bill_id = 1;
  string organization_id = 2;
  double amount = 3;
  string currency = 4;
  int64 period_start = 5;
  int64 period_end = 6;
  // charge_count is the number of charge records in the month.
  int64 charge_count = 7;
  // unpriced_count is the number of unpriced charge records (amount 0).
  int64 unpriced_count = 8;
}

message ListChargesRequest {
  taas.common.v1.PageRequest page = 1;
  string organization_id = 2;
  int64 since = 3;
  int64 until = 4;
  // api_key_id filters the list to one API key.
  string api_key_id = 5;
  // model_id filters the list to one model.
  string model_id = 6;
  // owner_user_id filters the list to one API key owner.
  string owner_user_id = 7;
  // project_id filters the list to one project.
  string project_id = 8;
}

message ListChargesResponse {
  taas.common.v1.Response response = 1;
  repeated ChargeRecordSummary charges = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// ChargeRecordSummary is one (api_key, model, card, hour) charge group.
message ChargeRecordSummary {
  string charge_id = 1;
  string organization_id = 2;
  string api_key_id = 3;
  string model_id = 4;
  string accelerator_type = 5;
  int64 period_start = 6;
  int64 period_end = 7;
  int64 prompt_tokens = 8;
  int64 completion_tokens = 9;
  int64 cached_tokens = 10;
  int64 reasoning_tokens = 11;
  int64 request_count = 12;
  double amount = 13;
  string currency = 14;
  // price_id names the applied price version; empty when unpriced.
  string price_id = 15;
  // tier_index is the applied tier; -1 means flat rate.
  int32 tier_index = 16;
  // priced reports whether a price applied (false means amount 0).
  bool priced = 17;
  int64 charged_at = 18;
  // owner_user_id is the charged key's personal owner; empty when the
  // key was organization-shared at charge time.
  string owner_user_id = 19;
  // project_id is the charged key's project; empty when unassigned.
  string project_id = 20;
}

message CreateAccountRequest {
  // mode is "prepaid" or "postpaid".
  string mode = 1;
  // monthly_quota_cents is the postpaid monthly cap; 0 = unlimited.
  int64 monthly_quota_cents = 2;
  // overdraw_policy is "block" or "warn" (postpaid enforcement).
  string overdraw_policy = 3;
  // initial_balance_cents is the optional opening balance credited as
  // a recharge transaction (prepaid only).
  int64 initial_balance_cents = 4;
  // monthly_spend_limit_cents is the cross-mode monthly spend cap;
  // 0 = unlimited (feature #11, AD5).
  int64 monthly_spend_limit_cents = 5;
}

message CreateAccountResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
}

message ListAccountsRequest {
  taas.common.v1.PageRequest page = 1;
}

message ListAccountsResponse {
  taas.common.v1.Response response = 1;
  repeated Account accounts = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
}

message UpdateAccountRequest {
  string account_id = 1;
  // mode is "prepaid" or "postpaid".
  string mode = 2;
  // monthly_quota_cents is the postpaid monthly cap; 0 = unlimited.
  int64 monthly_quota_cents = 3;
  // overdraw_policy is "block" or "warn".
  string overdraw_policy = 4;
  // monthly_spend_limit_cents is the cross-mode monthly spend cap;
  // 0 = unlimited (feature #11, AD5).
  int64 monthly_spend_limit_cents = 5;
}

message UpdateAccountResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
}

message RechargeRequest {
  string account_id = 1;
  // amount_cents is the credit amount, positive.
  int64 amount_cents = 2;
  // idempotency_key deduplicates retries; required, <= 128 chars.
  string idempotency_key = 3;
  // note is a free-text reference stored on the transaction.
  string note = 4;
}

message RechargeResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
  Transaction transaction = 3;
}

message RefundRequest {
  string account_id = 1;
  // amount_cents is the refund amount, positive.
  int64 amount_cents = 2;
  // idempotency_key deduplicates retries; required, <= 128 chars.
  string idempotency_key = 3;
  // note is a free-text reference stored on the transaction.
  string note = 4;
}

message RefundResponse {
  taas.common.v1.Response response = 1;
  Account account = 2;
  Transaction transaction = 3;
}

message ListTransactionsRequest {
  taas.common.v1.PageRequest page = 1;
  // account_id filters the ledger to one account.
  string account_id = 2;
  // type filters by transaction type: recharge / deduction / refund.
  string type = 3;
  int64 since = 4;
  int64 until = 5;
}

message ListTransactionsResponse {
  taas.common.v1.Response response = 1;
  repeated Transaction transactions = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// Account is the per-organization billing account (AD1).
message Account {
  string account_id = 1;
  string organization_id = 2;
  // mode is "prepaid" or "postpaid".
  string mode = 3;
  // balance_cents is the prepaid funds in minor units.
  int64 balance_cents = 4;
  // monthly_quota_cents is the postpaid cap; 0 = unlimited.
  int64 monthly_quota_cents = 5;
  // used_this_cycle_cents is the postpaid usage within the cycle.
  int64 used_this_cycle_cents = 6;
  // cycle_started_at is the UTC month start the cycle covers, unix
  // seconds.
  int64 cycle_started_at = 7;
  // overdraw_policy is "block" or "warn".
  string overdraw_policy = 8;
  string currency = 9;
  // remaining_cents: prepaid = balance; postpaid = quota - used (0
  // when unlimited).
  int64 remaining_cents = 10;
  // quota_usage_percent is the postpaid usage ratio; 0 when unlimited.
  int32 quota_usage_percent = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
  // monthly_spend_limit_cents is the cross-mode monthly spend cap;
  // 0 = unlimited (feature #11, AD5).
  int64 monthly_spend_limit_cents = 14;
  // spent_this_cycle_cents is the total spend within the current UTC
  // cycle, both modes; read-only on the wire (AD6).
  int64 spent_this_cycle_cents = 15;
  // spend_limit_usage_percent is spent / limit; 0 when unlimited.
  int32 spend_limit_usage_percent = 16;
}

// Transaction is one append-only ledger row (AD7).
message Transaction {
  string transaction_id = 1;
  string account_id = 2;
  // type is "recharge", "deduction" or "refund".
  string type = 3;
  // amount_cents is positive; the direction is implied by type.
  int64 amount_cents = 4;
  // balance_after_cents is the account balance after the write.
  int64 balance_after_cents = 5;
  string idempotency_key = 6;
  // reference is the charge_id for deductions, free text otherwise.
  string reference = 7;
  int64 created_at = 8;
}

message CheckFundsRequest {
  string organization_id = 1;
  // owner_user_id optionally narrows the check to one key owner's
  // personal monthly spend limit.
  string owner_user_id = 2;
  // project_id optionally narrows the check to one project's monthly
  // spend limit.
  string project_id = 3;
}

message CheckFundsResponse {
  taas.common.v1.Response response = 1;
  // allowed reports whether requests may proceed.
  bool allowed = 2;
  // reason is "" or "insufficient_funds".
  string reason = 3;
  // mode is "prepaid" / "postpaid" / "" (no account).
  string mode = 4;
  int64 balance_cents = 5;
  int64 monthly_quota_cents = 6;
  int64 used_this_cycle_cents = 7;
  // monthly_spend_limit_cents is the cross-mode monthly spend cap;
  // 0 = unlimited (feature #11, AD5).
  int64 monthly_spend_limit_cents = 8;
  // spent_this_cycle_cents is the total spend within the current cycle.
  int64 spent_this_cycle_cents = 9;
  // effective_monthly_spend_limit_cents is the minimum of the non-zero
  // organization, project and personal spend limits; 0 = unlimited.
  int64 effective_monthly_spend_limit_cents = 10;
  // owner_spent_this_cycle_cents is the owner's spend in the cycle.
  int64 owner_spent_this_cycle_cents = 11;
  // project_spent_this_cycle_cents is the project's spend in the cycle.
  int64 project_spent_this_cycle_cents = 12;
  // scoped_spent_this_cycle_cents is the amount the effective limit is
  // compared against (the narrowest supplied scope).
  int64 scoped_spent_this_cycle_cents = 13;
}

// ---- Payments, invoices & auto-recharge (feature-14) ----

message PaymentChannel {
  string channel_id = 1;
  string type = 2;
  string display_name = 3;
  bool enabled = 4;
  int64 created_at = 5;
}

message CreatePaymentChannelRequest {
  string channel_id = 1;
  string type = 2;
  string display_name = 3;
}
message CreatePaymentChannelResponse {
  taas.common.v1.Response response = 1;
  PaymentChannel channel = 2;
}
message ListPaymentChannelsRequest {
  taas.common.v1.PageRequest page = 1;
}
message ListPaymentChannelsResponse {
  taas.common.v1.Response response = 1;
  repeated PaymentChannel channels = 2;
  taas.common.v1.PageMeta page_meta = 3;
}
message EnablePaymentChannelRequest {
  string channel_id = 1;
}
message EnablePaymentChannelResponse {
  taas.common.v1.Response response = 1;
  PaymentChannel channel = 2;
}
message DisablePaymentChannelRequest {
  string channel_id = 1;
}
message DisablePaymentChannelResponse {
  taas.common.v1.Response response = 1;
  PaymentChannel channel = 2;
}

message PaymentIntent {
  string intent_id = 1;
  string account_id = 2;
  int64 amount_cents = 3;
  string channel = 4;
  string status = 5; // pending | paid | failed | expired
  string idempotency_key = 6;
  string reference = 7;
  int64 created_at = 8;
  int64 paid_at = 9;
  // pay_url is the channel redirect/QR URL (mock: a console pay URL).
  string pay_url = 10;
}

message CreatePaymentIntentRequest {
  string account_id = 1;
  int64 amount_cents = 2;
  string channel = 3;
  string idempotency_key = 4;
  string reference = 5;
}
message CreatePaymentIntentResponse {
  taas.common.v1.Response response = 1;
  PaymentIntent intent = 2;
}
message PayPaymentIntentRequest {
  string intent_id = 1;
}
message PayPaymentIntentResponse {
  taas.common.v1.Response response = 1;
  PaymentIntent intent = 2;
}
message ListPaymentIntentsRequest {
  taas.common.v1.PageRequest page = 1;
  string account_id = 2;
  string status = 3;
}
message ListPaymentIntentsResponse {
  taas.common.v1.Response response = 1;
  repeated PaymentIntent intents = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message Invoice {
  string invoice_id = 1;
  string bill_id = 2;
  string organization_id = 3;
  int64 period_start = 4;
  int64 period_end = 5;
  int64 total_cents = 6;
  string currency = 7;
  string status = 8; // issued | paid
  int64 issued_at = 9;
  int64 paid_at = 10;
}

message GenerateInvoiceRequest {
  string organization_id = 1;
  // period_start is the UTC month start (unix seconds) of the bill.
  int64 period_start = 2;
}
message GenerateInvoiceResponse {
  taas.common.v1.Response response = 1;
  Invoice invoice = 2;
}
message ListInvoicesRequest {
  taas.common.v1.PageRequest page = 1;
  string organization_id = 2;
}
message ListInvoicesResponse {
  taas.common.v1.Response response = 1;
  repeated Invoice invoices = 2;
  taas.common.v1.PageMeta page_meta = 3;
}
message GetInvoiceRequest {
  string invoice_id = 1;
}
message GetInvoiceResponse {
  taas.common.v1.Response response = 1;
  Invoice invoice = 2;
}
message DownloadInvoiceRequest {
  string invoice_id = 1;
}
message DownloadInvoiceResponse {
  taas.common.v1.Response response = 1;
  // content is a presentable JSON/HTML rendering of the invoice.
  string content = 2;
  string content_type = 3;
}

// ---- Billing reports & CSV export (feature-25) ----

// ReportDimension is the aggregation dimension of a report.
enum ReportDimension {
  REPORT_DIMENSION_UNSPECIFIED = 0;
  REPORT_DIMENSION_ORGANIZATION = 1;
  REPORT_DIMENSION_API_KEY = 2;
  REPORT_DIMENSION_MODEL = 3;
}

// ReportGranularity is the bucket size of a report.
enum ReportGranularity {
  REPORT_GRANULARITY_UNSPECIFIED = 0;
  REPORT_GRANULARITY_DAILY = 1;
  REPORT_GRANULARITY_HOURLY = 2;
}

// ReportFrequency is the cadence of a scheduled report.
enum ReportFrequency {
  REPORT_FREQUENCY_UNSPECIFIED = 0;
  REPORT_FREQUENCY_DAILY = 1;
  REPORT_FREQUENCY_WEEKLY = 2;
  REPORT_FREQUENCY_MONTHLY = 3;
}

// RelativeRange is the relative time range of a scheduled report.
enum RelativeRange {
  RELATIVE_RANGE_UNSPECIFIED = 0;
  RELATIVE_RANGE_LAST_7_DAYS = 1;
  RELATIVE_RANGE_LAST_30_DAYS = 2;
  RELATIVE_RANGE_LAST_MONTH = 3;
}

message CreateReportRequest {
  // name is the report name.
  string name = 1;
  // dimension is organization / api_key / model.
  ReportDimension dimension = 2;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 30d. A range > 366 days is rejected (10404).
  int64 since = 3;
  int64 until = 4;
  // granularity is daily or hourly.
  ReportGranularity granularity = 5;
  // timezone is an IANA name, default UTC.
  string timezone = 6;
  // organization_id is an optional fleet filter on the admin surface;
  // absent means all orgs. On the user surface it is ignored (the
  // caller's org is implicit).
  string organization_id = 7;
}

message CreateReportResponse {
  taas.common.v1.Response response = 1;
  Report report = 2;
}

message GetReportRequest {
  string report_id = 1;
}

message GetReportResponse {
  taas.common.v1.Response response = 1;
  Report report = 2;
}

message ListReportsRequest {
  taas.common.v1.PageRequest page = 1;
  // dimension/status are optional filters.
  ReportDimension dimension = 2;
  string status = 3;
}

message ListReportsResponse {
  taas.common.v1.Response response = 1;
  repeated Report reports = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message DownloadReportRequest {
  string report_id = 1;
}

message DownloadReportResponse {
  taas.common.v1.Response response = 1;
  // csv is the UTF-8-BOM CSV content when status = ready.
  string csv = 2;
  // filename is the Content-Disposition filename.
  string filename = 3;
}

message CreateScheduleRequest {
  string name = 1;
  ReportDimension dimension = 2;
  RelativeRange relative_range = 3;
  ReportGranularity granularity = 4;
  ReportFrequency frequency = 5;
  string timezone = 6;
  // organization_id is an optional fleet filter on the admin surface;
  // absent means all orgs. On the user surface it is ignored.
  string organization_id = 7;
}

message CreateScheduleResponse {
  taas.common.v1.Response response = 1;
  ReportSchedule schedule = 2;
}

message ListSchedulesRequest {
  taas.common.v1.PageRequest page = 1;
  // organization_id is an optional admin filter.
  string organization_id = 2;
}

message ListSchedulesResponse {
  taas.common.v1.Response response = 1;
  repeated ReportSchedule schedules = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

message UpdateScheduleRequest {
  string schedule_id = 1;
  string name = 2;
  ReportFrequency frequency = 3;
  RelativeRange relative_range = 4;
}

message UpdateScheduleResponse {
  taas.common.v1.Response response = 1;
  ReportSchedule schedule = 2;
}

message DeleteScheduleRequest {
  string schedule_id = 1;
}

message DeleteScheduleResponse {
  taas.common.v1.Response response = 1;
}

message ListScheduleRunsRequest {
  taas.common.v1.PageRequest page = 1;
  string schedule_id = 2;
}

message ListScheduleRunsResponse {
  taas.common.v1.Response response = 1;
  repeated Report runs = 2;
  taas.common.v1.PageMeta page_meta = 3;
}

// Report is one report (on-demand or a scheduled run).
message Report {
  string report_id = 1;
  string name = 2;
  ReportDimension dimension = 3;
  int64 since = 4;
  int64 until = 5;
  ReportGranularity granularity = 6;
  string timezone = 7;
  string status = 8; // pending / ready / failed
  int64 row_count = 9;
  int64 data_through = 10;
  int64 created_at = 11;
  // schedule_id is set when the report is a scheduled run.
  string schedule_id = 12;
}

// ---- Cost analytics (feature #29) ----

message GetCostAnalyticsOverviewRequest {
  // organization_id is an optional fleet filter. On the admin surface
  // it is read from X-Organization-Id (or the session active org);
  // absent means fleet-wide (AD10).
  string organization_id = 1;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 24h. A range > 92 days is rejected (10404).
  int64 since = 2;
  int64 until = 3;
  // dimension is one of organization / model / api_key / user /
  // project (default organization). An unsupported value returns 11301
  // (AD2).
  string dimension = 4;
}

message GetCostAnalyticsOverviewResponse {
  taas.common.v1.Response response = 1;
  CostAnalyticsCard cards = 2;
  repeated CostBreakdownRow breakdown = 3;
  repeated CostSeriesPoint series = 4;
}

message GetCostAnalyticsRequest {
  // organization_id is derived from the session active org (user
  // binding) or X-Organization-Id (admin binding); the field exists for
  // gRPC-direct callers.
  string organization_id = 1;
  // dimension is one of organization / model / api_key / user /
  // project (admin) or model / api_key / user / project (user). An
  // unsupported value returns 11301 (AD2).
  string dimension = 2;
  // value is the dimension value (e.g. a model_id or api_key_id).
  string value = 3;
  // since/until bound the range, unix seconds. Defaults: until = now,
  // since = until - 24h. A range > 92 days is rejected (10404).
  int64 since = 4;
  int64 until = 5;
}

message GetCostAnalyticsResponse {
  taas.common.v1.Response response = 1;
  CostAnalyticsCard cards = 2;
  repeated CostSeriesPoint series = 3;
}

// CostAnalyticsCard is the headline summary of the range. cost_per_token
// and top_dimension_share_pct are derived client-side; the wire carries
// integer cents and integer tokens only.
message CostAnalyticsCard {
  int64 total_cost_cents = 1;
  // total_cost_micros is the same amount at 1e-6 currency precision, so a
  // sub-cent charge is not rounded away.
  int64 total_cost_micros = 6;
  int64 total_tokens = 2;
  // top_dimension_value is the top dimension value by cost.
  string top_dimension_value = 3;
  // top_dimension_share_pct is derived client-side as top value cost /
  // total cost.
  int64 top_dimension_share_pct = 4;
  // data_through is the start of the last complete bucket covered by
  // charge records (AD8); buckets past it are pending.
  int64 data_through = 5;
}

// CostBreakdownRow is one dimension value's aggregate in the breakdown.
message CostBreakdownRow {
  string dimension_value = 1;
  string dimension_name = 2;
  int64 total_cost_cents = 3;
  // total_cost_micros is the same amount at 1e-6 currency precision.
  int64 total_cost_micros = 7;
  int64 total_tokens = 4;
  // cost_per_token and share_pct are derived client-side.
  int64 cost_per_token = 5;
  int64 share_pct = 6;
}

// CostSeriesPoint is one time bucket of the series.
message CostSeriesPoint {
  // bucket is the bucket start, unix seconds (hourly for ranges <= 7
  // days, daily otherwise, AD6).
  int64 bucket = 1;
  int64 total_cost_cents = 2;
  // total_cost_micros is the same amount at 1e-6 currency precision.
  int64 total_cost_micros = 5;
  int64 total_tokens = 3;
  // cost_per_token is derived client-side as cost / tokens.
  int64 cost_per_token = 4;
}

// ReportSchedule is one scheduled report definition.
message ReportSchedule {
  string schedule_id = 1;
  string name = 2;
  ReportDimension dimension = 3;
  RelativeRange relative_range = 4;
  ReportGranularity granularity = 5;
  ReportFrequency frequency = 6;
  string timezone = 7;
  string status = 8; // active
  int64 last_run_at = 9;
  int64 created_at = 10;
}

// GetForecast returns the forecast for a time range and optional
// dimension filter (feature #36, AD2).
message GetForecastRequest {
  // since / until are unix seconds; defaults until = now, since =
  // until - 30d. A range > 92 days is rejected (10404).
  int64 since = 1;
  int64 until = 2;
  // dimension is one of organization/model/api_key (admin) or
  // model/api_key (user). An unsupported value returns 11301.
  string dimension = 3;
  // dimension_value is optional; when empty the forecast spans the
  // whole dimension.
  string dimension_value = 4;
  // horizon_days defaults to 30, max 90.
  int32 horizon_days = 5;
}

message ForecastBucket {
  int64 bucket = 1;
  int64 total_tokens = 2;
  int64 total_cost_cents = 3;
}

message ForecastPoint {
  int64 bucket = 1;
  int64 total_tokens = 2;
  int64 total_cost_cents = 3;
  int64 lower_tokens = 4;
  int64 upper_tokens = 5;
  int64 lower_cost_cents = 6;
  int64 upper_cost_cents = 7;
}

message ForecastSummary {
  int64 total_tokens = 1;
  int64 total_cost_cents = 2;
}

message GetForecastResponse {
  taas.common.v1.Response response = 1;
  // method is the forecast method, always "linear_trend".
  string method = 2;
  int32 horizon_days = 3;
  // data_through is the last complete bucket covered by the history.
  int64 data_through = 4;
  repeated ForecastBucket history = 5;
  repeated ForecastPoint forecast = 6;
  ForecastSummary summary = 7;
}
