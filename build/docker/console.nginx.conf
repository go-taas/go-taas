# nginx configuration for the standalone console image.
#
# The console is a history-routed SPA (no hash routing): every unknown
# path must fall back to index.html so deep links like /admin/models
# render the app. /api/ is reverse-proxied to the control-plane gateway
# (taas-server) so the console keeps the same-origin API access it has
# when served by the gateway binary.
#
# The gateway address is configurable at runtime via TASS_PROXY_PASS
# (default: http://taas-server:9091, the compose/K8s service name) using
# a template so the entrypoint can substitute it without rebuilding.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset names: immutable + long cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the REST gateway. nginx resolves the upstream name
    # at startup; a DNS change requires a container restart (standard
    # for compose/K8s deployments).
    location /api/ {
        proxy_pass ${TASS_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA history-routing fallback: unknown non-API paths serve
    # index.html (mirrors the gateway's embedded-console behavior).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
