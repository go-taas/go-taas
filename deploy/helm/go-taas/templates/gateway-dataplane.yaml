{{- if .Values.dataPlane.enabled }}
{{- $dp := .Values.dataPlane | default dict }}
{{- $gw := $dp.gateway | default dict }}
{{- $ep := $gw.envoyProxy | default dict }}
{{/*
The EnvoyProxy API version. Envoy Gateway moved the resource from
`gateway.envoyproxy.io` to `config.gateway.envoyproxy.io`; the installed CRD
decides which one the API server accepts and the Gateway's parametersRef must
name the same group, so both are derived from this one setting.
*/}}
{{- $epAPIVersion := $ep.apiVersion | default "config.gateway.envoyproxy.io/v1alpha1" }}
{{- $epGroup := $epAPIVersion | splitList "/" | first }}
{{/*
The dedicated data-plane Gateway.

Inference and management traffic must not share a proxy: the console is
served by the platform's Gateway, and this one carries only inference. It has
its own Envoy, its own addresses and its own lifecycle, so a control-plane
traffic spike, a reload or a bad config cannot take inference down - and the
reverse.

Two listeners, and the split is what keeps the cluster's own routes private:

  https     the only public listener. It terminates TLS for the hostname the
            console publishes and accepts routes from this namespace alone:
            the platform's data-plane route, which fronts the model router.
  internal  serves the routes that are not public but must be reachable from
            inside the cluster, such as the server's own internal API. It
            accepts routes from any namespace - but it is bound to a hostname
            in no DNS zone and has no certificate, so it is only reachable
            from inside the cluster. It must not be exposed by the
            LoadBalancer; `docs/` states that as a deployment prerequisite.

The EnvoyProxy pins the Envoy Service and Deployment names. The data-plane
route names that Service as its backend, and the runtime view reads the
Deployment by name; the Gateway reports only an address, which would leave the
route without a backend to name and the component unreported.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw.name | default "taas-inference" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
spec:
  gatewayClassName: {{ $gw.className | default "eg" }}
  infrastructure:
    parametersRef:
      group: {{ $epGroup }}
      kind: EnvoyProxy
      name: {{ $gw.name | default "taas-inference" }}
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $gw.tlsSecretName | default "taas-inference-tls" }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: internal
      port: 80
      protocol: HTTP
      hostname: {{ .Values.gatewayPlugin.internalHostname | default "taas-internal.invalid" | quote }}
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: {{ $epAPIVersion }}
kind: EnvoyProxy
metadata:
  name: {{ $gw.name | default "taas-inference" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-taas.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: {{ $gw.name | default "taas-inference" }}
        {{- with $gw.envoyService }}
        {{- with .loadBalancerIP }}
        loadBalancerIP: {{ . | quote }}
        {{- end }}
        {{- end }}
      envoyDeployment:
        name: {{ $gw.name | default "taas-inference" }}
{{- end }}
