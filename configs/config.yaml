# Shared configuration loaded by every binary. Values here can be
# overridden by environment variables prefixed with CONFIG_, e.g.
# CONFIG_DB_MASTER_HOST=postgres.

log:
  level: info
  encoding: console

db:
  master:
    host: 127.0.0.1
    port: 5432
    dbName: taas
    user: taas
    password: taas
    sslMode: disable
    maxOpenConns: 32
    maxIdleConns: 8
    connMaxLifetime: 30m
    debug: false

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  maxIdle: 8
  maxActive: 64
  idleTimeout: 5m

mq:
  # Driver selects the broker: "rabbitmq" or "fake" (in-memory, for local
  # development without a broker).
  driver: rabbitmq
  url: amqp://guest:guest@127.0.0.1:5672/
  namespace: taas-dev

auth:
  sessionTTL: 24h
  apiKeyCacheTTL: 30s
  apiKeyHash:
    algorithm: argon2id
    time: 1
    memoryMiB: 64
    parallelism: 1
  localPasswordLogin: true
  autoRegister: true
  # adminRoles is the set of session roles that make a user an
  # administrator (feature-22 AD3). A user is an admin iff any session
  # role is in the set.
  adminRoles:
    - platform-admin
    - org-admin
    - admin
    - owner

metering:
  # bufferSize/flushInterval are reserved for the future Redis metering
  # buffer (deferred; the MQ + DB path is used at v1).
  bufferSize: 1024
  flushInterval: 5s
  # settlement aggregates complete past hours into usage_records and
  # publishes settlement events to billing.settlements.
  settlement:
    enabled: true
    interval: 60s
    gracePeriod: 5m
    workers: 2
  # retention deletes settled vouchers older than voucherTTL, in
  # batches; usage records are never deleted.
  retention:
    enabled: true
    voucherTTL: 2160h
    batchSize: 1000
    interval: 1h
  # eventConsumer consumes metering.events from the data-plane
  # gateway and writes vouchers.
  eventConsumer:
    enabled: true
    workers: 2

# Distributed inference runtime (feature #47). The platform serving scheme
# (plain | aibrix) plus the runtime component + registered-model
# projections. The controller consumes collectInterval, the scheme and
# model-change consumers, and the aibrix block; the server consumes the
# snapshot consumer.
runtime:
  # collectInterval is the Controller's runtime-component and ModelClaim
  # collection period; the full snapshot is published on this interval.
  collectInterval: 30s
  # schemeBroadcastInterval is how often the runtime service re-broadcasts
  # the persisted scheme so a restarted Controller reconverges.
  schemeBroadcastInterval: 30s
  # schemeConsumer configures the Controller's scheme consumer.
  schemeConsumer:
    enabled: true
  # healthConsumer configures the runtime service's snapshot consumer.
  healthConsumer:
    enabled: true
    workers: 1
  # modelChangeConsumer configures the Controller's model-change consumer.
  modelChangeConsumer:
    enabled: true
  # aibrix names the installed AIBrix control plane's namespace and the
  # Envoy AI Gateway Deployment observed for health.
  aibrix:
    namespace: aibrix-system
    gateway: envoy-aibrix-system-aibrix-eg

# External model providers (feature #48). The provider module owns the
# third-party LLM provider registry, the encrypted write-only API keys,
# upstream-model curation, publishing into the model catalog and the
# scheduled connectivity probe.
provider:
  # secretEncryptionKey is the AES-256-GCM master key for provider-key
  # encryption at rest. Empty falls back to a dev-only key derived from
  # the MQ namespace; production must set it (mirrors the webhook rule).
  secretEncryptionKey: ""
  # probeInterval is the scheduled connectivity-probe period for enabled
  # providers.
  probeInterval: 60s
  # probeWorker configures the scheduled probe worker runner.
  probeWorker:
    # enabled is the incident-triage kill switch.
    enabled: true
    workers: 2
  # defaultRequestTimeoutSeconds is the default per-provider request
  # timeout when a request omits one (range 1-120).
  defaultRequestTimeoutSeconds: 10

# Intelligent model routing (feature #49). The routing module owns the
# routing-group registry (candidates, intent rules), the request-time
# virtual-name resolver and the decision log.
routing:
  # decisionRetentionDays is how long decision-log entries are kept
  # before deletion (range 1-90).
  decisionRetentionDays: 7
  # retention configures the decision-log retention runner.
  retention:
    # enabled is the incident-triage kill switch.
    enabled: true
    # batchSize is the number of rows deleted per retention pass.
    batchSize: 1000
    # interval is the ticker period between retention passes.
    interval: 1h
  # latencyWindow is the observed-latency sampling window for the
  # latency_priority strategy: the p50 of successful request logs
  # within this window.
  latencyWindow: 15m

# Cost optimization recommendations (feature #50). The optimization
# module owns the rule engine, the recommendation store and the
# refresh runner. All thresholds are config constants (design D3).
optimization:
  # refreshIntervalMinutes is the engine ticker period (FR1.2), range
  # 10-1440.
  refreshIntervalMinutes: 60
  # windowDays is the settled-data window every rule reads (D4), range
  # 7-90.
  windowDays: 30
  # topNPerOrg bounds the per-org persisted worklist (AD5), range
  # 10-200.
  topNPerOrg: 50
  # currency is the platform's single settlement currency.
  currency: CNY
  r1:
    minRequests: 1000
    minBilledTokens: 10000000
    contextRatio: 0.8
    minSaving: 100
  r2:
    minRequests: 1000
    offlineRatio: 0.9
    promptTokenFloor: 512
  r3:
    idleRequestsPerDay: 10
    idleWindowDays: 7
  r4:
    minPromptTokens: 1000000
    maxCacheHitRate: 0.05
    defaultHitAssumption: 0.5
  # modelContextLengths maps model name to max context tokens (AD12).
  # R1 only proposes substitutions between annotated models.
  modelContextLengths: {}
  # cardHourlyCosts maps accelerator type to hourly GPU cost (AD14).
  # R3 only prices services whose card type is annotated here.
  cardHourlyCosts: {}
  # peakHours is R2's peak-window list, each "HH:MM-HH:MM" (AD13).
  peakHours: ["09:00-18:00"]
  # peakWeekdaysOnly restricts the peak windows to Monday-Friday.
  peakWeekdaysOnly: true
  # timezone is the IANA name the peak windows are evaluated in.
  timezone: UTC
  # prefixCacheEngines lists the engines that support prefix caching
  # (AD15).
  prefixCacheEngines: ["vllm", "sglang"]

# Service quotas (feature #51). The four org quota dimensions live on
# the organization row; the gateway enforces the hot-path dimensions
# from the VerifyAPIKey verdict (contract pinned in the architecture
# doc), the control plane enforces the lifecycle dimensions at create.
quota:
  # timezone is the platform timezone the batch daily counter's local
  # midnight is evaluated in (AD15).
  timezone: UTC
  # requestIncreaseTo is the operator mailbox the tenant
  # Request-increase button mails to (AD18); empty hides the button.
  requestIncreaseTo: ""
  concurrencyConsumer:
    # enabled turns the gateway in-flight report consumer on or off.
    enabled: true
    # workers is the concurrent report handler count.
    workers: 2
    # staleAfter is how old a gateway in-flight report may be before
    # the snapshot reads as 0 (best-effort, FR2.4).
    staleAfter: 2m

# Feature #52: vGPU slicing pools. The vgpu module owns the pool
# configuration; membership and capacity are projections of the
# accelerator-inventory snapshot and the HAMI-reported device state.
vgpu:
  # membershipInterval bounds the freshness of the pool membership and
  # capacity projection (the accelerator-inventory interval, AD12).
  membershipInterval: 30s
  hami:
    # The HAMI resource/annotation names are configurable so a HAMI
    # version change is a config change, not a code change (Section 5.3).
    memResource: "nvidia.com/gpumem"
    coreResource: "nvidia.com/gpucores"
    policyAnnotation: "hami.io/gpu-scheduler-policy"
    poolLabelPrefix: "go-taas.com/vgpu-pool"

# Feature #53: fault diagnosis & automatic fault tolerance. The fault
# module owns the incident lifecycle, the deterministic root-cause
# classifier, and the recovery actions.
fault:
  # Debounce windows per signal type (FR3.2).
  debounce:
    crashLoopRestarts: 3
    crashLoopWindow: 3m
  # Incident retention window (FR1.4).
  retention: 720h
  recovery:
    # Default auto-recovery toggles (FR4.1); the policy page edits them.
    autoRestart:
      service_crash_loop: true
      oom: true
      image_pull_failure: true
    autoReschedule:
      node_not_ready: true
      accelerator_device_plugin: true
  signalsConsumer:
    enabled: true
    workers: 2

billing:
  # currency is the single platform billing currency (D4); price
  # entries, charge records and bills carry it.
  currency: "USD"
  # eventConsumer consumes metering.events and writes billing usage
  # lines (feature #5).
  eventConsumer:
    enabled: true
    workers: 2
  # settlementsConsumer consumes billing.settlements and charges each
  # settled key-hour.
  settlementsConsumer:
    enabled: true
    workers: 2
  # reconciliation is the charging safety net: it prices uncharged
  # hours even when settlement events are lost.
  reconciliation:
    enabled: true
    interval: 60s
    gracePeriod: 5m
    workers: 2
  # autoRecharge configures the feature-14 auto-recharge runner: it tops
  # up prepaid accounts whose balance falls below their threshold.
  autoRecharge:
    enabled: true
    interval: 1m
  # reports (feature-25): the billing-reports runners. The generator
  # picks up pending reports and renders their CSV; the schedule runner
  # materializes due schedules into pending report runs.
  reports:
    enabled: true
    generatorInterval: 5s
    scheduleInterval: 1m
  # forecast (feature #36): the usage & cost forecasting bounds.
  forecast:
    horizonDefaultDays: 30
    horizonMaxDays: 90
    rangeMaxDays: 92

infer:
  # endpointBaseURL composes the endpoint URL reported for running
  # services. Empty means the controller falls back to the in-cluster
  # Service DNS name.
  endpointBaseURL: ""
  statusConsumer:
    enabled: true
    workers: 2
  # autoscaling (feature #16): the concurrency-metric consumer and the
  # controller's autoscaling status-report interval.
  autoscaling:
    concurrencyConsumer:
      enabled: true
      workers: 2
    statusReportInterval: 5s

tenancy:
  # The organization seeded on first boot (when the organizations table
  # is empty at startup, insert-only, never re-seeded).
  defaultOrgId: "org-default"
  defaultOrgDisplayName: "Default Organization"

audit:
  # retention deletes audit events older than eventTTL, in batches
  # (feature #15, AD6). Audit events have compliance value and a longer
  # window than request logs.
  retention:
    enabled: true
    eventTTL: 8760h
    batchSize: 1000
    interval: 1h
  # exportMaxRows caps the synchronous CSV/JSON export (AD7).
  exportMaxRows: 10000

model:
  # auth holds the data-plane per-(org, model) authorization cache
  # (feature #13, AD6). cacheTTL bounds how long a revoked organization
  # may keep calling a restricted model before the gate rejects it again.
  auth:
    cacheTTL: 5s
  # weightsDir is the local directory (a JuiceFS mount) where model
  # weights downloaded from a model hub are written. Empty disables the
  # model-download feature. In the compose stack this is the JuiceFS
  # mount shared with the inference pods.
  weightsDir: ""

image:
  # registry is the first-boot seed of the images table (feature #3:
  # the table is the source of truth; this seed is read only when the
  # table is empty at startup, insert-only, preserving imageId values).
  registry:
    - imageId: "img-vllm-nvidia-v063"
      name: "ghcr.io/go-taas/vllm"
      tag: "v0.6.3"
      accelerator: "nvidia"
      engine: "vllm"
    - imageId: "img-vllm-iluvatar-v063"
      name: "ghcr.io/go-taas/vllm-iluvatar"
      tag: "v0.6.3"
      accelerator: "iluvatar"
      engine: "vllm"
    - imageId: "img-sglang-metax-v014"
      name: "ghcr.io/go-taas/sglang"
      tag: "v0.1.4"
      accelerator: "metax"
      engine: "sglang"
  # warmupStatusConsumer applies controller-reported warmup task
  # outcomes to the warmup_tasks table.
  warmupStatusConsumer:
    enabled: true
    workers: 2
  # compatibility configures the model × engine × card-type matrix
  # (feature #19, AD3).
  compatibility:
    # seedOnBoot seeds the compatibility_cells table on first boot when
    # it is empty. Disable to skip the first-boot seed entirely.
    seedOnBoot: true
    # lazySeedDefault is the default status applied to a lazily-created
    # cell. It is overridden by the vendor-match rule: vendor-matched
    # combos default to experimental, vendor-mismatched to unsupported.
    lazySeedDefault: "experimental"
  # harbor configures the internal container registry (Harbor) that
  # imported images are pushed to. Imported images always land in the
  # configured project (default "taas"). In the compose stack these are
  # read from the .env file (HARBOR_URL / HARBOR_USERNAME /
  # HARBOR_PASSWORD).
  harbor:
    url: ""
    username: ""
    password: ""
    project: "taas"

accelerator:
  # collectInterval is the Controller's node/GPU collection period; the
  # full snapshot is published on this interval (feature #18, AD1).
  collectInterval: 30s
  # snapshotConsumer configures the accelerator service's snapshot
  # consumer Runner (kill switch + worker count).
  snapshotConsumer:
    enabled: true
    workers: 1

# Feature #20: inference load testing. The runner persists a live
# progress snapshot every progressInterval, keeps terminal runs for
# retention, and drives traffic with the synthetic platform credential
# (systemCredentialEnabled is the kill switch; when false CreateLoadTest
# returns 10311).
loadtest:
  progressInterval: 5s
  retention: 2160h
  systemCredentialEnabled: true

controller:
  workers: 4
  maxRetries: 5

# Feature #27: request tracing. The best-effort trace capture writes
# traces + trace_spans alongside the request log; the retention runner
# deletes traces older than traceTTL (30 days, AD5).
tracing:
  retention:
    traceTTL: 720h
